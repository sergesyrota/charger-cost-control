[platformio]
default_envs = c3

[env:c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
; project variant = esp32c3 minus RGB_BUILTIN (saves the RMT/RGB-LED code)
board_build.variants_dir = variants
board_build.variant = supermini
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
monitor_speed = 115200
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
monitor_filters = esp32_exception_decoder
extra_scripts =
  pre:tools/version.py
  pre:tools/build_ui.py
; No C++ exceptions (nothing catches; saves ~84 KB of unwind tables). Never use try/catch.
build_unflags = -fexceptions
; Size wraps (src/size_wraps.c): numeric error codes instead of the mbedtls/esp_err name tables,
; no WiFiProv deinit, no Arduino chip-debug report (never printed at CORE_DEBUG_LEVEL=1).
; After editing include/nimble_trim.h run `pio run -e c3 -t clean`: PIO doesn't track -include deps.
build_flags =
  -fno-exceptions
  -Wl,--wrap=mbedtls_strerror
  -Wl,--wrap=esp_err_to_name
  -Wl,--wrap=network_prov_mgr_deinit
  -Wl,--wrap=_Z20printBeforeSetupInfov
  -Wl,--wrap=_Z19printAfterSetupInfov
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_ASYNC_TCP_STACK_SIZE=7168
  -include $PROJECT_DIR/include/nimble_trim.h
; RAM: a GitHub TLS handshake used ~110 KB of ~118 KB free (OTA failed ~50%). TLS buffers, task
; stacks (measured high-water marks), Wi-Fi buffer counts, IPv6/PPP off. Rebuilds the Arduino
; libs from ESP-IDF on first build (slow). Out buffer 4 KB, dynamic buffers, no peer-cert retention.
custom_sdkconfig =
  CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
  CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
  CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
  CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
  CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=y
  CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT=y
  CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE=n
  CONFIG_MBEDTLS_TLS_CLIENT_ONLY=y
  CONFIG_MBEDTLS_TLS_SERVER_AND_CLIENT=n
  CONFIG_MBEDTLS_SSL_RENEGOTIATION=n
  CONFIG_MBEDTLS_SSL_PROTO_DTLS=n
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=3584
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2048
  CONFIG_MDNS_TASK_STACK_SIZE=3072
  CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=4
  CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=16
  CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=16
  CONFIG_LWIP_PPP_SUPPORT=n
lib_deps =
  core
  h2zero/NimBLE-Arduino@^2.3.0
  bblanchon/ArduinoJson@^7.4.0
  ESP32Async/AsyncTCP@^3.4.0
  ESP32Async/ESPAsyncWebServer@^3.8.0

; Host unit tests for lib/core (pure logic). Sparse by owner request: only high-value cases.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DUNITY_INCLUDE_DOUBLE
lib_deps =
  core
  bblanchon/ArduinoJson@^7.4.0
