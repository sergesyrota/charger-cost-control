<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Charger — Option 1: Now / Rules / History / Device</title>
<style>
:root{
  --bg:#f4f1eb;--surface:#fffdf9;--surface2:#f8f5ef;--ink:#26231f;--ink2:#5b544b;--muted:#8a8277;--line:#e6e0d5;
  --accent:#1c7a67;--accent-ink:#fff;--accent-soft:#dcede6;--accent-faint:rgba(28,122,103,.10);
  --warn:#9a5b14;--warn-soft:#f7ead6;--err:#b23d2c;--err-soft:#f8e1dc;
  --shadow:0 1px 2px rgba(70,55,30,.04),0 6px 20px rgba(70,55,30,.05);--r:16px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#191815;--surface:#22201d;--surface2:#2a2824;--ink:#ede8df;--ink2:#c2b9ad;--muted:#948b80;--line:#35322d;
  --accent:#5cc0a8;--accent-ink:#0d1f1a;--accent-soft:#1d3530;--accent-faint:rgba(92,192,168,.13);
  --warn:#e2a65e;--warn-soft:#3a2e1f;--err:#ec7f6c;--err-soft:#3d2420;--shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:84px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 16px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.topbar a{color:var(--muted);text-decoration:none}.topbar a:hover{color:var(--ink)}
.topbar .sp{flex:1}
.topbar .clk{font-variant-numeric:tabular-nums}
.layout{display:block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:600}
main{max-width:780px;margin:0 auto;padding:20px 16px 32px}
@media (min-width:900px){
  body{padding-bottom:0}
  .layout{display:grid;grid-template-columns:208px 1fr;min-height:calc(100vh - 38px)}
  nav.tabs{position:sticky;top:0;align-self:start;height:calc(100vh - 38px);flex-direction:column;border-top:0;border-right:1px solid var(--line);background:transparent;padding:24px 12px;gap:4px}
  nav.tabs button{flex:0;flex-direction:row;gap:12px;padding:10px 14px;font-size:15px;border-radius:10px;justify-content:flex-start}
  nav.tabs button.on{background:var(--accent-soft)}
  nav.tabs .brand{display:block}
  main{padding:32px 40px 64px;margin:0}
}
nav.tabs .brand{display:none;font-weight:650;font-size:17px;padding:0 14px 18px;color:var(--ink)}
nav.tabs .brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
h1{font-size:22px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
h2{font-size:16px;margin:0;font-weight:640}
h3{font-size:13px;margin:18px 0 8px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lede{color:var(--ink2);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.muted{color:var(--muted)}.small{font-size:13px}.ink2{color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:620px){.grid2{grid-template-columns:1fr 1fr}.grid2>.card{margin-bottom:0}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:550;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding:6px 8px}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;line-height:0}
.icon-btn:hover{color:var(--err);background:var(--err-soft)}
input[type=text],input[type=number],input[type=password],input[type=time],input[type=url],select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0;font-size:15px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input.bad{border-color:var(--err);background:var(--err-soft)}
.err{color:var(--err);font-size:12.5px;min-height:0}
.err:empty{display:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
label.f>input,label.f>select{color:var(--ink)}
.fields{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:620px){.fields.two{grid-template-columns:1fr 1fr}}
.hint{font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.pill.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.pill.on .dot{animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
/* hero */
.hero{padding:22px 20px 18px}
.hero .eyebrow{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px;font-size:13px;color:var(--muted)}
.hero .say{font-size:27px;line-height:1.22;font-weight:650;letter-spacing:-.015em;margin:0}
.hero .say em{font-style:normal;color:var(--accent)}
.hero .say.off em{color:var(--ink)}
.hero .next{font-size:17px;color:var(--ink2);margin:8px 0 0}
@media (min-width:620px){.hero .say{font-size:32px}}
.why{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.why button{border:1px dashed var(--line);background:none;border-radius:99px;padding:3px 10px;font-size:12.5px;color:var(--ink2);cursor:pointer}
.why button:hover{border-color:var(--accent);color:var(--accent)}
/* strip */
.strip{margin-top:18px}
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart .lab{position:absolute;font-size:11px;color:var(--muted);white-space:nowrap;transform:translateX(-50%);font-variant-numeric:tabular-nums;pointer-events:none}
.chart .ylab{position:absolute;font-size:11px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums;pointer-events:none}
.chart .tl{position:absolute;right:0;font-size:11px;font-weight:600;transform:translateY(-100%);padding:0 2px 1px;background:var(--surface);border-radius:4px;pointer-events:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:22px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px;background:var(--muted)}
.legend i.box{height:10px;background:var(--accent-faint);border:1px solid var(--accent-soft)}
.strip-empty{margin-top:16px;padding:16px;border-radius:12px;background:var(--surface2);color:var(--muted);font-size:14px;text-align:center}
/* banner */
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;font-size:14px}
.banner b{color:var(--ink)}
.banner .grow{flex:1;color:var(--ink2)}
.banner svg{flex:none;margin-top:2px}
/* segmented */
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;border:0;background:none;border-radius:9px;padding:8px 10px;font-size:13.5px;font-weight:560;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on.man{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-faint);font-weight:600}
.chip:disabled{opacity:.45;cursor:not-allowed}
.chips input[type=time]{padding:4px 8px;font-size:13px;border-radius:99px}
/* car & price */
.big{font-size:34px;font-weight:650;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.socbar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin:10px 0 4px;position:relative}
.socbar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.socbar .tg{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.carline{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);margin-bottom:8px}
.sep{height:1px;background:var(--line);margin:14px 0}
.footline{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
.footline button{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:12.5px}
/* rules */
.order{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:20px}
.order span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 9px}
.order i{font-style:normal;color:var(--muted)}
.win{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface2)}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{width:36px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12.5px;color:var(--ink2)}
.days button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.state{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--surface)}
.state.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-faint)}
.state .sh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.state .sname{font-size:17px;font-weight:650;border:1px solid transparent;background:none;padding:4px 6px;margin-left:-6px;border-radius:8px;flex:1;min-width:0}
.state .sname:hover{border-color:var(--line)}
.plain{color:var(--ink2);font-size:14px;margin:0 0 10px}
.cond,.blk{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;padding:6px 0}
.cond select{width:66px}.cond input{width:74px}
.blk{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:start}
.blk.act{background:var(--accent-faint);border-radius:10px;padding:10px;border-top-color:transparent;margin:2px -10px}
.blk .bf{display:flex;gap:8px;flex-wrap:wrap}
.blk .bf label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
.blk .bf input{width:78px}
.blk .bp{grid-column:1/-1;font-size:13.5px;color:var(--ink2)}
.blk .bp b{color:var(--ink);font-weight:600}
.inunit{position:relative;display:inline-flex}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}
.warnbox:empty{display:none}
.nowuse{background:var(--accent-faint);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px;color:var(--ink2)}
.nowuse b{color:var(--ink)}
.savebar{position:sticky;bottom:72px;z-index:15;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;margin-top:8px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.savebar .grow{flex:1;font-size:14px}
.savebar .btn{border-color:transparent}
.savebar .btn.ghost{color:var(--bg)}
@media (min-width:900px){.savebar{bottom:16px}}
textarea.json{width:100%;min-height:240px;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font-weight:600}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:after{content:"›";transform:rotate(90deg);color:var(--muted);font-size:20px;transition:transform .2s}
details.fold[open]>summary:after{transform:rotate(-90deg)}
details.fold[open]>summary{margin-bottom:12px}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;cursor:pointer;transition:.2s}
.switch span:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:after{transform:translateX(18px)}
/* history */
.bars{display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0}
.bars i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 1px 1px;min-height:2px;opacity:.85}
.bars div.today i{opacity:1;background:var(--ink)}
.bars span{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;padding-right:0}
.tablewrap{overflow-x:auto}
.log{list-style:none;margin:0;padding:0;font-size:13.5px}
.log li{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:1px}
.log .k{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--muted)}
.log .k.relay{background:var(--accent)}.log .k.err{background:var(--err)}.log .k.push{background:var(--warn)}
/* device */
.netlist{list-style:none;padding:0;margin:10px 0 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.netlist li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.netlist li:last-child{border-bottom:0}
.netlist li:hover,.netlist li.on{background:var(--accent-faint)}
.netlist .grow{flex:1}
.progress{height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin:10px 0 4px}
.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.notice{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px}
/* demo + toast */
.demo{position:fixed;right:12px;bottom:80px;z-index:30;font-size:13px;transition:bottom .2s}
body.lift .demo{bottom:140px}
@media (min-width:900px){.demo,body.lift .demo{bottom:16px;right:16px}body.lift .demo{bottom:80px}}
.demo>button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:6px 12px;cursor:pointer;box-shadow:var(--shadow);font-size:12.5px}
.demo .panel{position:absolute;right:0;bottom:40px;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.demo .panel p{margin:4px 8px 6px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.demo .panel button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13.5px}
.demo .panel button:hover{background:var(--surface2)}
.demo .panel button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;transition:.25s;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){.toast{bottom:24px}}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="topbar"><a href="index.html">← all options</a><span class="sp"></span><span id="tb-wifi"></span><span class="clk" id="tb-clock"></span></div>
<div class="layout">
  <nav class="tabs" id="tabs">
    <div class="brand">Charger<small>Bolt · ComEd hourly</small></div>
    <button data-tab="now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 2 4.5 13.5H12L11 22l8.5-11.5H12z"/></svg>Now</button>
    <button data-tab="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>Rules</button>
    <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 16l5-6 4 3 7-8"/></svg>History</button>
    <button data-tab="device"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4" stroke-linecap="round"/></svg>Device</button>
  </nav>
  <main id="main"></main>
</div>
<div class="demo" id="demo"><button data-act="demo-toggle">Demo scenario ▴</button><div class="panel hidden" id="demo-panel"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=v=>Math.round(v*10)/10;
const fc=v=>v==null||isNaN(v)?'—':(v<0?'−':'')+Math.abs(r1(v))+'¢';
const clone=o=>JSON.parse(JSON.stringify(o));
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const OPS=['>=','>','<=','<'];
const OPTXT={'>=':'≥','>':'>','<=':'≤','<':'<'};
const hm2m=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
const m2hm=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
function ago(min){if(min==null)return 'never';if(min<1)return 'just now';if(min<60)return Math.round(min)+' min ago';const h=Math.floor(min/60);return h<24?h+' h '+(Math.round(min%60)?Math.round(min%60)+' min ':'')+'ago':Math.floor(h/24)+' d ago'}
function rnd(i){const x=Math.sin(i*12.9898+78.233)*43758.5453;return x-Math.floor(x)}

/* ---------- mock API data ---------- */

const LOGIC_JSON={"states":{

/* ---------- price math (PLAN §6.2) ---------- */
function lowest7(){const st=S.st;if(!st.pricesOk)return null;const h=st.now.h;
  const a=h<17?DA_TODAY.slice(0,8):DA_TODAY.slice((h+1)%24,24).concat(DA_TOM.slice(0,8));
  const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?r1(Math.min(...v)):null}
function minPrice(){const l=lowest7();return l==null?null:r1(l+Number(S.cfg.minOffset))}
const resolve=v=>v==='min'?minPrice():Number(v);
const cmp=(a,op,b)=>op==='>='?a>=b:op==='>'?a>b:op==='<='?a<=b:a<b;
const socNow=()=>S.st.car.soc==null?0:S.st.car.soc;

/* ---------- decision engine (PLAN §7) ---------- */
function pickState(L,soc,commit){
  if(L.state_select){const i=L.states.findIndex(s=>s.name===L.state_select);if(i>=0)return{i,forced:true}}
  for(let i=0;i<L.states.length;i++){const s=L.states[i];if(!s.entry.length)continue;
    if(s.entry.every(c=>cmp(soc,c.op,Number(c.value)))){if(commit)S.st.sticky=s.name;return{i,forced:false}}}
  let i=L.states.findIndex(s=>s.name===S.st.sticky);
  return{i,forced:false,sticky:true};
}
function pickBlock(blocks,soc){for(let j=0;j<blocks.length;j++)if(soc>=Number(blocks[j].soc))return j;return blocks.length-1}
function logicNow(commit){
  const L=S.logic,soc=socNow(),p=pickState(L,soc,commit);if(p.i<0)return null;
  let s=L.states[p.i];let blocks=s.blocks;
  if(!blocks.length){const d=L.states.find(x=>x.name==='default');if(!d||!d.blocks.length)return null;blocks=d.blocks}
  const j=pickBlock(blocks,soc),b=blocks[j];
  return{si:p.i,name:s.name,forced:p.forced,bi:j,block:b,on:resolve(b.on),off:resolve(b.off),onMin:b.on==='min',offMin:b.off==='min',km:b.km===''||b.km==null?0:Number(b.km),range:blockRange(blocks,j)};
}
function blockRange(blocks,j){
  const sorted=blocks.map((b,i)=>({s:Number(b.soc),i})).sort((a,b)=>b.s-a.s);const k=sorted.findIndex(x=>x.i===j);
  const lo=sorted[k].s,hi=k>0?sorted[k-1].s:null,last=k===sorted.length-1;
  if(hi==null&&(lo<=0||last&&lo<=0))return 'any battery level';
  if(hi==null)return lo+'% and up';
  if(last&&lo<=0)return 'below '+hi+'%';
  return lo+'–'+hi+'%';
}
function inWindow(w,d,min){const s=hm2m(w.start),e=hm2m(w.end);
  if(s<e)return w.days.includes(d)&&min>=s&&min<e;
  return (w.days.includes(d)&&min>=s)||(w.days.includes((d+6)%7)&&min<e);}
function activeWindow(){const n=S.st.now,m=n.h*60+n.m;return S.cfg.schedule.find(w=>inWindow(w,n.d,m))}
function daysLabel(days){const d=[...days].sort((a,b)=>((a+6)%7)-((b+6)%7));if(!d.length)return 'no days';
  const k=d.map(x=>(x+6)%7);if(k.length===7)return 'Every day';if(k.join()==='0,1,2,3,4')return 'Mon–Fri';if(k.join()==='5,6')return 'Sat–Sun';
  const out=[];let a=0;for(let i=1;i<=k.length;i++){if(i===k.length||k[i]!==k[i-1]+1){out.push(i-1-a>=2?DOW[(k[a]+1)%7]+'–'+DOW[(k[i-1]+1)%7]:k.slice(a,i).map(x=>DOW[(x+1)%7]).join(', '));a=i}}return out.join(', ')}
const winLabel=w=>daysLabel(w.days)+' '+w.start+'–'+w.end;
const MODE_NAME={auto:'Auto (price)',sched:'Schedule',schedprice:'Schedule + price'};

function decide(commit){
  const st=S.st,c=S.cfg,o=st.override,def=c.defaultRelay==='on',D={relay:def,src:'default',rule:null};
  if(o){D.relay=o.mode==='on';D.src='manual';D.reason='manual '+o.mode.toUpperCase()+(o.until?' until '+o.until:'');
    D.next=o.until?'Returns to '+MODE_NAME[c.mode]+' at '+o.until+'.':'Stays this way until you pick another mode.';return D}
  if(!st.clockValid){D.reason='the clock isn’t set yet';D.next='Waiting for NTP and ComEd prices — using the default ('+(def?'ON':'OFF')+') until then.';return D}
  const soc=st.car.soc;
  if(soc!=null&&Math.round(soc)>=100){D.relay=false;D.src='overlay';D.reason='the Bolt is full';D.next='Stays off until the battery drops.';return D}
  if(soc!=null&&c.socTargetOn&&soc>=c.socTarget){D.relay=false;D.src='overlay';D.reason='SOC target '+c.socTarget+'% reached';D.next='Stays off until the battery is below '+c.socTarget+'%.';return D}
  if(c.mode!=='auto'){const w=activeWindow();
    if(w){D.relay=true;D.src='schedule';D.reason='scheduled window '+winLabel(w);D.next='Window ends at '+w.end+'.'+(c.mode==='schedprice'?' Price rules take over after that.':'');return D}
    if(c.mode==='sched'){D.relay=false;D.src='schedule';D.reason='outside schedule windows';const nx=nextWindowStart();D.next=nx?'Next window starts '+nx+'.':'No schedule windows set — add one in Rules.';return D}}
  if(!st.pricesOk||st.price==null){D.reason='there’s no current price';D.next='Using the default ('+(def?'ON':'OFF')+') until ComEd prices load.';return D}
  const L=logicNow(commit);if(!L){D.reason='no price rule applies';D.next='Check Rules — current state has no charging blocks.';return D}
  D.src='price';D.rule=L;const p=st.price,enough=!L.km||st.now.m>=L.km;let relay=st.relay;
  if(relay&&p>L.off){relay=false;D.reason='price is high ('+fc(p)+' > '+fc(L.off)+')'}
  else if(relay&&!enough){relay=false;D.reason='not enough confidence yet (before :'+pad(L.km)+')'}
  else if(!relay&&p<=L.on&&enough){relay=true;D.reason='price is low ('+fc(p)+' ≤ '+fc(L.on)+')'}
  else if(relay){D.reason=p<=L.on?'price is low ('+fc(p)+' ≤ '+fc(L.on)+')':'price is still under the stop level ('+fc(p)+' ≤ '+fc(L.off)+')'}
  else if(p<=L.on){D.reason='price is low, waiting for confidence';D.next='Starts at :'+pad(L.km)+' if the hour’s average holds at ≤ '+fc(L.on)+'.'}
  else D.reason='price is high ('+fc(p)+' > '+fc(L.on)+' start level)';
  D.relay=relay;
  if(!D.next)D.next=relay?'Will stop above '+fc(L.off)+'.':'Will start at ≤ '+fc(L.on)+'.';
  return D;
}
function nextWindowStart(){const n=S.st.now;const base=n.h*60+n.m;for(let k=1;k<=7*24*4;k++){const t=base+k*15,d=(n.d+Math.floor(t/1440))%7,m=t%1440;
  if(S.cfg.schedule.some(w=>w.days.includes(d)&&hm2m(w.start)===m))return(t>=1440?DOW[d]+' ':'at ')+m2hm(m)}return null}

function evaluate(silent,cause){
  const prev=S.st.relay,D=decide(true);S.st.last=D;
  if(D.relay!==prev){S.st.relay=D.relay;const car=S.st.car;
    if(D.relay&&(car.status==='online'||car.status==='asleep')){car.status='charging';car.kw=6.8;car.seen=0;car.sessKwh=0;car.sessCost=0;car.sessStart=nowHM()}
    if(!D.relay&&car.status==='charging'){car.status='online';car.kw=0}
    if(!silent){const pre=D.src==='manual'?'Manual: ':'';const msg=(D.relay?'ON':'OFF')+': '+pre+cap(D.reason)+'.';
      S.log.unshift({t:nowHM(),k:'relay',m:'Relay '+(D.relay?'ON':'OFF')+' — '+D.reason+(cause?' ('+cause+')':'')});
      if(S.cfg.push.enabled&&S.cfg.push.token&&S.cfg.push.user){S.log.unshift({t:nowHM(),k:'push',m:'Pushover sent: “'+msg+'”'});toast('Relay '+(D.relay?'ON':'OFF')+' · notification sent')}
      else toast('Relay '+(D.relay?'ON':'OFF'))}}
  return D;
}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const nowHM=()=>S.st.clockValid?pad(S.st.now.h)+':'+pad(S.st.now.m):'up 0:00:'+pad(47);

/* ---------- forecast (strip) ---------- */
function series24(){const st=S.st,out=[];for(let i=0;i<24;i++){const t=st.now.h+i,h=t%24,tom=t>=24;
  out.push({h,tom,v:i===0?st.price:(tom?(st.now.h>=17?DA_TOM[h]:null):DA_TODAY[h])})}return out}
function predict(ser,D){
  const st=S.st,c=S.cfg,o=st.override,L=D.rule||logicNow(false);let relay=st.relay;const nowM=st.now.h*60;
  return ser.map((x,i)=>{const absM=nowM+i*60,d=(st.now.d+Math.floor(absM/1440))%7,m=absM%1440+30;
    if(o){const left=o.until?((hm2m(o.until)-(st.now.h*60+st.now.m))+1440)%1440:1e9;if(i*60+30-st.now.m<left)return relay=o.mode==='on'}
    if(c.mode!=='auto'&&c.schedule.some(w=>inWindow(w,d,m)))return relay=true;
    if(c.mode==='sched')return relay=false;
    if(!L||x.v==null)return null;
    if(relay&&x.v>L.off)relay=false;else if(!relay&&x.v<=L.on)relay=true;return relay});
}
function runs(on,ser){const r=[];let s=-1;for(let i=0;i<=on.length;i++){if(on[i]===true&&s<0)s=i;if(on[i]!==true&&s>=0){r.push({a:s,b:i});s=-1}}
  return r.map(x=>({a:x.a,b:x.b,from:pad(ser[x.a].h)+':00',to:pad((ser[0].h+x.b)%24)+':00'}))}

/* ---------- rendering ---------- */
function render(){
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const st=S.st;
  $('#tb-clock').textContent=st.clockValid?DOW[st.now.d]+' '+pad(st.now.h)+':'+pad(st.now.m):'clock not set';
  $('#tb-wifi').textContent=st.wifi.ssid+' '+st.wifi.rssi+' dBm';
  const m=$('#main');
  m.innerHTML=tab==='now'?vNow():tab==='rules'?vRules():tab==='history'?vHistory():vDevice();
  $('#demo-panel').innerHTML='<p>Demo scenario</p>'+SCEN.map(s=>`<button data-act="scen" data-id="${s.id}" class="${s.id===scen?'on':''}">${s.id}. ${esc(s.name)}<br><span class="small muted">${esc(s.sub)}</span></button>`).join('');
  document.body.classList.remove('lift');
  if(tab==='rules')validateRules();
}

function vNow(){
  const st=S.st,D=st.last,car=st.car,c=S.cfg;
  const charging=car.status==='charging';
  const verb=D.relay?(charging?'Charging':'Charger is on'):'Not charging';
  let html='';
  if(D.relay&&!charging){html+=`<div class="banner">${ICON_WARN}<div class="grow"><b>Relay is ON but the car isn’t charging.</b><br>${car.status==='not_detected'?'Car not detected over Bluetooth — is it home and plugged in?':'Car is online but drawing &lt; '+c.threshold+' W — check the plug or the car’s charge settings.'} <span class="muted">Shown here only; no notification is sent.</span></div><button class="btn sm" data-act="poll" ${ui.polling?'disabled':''}>${ui.polling?'Polling…':'Poll car now'}</button></div>`}
  // hero
  const ser=st.pricesOk&&st.clockValid?series24():null,on=ser?predict(ser,D):null,rs=on?runs(on,ser):[];
  let nextTxt='';
  if(on){if(D.relay){const r0=rs[0];nextTxt=r0&&r0.a===0?(r0.b>=24?'On for the whole forecast':'Likely on until ≈ '+r0.to):''}
    else{const r=rs.find(x=>x.a>0);nextTxt=r?'Next ON ≈ '+r.from+'–'+r.to:'No ON window in the forecast'+(st.now.h<17?' (tomorrow’s prices arrive ~17:00)':'')}}
  const srcTxt=D.src==='manual'?'Manual override':D.src==='schedule'?MODE_NAME[c.mode]:D.src==='price'?MODE_NAME[c.mode]:D.src==='overlay'?'Battery limit':'Default state';
  html+=`<section class="card hero">
   <div class="eyebrow"><span>${st.clockValid?'Now · '+DOW[st.now.d]+' '+pad(st.now.h)+':'+pad(st.now.m):'Now · clock not set'}</span>
   <span class="pill ${D.relay?'on':''}"><span class="dot"></span>Relay ${D.relay?'ON':'OFF'}</span></div>
   <p class="say ${D.relay?'':'off'}"><em>${verb}</em> — ${esc(D.reason)}.</p>
   <p class="next">${esc(D.next)}${nextTxt&&!D.relay&&D.src!=='manual'?' <span class="muted">'+esc(nextTxt)+'.</span>':''}</p>
   <div class="why"><button data-act="go" data-to="rules">${esc(srcTxt)}</button>${D.rule?`<button data-act="go" data-to="rules">${esc(D.rule.name)}${D.rule.forced?' (forced)':''} · ${esc(D.rule.range)}</button>`:''}${c.socTargetOn?`<button data-act="go" data-to="rules">Stop at ${c.socTarget}%</button>`:''}</div>
   ${ser?stripChart(ser,on,D,nextTxt):`<div class="strip-empty">${st.clockValid?'No price data yet':'No clock yet'} — the 24-hour price outlook appears once the clock is set and ComEd prices load.</div>`}
  </section>`;
  // mode control

function saveCard(card){

    if(p.enabled&&!/^[A-Za-z0-9]{30}$/.test(p.user))errs.user='User keys are 30 letters/digits';upd={push:p}}

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
  const a=e.target.closest('[data-act]');

  if(!a)return;const d=a.dataset,act=d.act,st=S.st;
  if(act==='demo-toggle'){$('#demo-panel').classList.toggle('hidden');return}
  if(act==='scen'){loadScenario(+d.id);$('#demo-panel').classList.add('hidden');toast('Scenario: '+SCEN[d.id-1].name);return}
  if(act==='go'){tab=d.to;render();window.scrollTo(0,0);return}
  if(act==='mode'){const m=d.m;
    if(m==='on'||m==='off'){if(st.override&&st.override.mode===m)return;st.override={mode:m,until:null};evaluate(false,'set from web UI')}
    else{st.override=null;S.cfg.mode=m;evaluate(false,'mode → '+MODE_NAME[m])}
    S.log.unshift({t:nowHM(),k:'info',m:'Mode set to '+(st.override?'Manual '+st.override.mode.toUpperCase():MODE_NAME[m])+' (POST /api/override)'});render();return}
  if(act==='until'){st.override.until=d.v||null;S.st.last=decide(false);render();toast(d.v?'Override until '+d.v:'Override until you change it');return}
  if(act==='poll'){if(ui.polling)return;ui.polling=true;render();setTimeout(()=>{ui.polling=false;const c=st.car;let m;
      if(c.status==='not_detected')m='Car not detected (BLE timeout)';else if(c.status==='asleep'||c.status==='unknown'){c.status='asleep';c.seen=0;m='Car is asleep (no data) — SOC '+c.soc+'% kept'}

      S.log.unshift({t:nowHM(),k:'info',m:'Manual poll: '+m});toast(m);render()},1300);return}
  // rules
  if(act==='day'){const w=R.schedule[+d.w],dd=+d.d;w.days=w.days.includes(dd)?w.days.filter(x=>x!==dd):[...w.days,dd];R.dirty=true;render();return}
  if(act==='addwin'){R.schedule.push({days:[0,6],start:'00:00',end:'06:00'});R.dirty=true;render();return}
  if(act==='delwin'){R.schedule.splice(+d.w,1);R.dirty=true;render();return}
  if(act==='addstate'){let n='Новое состояние',k=2;while(R.logic.states.some(s=>s.name===n))n='Новое состояние '+k++;R.logic.states.push({name:n,entry:[],blocks:[{soc:0,on:2,off:3,km:''}]});R.dirty=true;render();return}
  if(act==='delstate'){const s=R.logic.states[+d.s];if(!confirm('Delete state “'+s.name+'”?'))return;if(R.logic.state_select===s.name)R.logic.state_select='';R.logic.states.splice(+d.s,1);R.dirty=true;render();return}
  if(act==='addcond'){R.logic.states[+d.s].entry.push({op:'>=',value:50});R.dirty=true;render();return}
  if(act==='delcond'){R.logic.states[+d.s].entry.splice(+d.j,1);R.dirty=true;render();return}
  if(act==='addblk'){const bl=R.logic.states[+d.s].blocks;const mn=bl.length?Math.min(...bl.map(b=>Number(b.soc)||0)):0;bl.push({soc:mn>0?0:Math.min(90,(Math.max(0,...bl.map(b=>Number(b.soc)||0))+10)),on:'min',off:3,km:''});R.dirty=true;render();return}
  if(act==='delblk'){R.logic.states[+d.s].blocks.splice(+d.j,1);R.dirty=true;render();return}
  if(act==='discard'){R=null;render();toast('Changes discarded');return}
  if(act==='saverules'){saveRules();return}
  if(act==='jsonapply'){const box=$('#jsonbox');try{const L=fromJSON(JSON.parse(box.value));R.logic=L;R.dirty=true;render();$('#rawjson').open=true;toast('Loaded '+L.states.length+' states — review, then Save')}catch(err){$('#jsonerr').textContent='Can’t import: '+err.message}return}
  if(act==='jsondl'){const b=new Blob([JSON.stringify(toJSON(R.logic),null,4)],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='logic.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}
  if(act==='jsoncopy'){const t=$('#jsonbox');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Copied'),()=>{document.execCommand('copy');toast('Copied')})}catch(_){document.execCommand('copy');toast('Copied')}return}
  // history
  if(act==='statv'){ui.statView=d.v;render();return}
  if(act==='logf'){ui.logF=d.v;render();return}
  // device
  if(act==='scan'){ui.scan='busy';ui.pickNet=null;render();setTimeout(()=>{ui.scan=[{ssid:'Syrota-IoT',rssi:-61,lock:1},{ssid:'Syrota',rssi:-67,lock:1},{ssid:'Garage-Ext',rssi:-54,lock:1},{ssid:'xfinitywifi',rssi:-82,lock:0},{ssid:'NETGEAR47',rssi:-88,lock:1}];render()},900);return}
  if(act==='picknet'){ui.pickNet=+d.i;render();const p=$('[name=wpass]');if(p)p.focus();return}
  if(act==='wifisave'){const p=$('[name=wpass]');const n=ui.scan[ui.pickNet];if(n.lock&&p.value.length<8){$('[data-ferr=wpass]').textContent='WPA2 passwords are at least 8 characters';p.classList.add('bad');return}
    S.log.unshift({t:nowHM(),k:'info',m:'Wi-Fi credentials changed to “'+n.ssid+'” — reconnecting'});ui.scan=null;ui.pickNet=null;render();toast('Saved — switching to '+n.ssid+'. The page may drop for a moment.');return}
  if(act==='savecard'){saveCard(d.card);return}
  if(act==='pushtest'){const p=S.cfg.push;if(!p.token||!p.user){toast('Add a token and user key first');return}S.log.unshift({t:nowHM(),k:'push',m:'Pushover test sent'});toast('Test notification sent');return}
  if(act==='otareset'){S.cfg.ota=OTA_DEFAULT;render();return}
  if(act==='otacheck'){const inp=$('[name=ota]'),v=inp.value.trim(),er=$('[data-ferr=ota]');
    if(!/^https:\/\/[^\s/]+\.[^\s]+$/i.test(v)){er.textContent=/^http:\/\//i.test(v)?'Only https:// URLs are allowed — updates must be fetched securely.':'Enter a full https:// URL';inp.classList.add('bad');return}
    S.cfg.ota=v;ui.ota={state:'checking',busy:true,bin:/\.bin$/i.test(v)};render();setTimeout(()=>{ui.ota.state='avail';ui.ota.busy=false;ui.ota.prog=null;render()},900);return}
  if(act==='otainstall'){ui.ota.prog=0;ui.ota.busy=true;render();const iv=setInterval(()=>{ui.ota.prog=Math.min(100,ui.ota.prog+7);
      if(tab==='device'){const b=$('.progress span');if(b){b.style.width=ui.ota.prog+'%';b.parentElement.nextElementSibling.textContent=ui.ota.prog<100?'Downloading… '+ui.ota.prog+'% · BLE paused, relay stays as is':'Verified · rebooting…'}}
      if(ui.ota.prog>=100){clearInterval(iv);setTimeout(()=>{st.fw.ver='1.4.1';st.fw.rollback=false;st.uptime='0 d 00 h 00 min 09 s';st.reset='SW_RESET (OTA)';ui.ota=null;S.log.unshift({t:nowHM(),k:'info',m:'OTA: installed v1.4.1, rebooted; pending validation'});render();toast('Updated to v1.4.1')},1200)}},180);return}
  if(act==='reboot'){if(!confirm('Reboot the charger? The relay goes to the default state until clock and prices are back.'))return;st.uptime='0 d 00 h 00 min 04 s';st.reset='SW_RESET (web UI)';S.log.unshift({t:nowHM(),k:'info',m:'Reboot requested from web UI'});render();toast('Rebooting… back in ~10 s');return}
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k&&R)setDraft(k,e.target.value,e.target);
  if(e.target.name==='ota'){e.target.classList.remove('bad');const er=$('[data-ferr=ota]');if(er)er.textContent=/^http:\/\//i.test(e.target.value.trim())?'Only https:// URLs are allowed.':''}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset&&t.dataset.act==='until-time'&&t.value){S.st.override.until=t.value;S.st.last=decide(false);render();toast('Override until '+t.value);return}
  if(t.dataset&&t.dataset.k==='tgtOn'&&R)setDraft('tgtOn',null,t);
});
document.addEventListener('toggle',e=>{if(e.target.id==='rawjson'&&e.target.open&&R){$('#jsonbox').value=JSON.stringify(toJSON(R.logic),null,2);$('#jsonerr').textContent=''}},true);

loadScenario(1);
</script>
</body>
</html>
