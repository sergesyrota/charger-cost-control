<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Charger — Option 2: Timeline</title>
<style>
:root{
  --bg:#0a0d10;--panel:#11161b;--panel2:#161c22;--line:#222a33;--grid:#1a2129;--text:#d8e0e8;--muted:#7a8794;--dim:#4d5966;
  --on:#3ddc84;--on-a:rgba(61,220,132,.13);--off:#ff6161;--off-a:rgba(255,97,97,.12);--amber:#ffb224;--amber-a:rgba(255,178,36,.14);
  --act:#4cc9f0;--da:#8796aa;--min:#b88cff;--sched:#5b7cff;--sched-a:rgba(91,124,255,.13);--soc:#e6e1c5;--kw:#ff8fd0;
  --focus:#4cc9f0;--shadow:0 10px 40px rgba(0,0,0,.5);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"JetBrains Mono","Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg:#f3f5f7;--panel:#fff;--panel2:#f7f9fb;--line:#dde3e9;--grid:#edf0f3;--text:#0f151b;--muted:#5d6975;--dim:#9aa5b0;
  --on:#0a9a55;--on-a:rgba(10,154,85,.12);--off:#d33b3b;--off-a:rgba(211,59,59,.10);--amber:#b77400;--amber-a:rgba(214,140,0,.14);
  --act:#0077b6;--da:#7b8796;--min:#7a4fd6;--sched:#3657e0;--sched-a:rgba(54,87,224,.10);--soc:#6b5d1e;--kw:#c0307e;--focus:#0077b6;--shadow:0 10px 40px rgba(20,30,40,.18);color-scheme:light}}
:root[data-theme=light]{
  --bg:#f3f5f7;--panel:#fff;--panel2:#f7f9fb;--line:#dde3e9;--grid:#edf0f3;--text:#0f151b;--muted:#5d6975;--dim:#9aa5b0;
  --on:#0a9a55;--on-a:rgba(10,154,85,.12);--off:#d33b3b;--off-a:rgba(211,59,59,.10);--amber:#b77400;--amber-a:rgba(214,140,0,.14);
  --act:#0077b6;--da:#7b8796;--min:#7a4fd6;--sched:#3657e0;--sched-a:rgba(54,87,224,.10);--soc:#6b5d1e;--kw:#c0307e;--focus:#0077b6;--shadow:0 10px 40px rgba(20,30,40,.18);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body{overflow-x:hidden;padding-bottom:70px}
.m,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--act)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 12px}
/* header */
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);z-index:20}
.back{font:11px var(--mono);color:var(--muted);text-decoration:none;white-space:nowrap}
.brand{font:700 13px var(--mono);letter-spacing:.08em;flex:1;text-align:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@media (max-width:520px){.brand{visibility:hidden}}
.brand i{font-style:normal;color:var(--act)}
.ib{background:none;border:1px solid var(--line);border-radius:6px;width:32px;height:30px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{color:var(--text);border-color:var(--dim)}
.modepill{max-width:46vw;overflow:hidden;text-overflow:ellipsis;font:11px var(--mono);border:1px solid var(--line);border-radius:99px;padding:4px 9px;background:var(--panel);color:var(--text);white-space:nowrap}
/* banner */
.banner{margin:10px 0 0;padding:10px 12px;border:1px solid var(--amber);background:var(--amber-a);border-radius:8px;display:flex;gap:10px;align-items:flex-start;font-size:13px}
.banner b{font-family:var(--mono)}
.banner.info{border-color:var(--dim);background:var(--panel2)}
.banner .x{margin-left:auto}
/* hero */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:14px 0 6px;align-items:center}
.relay{grid-row:span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;width:92px;height:92px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);font-family:var(--mono)}
.relay .big{font-size:30px;font-weight:800;letter-spacing:.02em;line-height:1}
.relay .sm{font-size:10px;color:var(--muted);letter-spacing:.1em;margin-top:5px;text-transform:uppercase}
.relay.on{border-color:var(--on);box-shadow:inset 0 0 0 3px var(--on-a)}.relay.on .big{color:var(--on)}
.relay.off .big{color:var(--off)}
.relay.warn{border-color:var(--amber)}.relay.warn .big{color:var(--amber)}
.verdict{font-size:16px;font-weight:600;line-height:1.3}
.why{color:var(--muted);font-size:13px}
.why b{color:var(--text);font-weight:500}
.next{grid-column:1/-1;margin-top:8px;font:12.5px var(--mono);padding:7px 10px;border-left:3px solid var(--act);background:var(--panel);border-radius:0 6px 6px 0}
.next .k{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0 12px}
.kpi{background:var(--panel);padding:9px 11px;min-width:0}
.kpi .l{font:10.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
.kpi .v{font:600 22px var(--mono);font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:400}
.kpi .s{font:11px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font:10px var(--mono);padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);vertical-align:1px}
.tag.est{border-color:var(--amber);color:var(--amber)}
.tag.on{border-color:var(--on);color:var(--on)}.tag.off{border-color:var(--off);color:var(--off)}
.tag.ac{border-color:var(--act);color:var(--act)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:7px 12px;font-size:13px}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--act);border-color:var(--act);color:#061018;font-weight:600}
.btn.sm{padding:3px 8px;font-size:11.5px;font-family:var(--mono)}
.btn.ghost{background:none}
.btn.danger{color:var(--off)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px 0;flex-wrap:wrap}
.ph h2{margin:0;font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ph .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 9px;font:11px var(--mono);color:var(--muted)}
.seg button.a{background:var(--panel2);color:var(--text);box-shadow:inset 0 -2px 0 var(--act)}
#chart{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair;padding:4px 0 0}
#chart svg{display:block;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 6px;padding:2px 10px 10px}
.lg{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid transparent;border-radius:99px;padding:2px 7px;font:10.5px var(--mono);color:var(--muted)}
.lg i{width:14px;height:3px;border-radius:2px;display:inline-block}
.lg.off{opacity:.38;text-decoration:line-through}
.lg:hover{border-color:var(--line)}
.hint{font:10.5px var(--mono);color:var(--dim);padding:0 12px 8px}
/* svg classes */
.g-grid{stroke:var(--grid);stroke-width:1}
.g-zero{stroke:var(--dim);stroke-width:1;stroke-dasharray:2 3}
.g-day{stroke:var(--dim);stroke-width:1}
.t-ax{fill:var(--muted);font:10px var(--mono)}
.t-day{fill:var(--text);font:700 10px var(--mono);letter-spacing:.1em}
.l-da{fill:none;stroke:var(--da);stroke-width:1.5;stroke-dasharray:4 3}
.l-act{fill:none;stroke:var(--act);stroke-width:2.2}
.d-5{fill:var(--act);opacity:.85}
.l-on{stroke:var(--on);stroke-width:1.3;stroke-dasharray:6 3}
.l-off{stroke:var(--off);stroke-width:1.3;stroke-dasharray:6 3}
.l-min{stroke:var(--min);stroke-width:1.3;stroke-dasharray:1.5 3}
.t-on{fill:var(--on);font:600 10px var(--mono)}.t-off{fill:var(--off);font:600 10px var(--mono)}.t-min{fill:var(--min);font:600 10px var(--mono)}
.r-on{fill:var(--on-a)}
.r-onbar{fill:var(--on)}
.r-proj{fill:url(#hatch)}
.hatch-l{fill:var(--on);opacity:.32}
.r-sched{fill:var(--sched-a)}
.r-schedbar{fill:var(--sched)}
.t-sched{fill:var(--sched);font:600 9.5px var(--mono)}
.l-now{stroke:var(--text);stroke-width:1.4}
.r-nowtag{fill:var(--text)}
.t-nowtag{fill:var(--bg);font:700 10px var(--mono)}
.l-sel{stroke:var(--amber);stroke-width:1.4}
.r-seltag{fill:var(--amber)}.t-seltag{fill:#111;font:700 10px var(--mono)}
.d-sel{fill:var(--amber);stroke:var(--panel);stroke-width:2}
.d-low{fill:none;stroke:var(--min);stroke-width:2}
.a-soc{fill:var(--soc);opacity:.13}
.l-soc{fill:none;stroke:var(--soc);stroke-width:1.6}
.l-socp{fill:none;stroke:var(--soc);stroke-width:1.6;stroke-dasharray:3 3}
.l-kw{fill:none;stroke:var(--kw);stroke-width:1.3}
.r-lane{fill:var(--panel2)}
.r-past{fill:var(--bg);opacity:.25}
.t-lane{fill:var(--dim);font:9px var(--mono);letter-spacing:.08em}
.d-now{fill:var(--act);stroke:var(--panel);stroke-width:2}
/* detail */
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:12px}
.det{padding:4px 12px 12px}
.dh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:6px 0 8px}
.dh .t{font:700 18px var(--mono)}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dl div{background:var(--panel2);border-radius:8px;padding:7px 9px;min-width:0}
.dl .l{font:10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dl .v{font:600 17px var(--mono);white-space:nowrap}
.dl .s{font:10.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsay{margin-top:9px;font-size:13.5px;line-height:1.5}
.dsay code{font:12px var(--mono);background:var(--panel2);padding:1px 5px;border-radius:4px}
/* explainer */
.chain{list-style:none;margin:0;padding:8px 12px 12px;display:grid;gap:0;counter-reset:s}
.step{position:relative;display:grid;grid-template-columns:26px 1fr auto;gap:2px 10px;align-items:center;padding:9px 10px;border:1px solid transparent;border-radius:9px;cursor:pointer;background:none;text-align:left;width:100%}
.step:hover{border-color:var(--line);background:var(--panel2)}
.step .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--dim);display:grid;place-items:center;font:700 10px var(--mono);color:var(--muted);background:var(--panel);z-index:1}
.step .tt{font-weight:600;font-size:13.5px}
.step .tx{grid-column:2;font-size:12.5px;color:var(--muted)}
.step .st{grid-row:span 2;font:10px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.step .ed{font:11px var(--mono);color:var(--act);opacity:0;transition:opacity .15s}
.step:hover .ed,.step:focus-visible .ed{opacity:1}
.chain li{position:relative}
.chain li:not(:last-child)::after{content:"";position:absolute;left:21px;top:34px;bottom:-9px;width:1.5px;background:var(--line)}
.step.won{border-color:var(--on);background:var(--on-a)}
.step.won.offv{border-color:var(--off);background:var(--off-a)}
.step.won .n{border-color:currentColor;background:var(--on);color:#04140b}
.step.won.offv .n{background:var(--off);color:#1b0606}
.step.won .tx{color:var(--text)}
.step.won .st{color:var(--on)}.step.won.offv .st{color:var(--off)}
.step.pass .st{color:var(--muted)}
.step.blocked .st{color:var(--amber)}.step.blocked .n{border-color:var(--amber);color:var(--amber)}
.step.skip,.step.idle{opacity:.55}
.ovl{margin:0 12px 12px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;font-size:12.5px;color:var(--muted)}
.ovl b{color:var(--text)}
.ovl.hit{border-color:var(--off);color:var(--text)}
/* menu row */
.menu-row{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.menu-row button{flex:1 1 auto;min-width:90px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:12px var(--mono);text-align:left;display:flex;justify-content:space-between;gap:8px}
.menu-row button span{color:var(--muted)}
.menu-row button:hover{border-color:var(--dim)}
.sys{font:11px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;padding:10px 2px 20px;border-top:1px dashed var(--line)}
.sys b{color:var(--text);font-weight:500}
.ok{color:var(--on)}.bad{color:var(--off)}.wn{color:var(--amber)}
/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#scrim.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .25s ease;z-index:50;display:flex;flex-direction:column;box-shadow:var(--shadow)}
#sheet.show{transform:none}
#sheet>header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
#sheet>header h2{margin:0;font:700 13px var(--mono);letter-spacing:.1em;text-transform:uppercase;flex:1}
#sheet>header .grab{position:absolute;top:5px;left:50%;width:36px;height:4px;border-radius:2px;background:var(--line);margin-left:-18px}
#sh-b{overflow:auto;padding:12px 14px 24px;overscroll-behavior:contain}
@media (min-width:900px){
  #sheet{left:auto;top:0;width:520px;max-height:none;border-radius:0;border-left:1px solid var(--line);border-top:0;transform:translateX(105%)}
  #sheet>header .grab{display:none}
  .grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
}
/* forms */
.f{display:grid;gap:4px;margin:0 0 12px}
.f>label,.lab{font:11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.f .help{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=password],input[type=time],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input.m,select.m{font-family:var(--mono)}
input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:none}
input.err{border-color:var(--off)}
.errt{font:11.5px var(--mono);color:var(--off);min-height:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px;background:var(--panel2)}
.card h3{margin:0 0 6px;font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.modes{display:grid;gap:6px}
.mode{display:grid;grid-template-columns:20px 1fr;gap:2px 8px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;background:var(--panel2)}
.mode input{margin:3px 0 0}
.mode b{font-size:13.5px}.mode span{grid-column:2;font-size:12px;color:var(--muted)}
.mode:has(input:checked){border-color:var(--act);box-shadow:inset 0 0 0 1px var(--act)}
.sw{display:flex;align-items:center;gap:8px;font-size:13px}
.foot{position:sticky;bottom:-24px;background:var(--panel);padding:10px 0 4px;margin-top:8px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
/* logic editor */
.stabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.stab{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px;font:13px var(--sans);white-space:nowrap;display:flex;gap:6px;align-items:center}
.stab.a{border-color:var(--act);box-shadow:inset 0 -2px 0 var(--act)}
.stab small{font:9.5px var(--mono);color:var(--muted)}
.blk{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:0 0 8px;background:var(--panel)}
.blk .say{font-size:12.5px;margin:0 0 6px}
.blk .say b{font-family:var(--mono)}
.blk.act{border-color:var(--act)}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr) 30px;gap:6px;align-items:end}
.bgrid label{font:9.5px var(--mono);color:var(--muted);text-transform:uppercase}
.bgrid input{padding:6px 6px;font-family:var(--mono)}
.cgrid{display:grid;grid-template-columns:70px 70px 1fr 30px;gap:6px;align-items:center;margin-bottom:6px}
.x{background:none;border:1px solid var(--line);border-radius:6px;height:30px;color:var(--muted)}
.x:hover{color:var(--off);border-color:var(--off)}
.warnbox{border:1px solid var(--amber);background:var(--amber-a);border-radius:8px;padding:8px 10px;font-size:12.5px;margin:0 0 10px}
.errbox{border:1px solid var(--off);background:var(--off-a);border-radius:8px;padding:8px 10px;font-size:12.5px;margin:0 0 10px}
.lc-reg-on{fill:var(--on-a)}.lc-reg-hold{fill:var(--amber-a)}.lc-reg-off{fill:var(--off-a)}.lc-reg-bad{fill:url(#hatch2)}
.lc-b{fill:none;stroke:var(--line)}
.lc-bact{fill:none;stroke:var(--act);stroke-width:1.5}
.lc-ent{fill:var(--sched)}
.t-band{fill:var(--text);font:600 10px var(--mono)}
.d-you{fill:var(--act);stroke:var(--panel);stroke-width:2.5}
.d-you2{fill:none;stroke:var(--act);stroke-width:1.5;stroke-dasharray:2 2}
textarea.json{font:12px/1.45 var(--mono);min-height:320px;white-space:pre;tab-size:2}
/* tables / lists */
table{width:100%;border-collapse:collapse;font:12px var(--mono)}
th{text-align:left;color:var(--muted);font-weight:500;font-size:10.5px;text-transform:uppercase;padding:5px 4px;border-bottom:1px solid var(--line)}
td{padding:6px 4px;border-bottom:1px solid var(--grid);white-space:nowrap}
td.r,th.r{text-align:right}
.log{list-style:none;margin:0;padding:0;font:12px var(--mono)}
.log li{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--grid)}
.log time{color:var(--muted)}
.log .k{font-size:10px;padding:0 4px;border-radius:3px;border:1px solid var(--line);margin-right:5px;color:var(--muted)}
.log .k.tr{color:var(--on);border-color:var(--on)}.log .k.po{color:var(--act);border-color:var(--act)}.log .k.er{color:var(--off);border-color:var(--off)}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--act);width:0;transition:width .2s}
.wl{display:grid;gap:4px;margin:6px 0}
.wl button{display:flex;justify-content:space-between;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 9px;font:12.5px var(--mono);text-align:left}
.wl button.a{border-color:var(--act)}
.day{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--grid)}
.day .dn{font:700 12px var(--mono);padding-top:4px}
.dbar{position:relative;height:10px;background:var(--panel);border:1px solid var(--line);border-radius:3px;margin:4px 0 6px}
.dbar i{position:absolute;top:0;bottom:0;background:var(--sched);border-radius:2px}
.wrow{display:grid;grid-template-columns:1fr auto 1fr 30px;gap:6px;align-items:center;margin-bottom:5px}
.wrow input{font-family:var(--mono);padding:5px 6px}
/* menu pop, demo, toast */
#pop{position:fixed;top:46px;right:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:45;padding:5px;display:none;min-width:190px}

#demo{position:fixed;left:10px;bottom:10px;z-index:30;font:11px var(--mono)}

<script>
"use strict";
/* ============ time model (Chicago wall clock, minutes from Fri Nov 6 19:00) ============ */
const BASE=19*60, TEND=2160, NOW=1660, MINW=0; // NOW = Sat 22:40
const DAYN=['Fri','Sat','Sun'], WDN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], WDAY=[5,6,0];
const pad=n=>String(n).padStart(2,'0');
const clk=t=>{const m=BASE+t;return{d:Math.floor(m/1440),h:Math.floor(m/60)%24,mi:((m%60)+60)%60}};
const hm=t=>{const c=clk(t);return pad(c.h)+':'+pad(c.mi)};
const dt=t=>DAYN[clk(t).d]+' '+hm(t);
const fp=v=>v==null||isNaN(v)?'—':(v<0?'−':'')+Math.abs(Math.round(v*10)/10).toFixed(1);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const $=id=>document.getElementById(id);

/* ============ mock /api/prices ============ */
// hourly day-ahead, index 0 = Fri 19:00 … 36 = Sun 07:00 (hour-start representation)
const DA=[4.6,3.9,3.1,2.6,2.2, 1.9,1.6,1.3,1.1,1.0,1.4,2.2,3.0,3.6,3.4,3.1,2.9,2.8,2.7,2.9,3.2,3.8,4.6,5.1,4.8,4.2,3.6,2.6,2.1, 1.8,1.4,0.9,-0.7,0.4,1.1,2.0,2.6];
const ACT=DA.slice(0,27).map((v,h)=>Math.round((v+0.55*Math.sin(h*1.7)+0.3*Math.cos(h*0.9))*10)/10);
const CURH=27; // Sat 22:00 slot
const hIdx=(d,h)=>d*24+h-19;

/* ============ base logic (docs/reference/bolt-monitor-logic.json) ============ */
const LOGIC0={"states":{"Разряд":{"entry_conditions":[{"type":"soc","value":80,"operator":">="}],"charging_logic":[{"soc":70,"price_on":-1,"price_off":-0.5,"known_minutes":30},{"soc":20,"price_on":-0.5,"price_off":0,"known_minutes":20},{"soc":0,"price_on":2,"price_off":3}]},"Заряд":{"entry_conditions":[{"type":"soc","value":20,"operator":"<="}],"charging_logic":[{"soc":80,"price_on":-1,"price_off":-0.5,"known_minutes":20},{"soc":40,"price_on":0,"price_off":0.5,"known_minutes":20},{"soc":0,"price_on":2,"price_off":3}]},"Поездка":{"entry_conditions":[],"charging_logic":[{"soc":0,"price_on":3,"price_off":3}]}}};

const CFG0={mode:'auto',until:null,target:null,minOffset:0.5,defRelay:false,
  sched:{0:[[60,240]],1:[[60,300]],2:[[60,300]],3:[[60,300]],4:[[60,300]],5:[[60,300]],6:[]},
  wifi:{ssid:'syrota-iot'},po:{token:'a7k2••••••••••••••••••3qz',user:'u9x1••••••••••••••••mmp',device:'',enabled:true},
  mac:'8C:DE:52:A1:3F:07',pollOn:60,pollOff:60,thrW:500,sign:'abs',polarity:'high',probe:30,stale:20,fullHold:0,
  ota:'https://github.com/sergesyrota/charger-cost-control/releases/latest/download/manifest.json'};

const SCEN={
 1:{name:'Charging',now:1.2,est:false,age:2,clock:true,mode:'schedule_price',sel:'Поездка',sticky:'Разряд',relay:true,
    car:{status:'charging',soc:52,seen:0,kw:6.8,kwh:2.8,cost:0.04},on:[[320,590],[1635,NOW]],soc:[[0,40],[320,40],[590,85],[840,85],[1080,50],[1635,50],[NOW,52]],det:[[1635,NOW]]},
 2:{name:'Waiting',now:4.1,est:false,age:3,clock:true,mode:'auto',sel:'',sticky:'Разряд',relay:false,
    car:{status:'asleep',soc:64,seen:38,kw:0,kwh:0,cost:0},on:[[320,590]],soc:[[0,40],[320,40],[590,85],[840,85],[1080,64],[NOW,64]],det:[]},
 3:{name:'ON, car not charging',now:2.6,est:true,age:26,clock:true,mode:'schedule_price',sel:'Поездка',sticky:'Разряд',relay:true,
    car:{status:'not_detected',soc:52,seen:120,kw:0,kwh:0,cost:0},on:[[320,590],[1635,NOW]],soc:[[0,40],[320,40],[590,85],[840,85],[1080,50],[1540,52]],det:[]},
 4:{name:'Booting / unknown',now:null,est:false,age:null,clock:false,mode:'auto',sel:'',sticky:'Разряд',relay:false,
    car:{status:'not_detected',soc:64,seen:null,kw:0,kwh:0,cost:0,never:true},on:[],soc:[],det:[],rollback:true},
 5:{name:'Manual ON until 06:00',now:1.6,est:false,age:1,clock:true,mode:'manual_on',until:2100,sel:'',sticky:'Разряд',relay:true,
    car:{status:'charging',soc:58,seen:0,kw:6.8,kwh:10.8,cost:0.27},on:[[320,590],[1565,NOW]],soc:[[0,40],[320,40],[590,85],[840,85],[1080,42],[1565,42],[NOW,58]],det:[[1565,NOW]]}
};

/* ============ app state ============ */
let S, UI={sel:null,zoom:'all',layers:{da:1,act:1,f5:1,thr:1,min:1,relay:1,sched:1,soc:1,kw:0},sheet:null,draft:null,lstate:null,ltab:'vis',theme:0,logF:'all'};

function load(n){
  const sc=SCEN[n];
  const keepCfg=S?S.cfg:null, keepLogic=S?S.logic:null;
  S={scn:n,clock:sc.clock,nowP:sc.now,est:sc.est,age:sc.age,relay:sc.relay,sticky:sc.sticky,
    cfg:keepCfg?Object.assign(clone(keepCfg),{mode:sc.mode,until:sc.until??null}):Object.assign(clone(CFG0),{mode:sc.mode,until:sc.until??null}),
    logic:keepLogic?clone(keepLogic):clone(LOGIC0),car:clone(sc.car),on:clone(sc.on),socK:clone(sc.soc),det:sc.det,
    rollback:!!sc.rollback,uptime:sc.clock?'3d 04:12':'00:00:42',reset:sc.clock?'power-on':'ota-rollback (task wdt)',
    heap:sc.clock?{free:118,min:84,blk:68}:{free:141,min:139,blk:96},rssi:-61,ip:'192.168.1.47',fw:sc.rollback?'1.3.1':'1.3.2',log:mkLog(n)};
  S.logic.state_select=sc.sel;
  if(!sc.clock){S.cfg.until=null}
  // 5-minute points
  S.five=[];
  if(sc.clock){
    const off=[.3,-.2,.1,-.3,.2,0,-.1,.2,-.2,.1,0,-.1];
    for(let i=0;i<12;i++)S.five.push({t:26*60+i*5,p:Math.round((ACT[26]+off[i])*10)/10});
    if(!sc.est){const o=[.2,-.1,0,-.2,.1,0,.1,-.1];for(let i=0;i<8;i++)S.five.push({t:CURH*60+i*5,p:Math.round((sc.now+o[i])*10)/10})}
    else {for(let i=0;i<3;i++)S.five.push({t:CURH*60+i*5-0,p:Math.round((2.9-i*.1)*10)/10})}
  }
  UI.sel=null;
  compute(false);
}

function mkLog(n){
  if(n===4)return[
    {t:'+00:00:00',k:'sys',m:'Boot: reset reason ota-rollback (task wdt) — running previous image 1.3.1'},
    {t:'+00:00:00',k:'tr',m:'Relay → OFF (default state; no clock)'},
    {t:'+00:00:04',k:'sys',m:'Wi-Fi connected syrota-iot, 192.168.1.47, −61 dBm'},
    {t:'+00:00:09',k:'er',m:'SNTP: no response from pool.ntp.org, retrying'},
    {t:'+00:00:31',k:'er',m:'SNTP: no response from time.google.com, retrying'}];
  const L=[
    {t:'Sat 00:20',k:'tr',m:'Relay → ON · Price is low (1.6¢ ≤ 2¢) — Bolt/Разряд soc≥0'},
    {t:'Sat 00:21',k:'po',m:'Pushover sent: ON … Charging started: 6.8 kW, 41%.'},
    {t:'Sat 03:02',k:'er',m:'5-min feed: TLS handshake timeout (retry ok 03:07)'},
    {t:'Sat 04:50',k:'tr',m:'Relay → OFF · Price is high (1.9¢ > −0.5¢), Bolt/Разряд (85%)'},
    {t:'Sat 04:50',k:'po',m:'Pushover sent: OFF: Price is high (1.9¢ > −0.5¢), Bolt/Разряд (85%, 0m ago).'},
    {t:'Sat 04:50',k:'sys',m:'State Разряд entered (SOC 85% ≥ 80)'},
    {t:'Sat 18:05',k:'sys',m:'Car poll: asleep (228334 → ERROR)'}];
  if(n===1||n===3){L.push({t:'Sat 21:58',k:'sys',m:'state_select → Поездка (forced from UI)'},{t:'Sat 22:15',k:'tr',m:'Relay → ON · Price is low (1.4¢ ≤ 3¢) — Bolt/Поездка (forced)'});
    L.push(n===1?{t:'Sat 22:16',k:'po',m:'Pushover sent: ON … Charging started: 6.8 kW, 50%.'}:{t:'Sat 22:16',k:'po',m:'Pushover sent: ON … Car not detected.'});
    if(n===3)L.push({t:'Sat 22:14',k:'er',m:'5-min feed stale (no success for 26 min) — using day-ahead estimate'});}
  if(n===5)L.push({t:'Sat 21:05',k:'tr',m:'Relay → ON · Manual ON until Sun 06:00'},{t:'Sat 21:06',k:'po',m:'Pushover sent: Manual: ON until 06:00. Charging started: 6.8 kW, 42%.'});
  if(n===2)L.push({t:'Sat 22:35',k:'sys',m:'Price 4.1¢ above start −0.5¢ — staying OFF'});
  return L.reverse();
}

/* ============ PriceEngine (port of prices.ts, mock) ============ */
function lowest7(t){
  const c=clk(t);let best=null,at=null;
  const cand=c.h<17?[...Array(8).keys()].map(h=>[c.d,h]):[...Array(23-c.h).keys()].map(i=>[c.d,c.h+1+i]).concat([...Array(8).keys()].map(h=>[c.d+1,h]));
  for(const[d,h]of cand){const i=hIdx(d,h);if(i<0||i>=DA.length)continue;if(best==null||DA[i]<best){best=DA[i];at=i*60}}
  return best==null?null:{p:Math.round(best*10)/10,t:at};
}
function priceAt(t){
  if(!S.clock)return{p:null,src:'no data'};
  const h=Math.floor(t/60);
  if(h<CURH)return{p:ACT[h],src:'actual (hourly)'};
  if(h===CURH&&t<=NOW)return{p:S.nowP,src:S.est?'estimated (day-ahead)':'5-min avg'};
  return{p:DA[h]??null,src:'day-ahead forecast'};
}

/* ============ DecisionEngine (PLAN §7) ============ */
const condOk=(c,soc)=>{const v=+c.value;switch(c.operator){case'>':return soc>v;case'>=':return soc>=v;case'<':return soc<v;case'<=':return soc<=v}return false};
function pickState(lg,sticky,soc){
  if(lg.state_select&&lg.states[lg.state_select])return{name:lg.state_select,how:'forced'};
  for(const n of Object.keys(lg.states)){const ec=lg.states[n].entry_conditions||[];if(ec.length&&ec.every(c=>condOk(c,soc)))return{name:n,how:n===sticky?'sticky':'entered'}}
  return{name:sticky,how:'sticky'};
}
function blocksOf(lg,name){const s=lg.states[name];if(s&&s.charging_logic&&s.charging_logic.length)return s.charging_logic;return(lg.states.default&&lg.states.default.charging_logic)||[]}
function blockFor(cl,soc){if(!cl.length)return-1;for(let i=0;i<cl.length;i++)if(soc>=+cl[i].soc)return i;return cl.length-1}
const rp=(v,mp)=>v==='min'?mp:+v;
function evalPrice(lg,sticky,soc,price,mp,minute,relay){
  const st=pickState(lg,sticky,soc),cl=blocksOf(lg,st.name),bi=blockFor(cl,soc);
  if(bi<0)return{ok:false,state:st.name,how:st.how};
  const b=cl[bi],on=rp(b.price_on,mp),off=rp(b.price_off,mp),km=+b.known_minutes||0,enough=!km||minute>=km;
  let r=relay,why,code;
  if(relay&&price>off){r=false;code='high';why=`Price is high (${fp(price)}¢ > ${fp(off)}¢)`}
  else if(relay&&!enough){r=false;code='conf';why=`Not enough confidence yet (:${pad(minute)} < :${pad(km)})`}
  else if(!relay&&price<=on&&enough){r=true;code='low';why=`Price is low (${fp(price)}¢ ≤ ${fp(on)}¢)`}
  else if(relay){code='keep';why=`Keep charging — ${fp(price)}¢ is not above stop ${fp(off)}¢`}
  else if(price<=on){code='wait';why=`Price ${fp(price)}¢ ≤ ${fp(on)}¢, waiting for :${pad(km)} of the hour (confidence)`}
  else{code='wait';why=`Waiting — ${fp(price)}¢ is above start ${fp(on)}¢`}
  return{ok:true,state:st.name,how:st.how,bi,b,cl,on,off,km,enough,relay:r,why,code,price};
}
function winAt(sched,t){const c=clk(t),wd=WDAY[c.d],m=c.h*60+c.mi;for(const w of sched[wd]||[])if(m>=w[0]&&m<w[1])return WDN[wd]+' '+mm(w[0])+'–'+mm(w[1]);return null}
const mm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
function decide(c){
  let mode=c.mode,res=null;const steps=[];
  if(mode==='manual_on'||mode==='manual_off'){
    if(c.until!=null&&c.t>=c.until){steps.push({k:'manual',s:'pass',x:`Override ended ${dt(c.until)} → back to Auto`});mode='auto'}
    else{const on=mode==='manual_on';res={relay:on,by:'manual',reason:`Manual ${on?'ON':'OFF'}${c.until!=null?' until '+dt(c.until):' (until changed)'}`};steps.push({k:'manual',s:'won',x:res.reason})}
  }else steps.push({k:'manual',s:'idle',x:'No override active'});
  if(res)steps.push({k:'schedule',s:'skip',x:'Not checked — override wins'});
  else if(mode==='schedule'||mode==='schedule_price'){
    if(!c.clock)steps.push({k:'schedule',s:'blocked',x:'Needs a valid clock — not synced yet'});
    else{const w=winAt(c.sched,c.t);
      if(w){res={relay:true,by:'schedule',reason:`Schedule window ${w}`};steps.push({k:'schedule',s:'won',x:`Inside window ${w} → ON`})}
      else if(mode==='schedule'){res={relay:false,by:'schedule',reason:'Outside schedule windows (schedule only)'};steps.push({k:'schedule',s:'won',x:'Outside all windows → OFF (schedule only)'})}
      else steps.push({k:'schedule',s:'pass',x:'Outside all windows → falls through to price'})}
  }else steps.push({k:'schedule',s:'idle',x:mode==='auto'?'Not used in Auto (price) mode':'Not used'});
  let P=null;
  if(c.clock&&c.price!=null)P=evalPrice(c.logic,c.sticky,c.soc,c.price,c.mp,c.t%60,c.relay);
  if(res)steps.push({k:'price',s:'skip',x:'Not checked'});
  else if(mode==='auto'||mode==='schedule_price'){
    if(!c.clock)steps.push({k:'price',s:'blocked',x:'No clock → no ComEd prices (TLS needs time)'});
    else if(c.price==null)steps.push({k:'price',s:'blocked',x:'Price unknown (5-min feed stale > 20 min, no day-ahead)'});
    else if(!P.ok)steps.push({k:'price',s:'blocked',x:`State “${P.state}” has no charging blocks`});
    else{res={relay:P.relay,by:'price',reason:P.why};steps.push({k:'price',s:'won',x:P.why})}
  }else steps.push({k:'price',s:'idle',x:'Not used in this mode'});
  if(res)steps.push({k:'default',s:'skip',x:'Not needed'});
  else{const why=!c.clock?'No clock yet':c.price==null?'No price':'Nothing decided';res={relay:c.defRelay,by:'default',reason:`${why} → default ${c.defRelay?'ON':'OFF'}`};steps.push({k:'default',s:'won',x:res.reason})}
  let ov=null;res.pre=res.relay;
  if(res.by!=='manual'&&res.relay&&c.socKnown){if(Math.round(c.soc)>=100)ov='Bolt is full';else if(c.target&&c.soc>=c.target)ov=`SOC target ${c.target}% reached`;if(ov){res.relay=false;res.reason=ov}}
  const sticky=(c.clock&&P&&P.how!=='forced')?P.state:c.sticky;
  return Object.assign(res,{steps,ov,P,sticky,mode});
}
function ctx(t,o){return{t,clock:S.clock,price:o.price,mp:S.mp,soc:o.soc,socKnown:!S.car.never,relay:o.relay,mode:S.cfg.mode,until:S.cfg.until,sched:S.cfg.sched,logic:S.logic,sticky:o.sticky,target:S.cfg.target,defRelay:S.cfg.defRelay}}

function compute(fromUser,why){
  const l7=S.clock?lowest7(NOW):null;S.l7=l7;S.mp=l7?Math.round((l7.p+(+S.cfg.minOffset||0))*10)/10:null;
  const prev=S.relay;
  S.D=decide(ctx(NOW,{price:S.nowP,soc:S.car.soc,relay:S.relay,sticky:S.sticky}));
  S.relay=S.D.relay;S.sticky=S.D.sticky;
  if(S.D.mode==='auto'&&S.cfg.mode.startsWith('manual')&&S.cfg.until!=null&&NOW>=S.cfg.until){S.cfg.mode='auto';S.cfg.until=null}
  if(fromUser&&prev!==S.relay){
    const msg=(why?why+': ':'')+(S.relay?'ON':'OFF')+' — '+S.D.reason;
    S.log.unshift({t:dt(NOW),k:'tr',m:'Relay → '+(S.relay?'ON':'OFF')+' · '+S.D.reason});
    if(S.cfg.po.enabled)S.log.unshift({t:dt(NOW),k:'po',m:'Pushover sent: '+msg});
    if(S.relay){S.on.push([NOW,NOW]);if(S.car.status!=='not_detected'){S.car.status='online';setTimeout(()=>{if(S.relay&&S.car.status==='online'){S.car.status='charging';S.car.kw=6.8;S.car.seen=0;render();toast(`Post-ON probe (${S.cfg.probe}s): charging 6.8 kW, ${Math.round(S.car.soc)}%`)}},1600)}}
    else{S.car.kw=0;if(S.car.status==='charging')S.car.status='online'}
    toast((S.cfg.po.enabled?'Pushover → ':'Relay ')+msg);
  }
  project();
}
function project(){
  const out=[];S.proj=out;if(!S.clock)return;
  let relay=S.relay,soc=S.car.soc,sticky=S.sticky;const det=S.car.status!=='not_detected';
  for(let t=NOW+5;t<=TEND;t+=5){
    const pr=priceAt(t),d=decide(ctx(t,{price:pr.p,soc,relay,sticky}));
    relay=d.relay;sticky=d.sticky;const kw=relay&&det&&Math.round(soc)<100?6.8:0;
    out.push({t,relay,soc,kw,price:pr.p,d});soc=Math.min(100,soc+kw*5/60/65*100);
  }
}
function socAt(t){

  if(t>NOW){const p=S.proj.find(x=>x.t>=t)||S.proj[S.proj.length-1];return{t,kind:'proj',price:pr,relay:p.relay,soc:p.soc,D:p.d,kw:p.kw}}

}

const fld=(id,l,v,type,ph)=>`<div class="f" style="flex:1"><label for="${id}">${l}</label><input id="${id}" type="${type}" class="m" value="${esc(v)}" ${ph?`placeholder="${ph}"`:''}><div class="errt" id="${id}-e"></div></div>`;
function schedErr(d){const w=S.cfg.sched[d].slice().sort((a,b)=>a[0]-b[0]);for(let i=0;i<w.length;i++){if(w[i][1]<=w[i][0])return'end must be after start (split windows that cross midnight)';if(i&&w[i][0]<w[i-1][1])return'windows overlap'}return''}
function condSay(cs){if(!cs.length)return'';const I=interval(cs);return`→ auto-enters when SOC is ${rangeSay(I)}.`}
function interval(cs){let lo=-Infinity,loI=true,hi=Infinity,hiI=true;for(const c of cs){const v=+c.value,o=c.operator;if(o[0]==='>'){if(v>lo||(v===lo&&o==='>')){lo=v;loI=o==='>='}}else{if(v<hi||(v===hi&&o==='<')){hi=v;hiI=o==='<='}}}return{lo,loI,hi,hiI}}
function rangeSay(I){const a=I.lo===-Infinity?'':`${I.loI?'≥':'>'} ${I.lo}%`,b=I.hi===Infinity?'':`${I.hiI?'≤':'<'} ${I.hi}%`;return[a,b].filter(Boolean).join(' and ')||'any value'}
function overlap(a,b){const lo=Math.max(a.lo,b.lo),hi=Math.min(a.hi,b.hi);if(lo<hi)return true;if(lo>hi)return false;const li=(a.lo===lo?a.loI:true)&&(b.lo===lo?b.loI:true),hj=(a.hi===hi?a.hiI:true)&&(b.hi===hi?b.hiI:true);return li&&hj}
function blkHtml(st,b,i,act){

function drawLC(){
  const el=$('lc');if(!el)return;const d=UI.draft,nm=UI.lstate,st=d.states[nm];if(!st)return;
  const cl=(st.charging_logic||[]).filter(b=>!isNaN(+b.soc)).slice().sort((a,b)=>b.soc-a.soc),mp=S.mp??0;
  const W=Math.max(300,el.clientWidth||440),H=230,ml=32,mr=10,mt=8,mb=24,pw=W-ml-mr,ph=H-mt-mb;
  const xs=[-1,4];cl.forEach(b=>{const a=rp(b.price_on,mp),c=rp(b.price_off,mp);if(!isNaN(a))xs.push(a);if(!isNaN(c))xs.push(c)});if(S.nowP!=null)xs.push(S.nowP);xs.push(mp);
  const x0=Math.floor(Math.min(...xs))-1,x1=Math.ceil(Math.max(...xs))+1,X=v=>ml+(Math.max(x0,Math.min(x1,v))-x0)/(x1-x0)*pw,Y=s=>mt+(100-s)/100*ph;
  const o=[`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="SOC versus price map for ${esc(nm)}"><defs><pattern id="hatch2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="6" fill="var(--off)" opacity=".5"/></pattern></defs>`];
  const cur=S.D.P&&S.D.P.state===nm;
  cl.forEach((b,k)=>{const hi=k===0?100:cl[k-1].soc,lo=k===cl.length-1?0:+b.soc;if(hi<=lo)return;const on=rp(b.price_on,mp),off=rp(b.price_off,mp);if(isNaN(on)||isNaN(off))return;
    const y=Y(hi),h=Y(lo)-Y(hi),xa=X(Math.min(on,off)),xb=X(Math.max(on,off));
    o.push(`<rect class="lc-reg-on" x="${ml}" y="${y}" width="${X(on)-ml}" height="${h}"/>`);
    if(on<=off)o.push(`<rect class="lc-reg-hold" x="${xa}" y="${y}" width="${xb-xa}" height="${h}"/>`);else o.push(`<rect class="lc-reg-bad" x="${xa}" y="${y}" width="${xb-xa}" height="${h}"/>`);
    o.push(`<rect class="lc-reg-off" x="${X(Math.max(on,off))}" y="${y}" width="${ml+pw-X(Math.max(on,off))}" height="${h}"/>`);
    o.push(`<rect class="lc-b" x="${ml}" y="${y}" width="${pw}" height="${h}"/>`);
    o.push(`<line x1="${X(on)}" x2="${X(on)}" y1="${y}" y2="${y+h}" stroke="var(--on)" stroke-width="1.5"/><line x1="${X(off)}" x2="${X(off)}" y1="${y}" y2="${y+h}" stroke="var(--off)" stroke-width="1.5"/>`);
    if(h>14)o.push(`<text class="t-band" x="${ml+4}" y="${y+12}">${lo>0?'≥'+b.soc+'%':'<'+(k>0?cl[k-1].soc:100)+'%'}${b.known_minutes?' · :'+pad(b.known_minutes):''}</text><text class="t-on" x="${X(on)-3}" y="${y+h-4}" text-anchor="end">${b.price_on==='min'?'min':fp(on)}</text><text class="t-off" x="${X(off)+3}" y="${y+h-4}">${b.price_off==='min'?'min':fp(off)}</text>`);
  });
  // entry range strip
  const ec=st.entry_conditions||[];if(ec.length){const I=interval(ec),lo=Math.max(0,I.lo),hi=Math.min(100,I.hi);if(hi>=lo)o.push(`<rect class="lc-ent" x="${ml-6}" y="${Y(hi)}" width="4" height="${Math.max(2,Y(lo)-Y(hi))}" rx="1"><title>auto-enter ${rangeSay(I)}</title></rect>`)}
  for(let s=0;s<=100;s+=20)o.push(`<text class="t-ax" x="${ml-9}" y="${Y(s)+3}" text-anchor="end">${s}</text>`);
  const stp=x1-x0>10?2:1;for(let p=x0;p<=x1;p+=stp)o.push(`<text class="t-ax" x="${X(p)}" y="${H-8}" text-anchor="middle">${p<0?'−'+(-p):p}</text>`);
  o.push(`<text class="t-ax" x="${ml+pw}" y="${H-0}" text-anchor="end">price ¢ →</text>`);
  if(S.mp!=null)o.push(`<line class="l-min" x1="${X(mp)}" x2="${X(mp)}" y1="${mt}" y2="${mt+ph}"/><text class="t-min" x="${X(mp)+3}" y="${mt+10}">min</text>`);
  if(S.nowP!=null){const cx=X(S.nowP),cy=Y(S.car.soc);o.push(cur?`<circle class="d-you" cx="${cx}" cy="${cy}" r="6"/><text class="t-band" x="${cx+(cx>W-110?-9:9)}" y="${cy-8}" text-anchor="${cx>W-110?'end':'start'}">you · ${fp(S.nowP)}¢ · ${Math.round(S.car.soc)}%</text>`:`<circle class="d-you2" cx="${cx}" cy="${cy}" r="6"/><text class="t-ax" x="${cx+9}" y="${cy-8}">if in this state</text>`)}
  o.push('</svg>');el.innerHTML=o.join('');
}

  el.addEventListener('pointerdown',e=>{if(!S.clock)return;down=true;el.setPointerCapture&&el.setPointerCapture(e.pointerId);scrubAt(e.clientX)});
  el.addEventListener('pointermove',e=>{if(down||e.pointerType==='mouse'&&e.buttons)scrubAt(e.clientX)});
  ['pointerup','pointercancel'].forEach(n=>el.addEventListener(n,()=>{down=false}));
  el.addEventListener('keydown',e=>{if(!S.clock)return;const cur=UI.sel??NOW,st=e.shiftKey?5:60,[t0,t1]=view();
    if(e.key==='ArrowRight'){setSel(Math.min(t1-5,cur+st));e.preventDefault()}else if(e.key==='ArrowLeft'){setSel(Math.max(t0,cur-st));e.preventDefault()}else if(e.key==='Escape'||e.key==='Home')setSel(NOW)});
})();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.sheet&&!e.target.closest('#chart'))closeSheet()});
document.addEventListener('click',e=>{if(!e.target.closest('#pop')&&!e.target.closest('[data-act=pop]'))$('pop').classList.remove('show');if(!e.target.closest('#demo'))$('demo').classList.remove('open')},true);
function renderDemo(){$('dm').innerHTML=Object.entries(SCEN).map(([k,v])=>`<button data-act="scn" data-n="${k}" class="${+k===S.scn?'a':''}">${k} · ${v.name}</button>`).join('')}
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{renderChart();if(UI.sheet==='logic')drawLC()},120)});
load(1);renderDemo();render();
</script>
</body>
</html>
