<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const pad=n=>String(n).padStart(2,"0");
const r1=x=>Math.round(x*10)/10;
const neg=s=>s.replace(/^-/,"−");

const ft=p=>neg(String(+(+p).toFixed(2)))+"¢";                         // a threshold, as written
const fhm=(h,m)=>{h=((h%24)+24)%24;const ap=h<12?"am":"pm";const hh=h%12||12;return m?hh+":"+pad(m)+" "+ap:hh+(m===0?":00":"")+" "+ap;};
const fhs=h=>{h=((h%24)+24)%24;return (h%12||12)+(h<12?" am":" pm");};
const parseHM=s=>{const [h,m]=s.split(":").map(Number);return {h,m};};
const fT=s=>{const t=parseHM(s);return fhm(t.h,t.m);};

const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], DAYL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

/* ---------- mock data (what the /api/* endpoints would return) ---------- */
const LOGIC_JSON={"states":{"Разряд":{"entry_conditions":[{"type":"soc","value":80,"operator":">="}],"charging_logic":[{"soc":70,"price_on":-1,"price_off":-0.5,"known_minutes":30},{"soc":20,"price_on":-0.5,"price_off":0,"known_minutes":20},{"soc":0,"price_on":2,"price_off":3}]},"Заряд":{"entry_conditions":[{"type":"soc","value":20,"operator":"<="}],"charging_logic":[{"soc":80,"price_on":-1,"price_off":-0.5,"known_minutes":20},{"soc":40,"price_on":0,"price_off":0.5,"known_minutes":20},{"soc":0,"price_on":2,"price_off":3}]},"Поездка":{"entry_conditions":[],"charging_logic":[{"soc":0,"price_on":3,"price_off":3}]}}};

const DA_TOMOR=[1.2,0.6,-0.1,-0.3,0.2,0.9,2.0,2.8,3.0,3.1,3.3,3.5,3.9,4.2,4.8,5.1,5.3,4.9,4.0,3.4,2.9,2.4,2.1,1.8];
const toEnding=a=>{const r=new Array(24);a.forEach((v,h)=>r[(h+1)%24]=v);return r;};

const M={
  scenario:1,
  now:{dow:6,h:1,m:35},
  status:{},
  config:{
    mode:"auto", schedFall:"price", until:null, socTarget:80,
    schedule:[{days:[1,2,3,4,5],start:"01:00",end:"05:00"},{days:[0,6],start:"00:00",end:"06:00"}],
    wifi:{ssid:"Syrota-Home"}, pushover:{enabled:true,token:"azGDORePK8gMaC0QOYAMyEEuzJnyUi",user:"uQiRzpo4DXghDmr9QzzfQu27cmVRsG",device:"sergey-iphone"},
    mac:"8C:DE:52:DE:B4:A0", pollOn:60, pollOff:60, thresholdW:500, sign:"abs", relayActiveHigh:true, defaultRelay:false,
    probeDelay:30, staleMin:20, fullHold:0, wifiTimeout:300,
    otaUrl:"https://github.com/sergesyrota/charger-cost-control/releases/latest/download/manifest.json"
  },
  min_offset:0.5,
  logic:clone(LOGIC_JSON),
  prices:{},
  log:[],
  sessions:[
    {d:"Fri Nov 6",s:"1:20 am",e:"4:55 am",soc0:31,soc1:52,kwh:13.9,cost:16.8},

/* ---------- logic model: array form for editing, JSON form for storage ---------- */
function toArr(j){return {sel:j.state_select||"",states:Object.keys(j.states||{}).map(name=>{const s=j.states[name];return {name,entry:clone(s.entry_conditions||[]),blocks:clone(s.charging_logic||[])};})};}
function toJson(a){const o={};if(a.sel)o.state_select=a.sel;o.states={};a.states.forEach(s=>{o.states[s.name]={entry_conditions:s.entry.map(c=>({type:"soc",value:c.value,operator:c.operator})),charging_logic:s.blocks.map(b=>{const r={soc:b.soc,price_on:b.price_on,price_off:b.price_off};if(b.known_minutes)r.known_minutes=b.known_minutes;return r;})};});return o;}
let Draft=null; // {sel,states,dirty}
function draft(){if(!Draft){Draft=toArr(M.logic);Draft.dirty=false;}return Draft;}
const cmp=(a,op,b)=>op===">="?a>=b:op===">"?a>b:op==="<="?a<=b:a<b;

// Exact port of Vehicle::getApplicableLogic + controlCharging (PLAN §7.3), operators literal.
function decide(L,soc,price,minute,relayNow,sticky,minP){
  const out={};
  const forced=L.sel&&L.states.find(s=>s.name===L.sel);
  if(forced){out.state=L.sel;out.how="forced";}
  else{
    const hit=L.states.find(s=>s.entry.length&&s.entry.every(c=>cmp(soc,c.operator,c.value)));
    if(hit){out.state=hit.name;out.how="entered";out.conds=hit.entry;}else{out.state=sticky;out.how="sticky";}
  }
  out.si=L.states.findIndex(s=>s.name===out.state);
  let st=L.states[out.si];
  if(!st||!st.blocks.length){const d=L.states.find(s=>s.name==="default");if(d&&d.blocks.length){st=d;out.usedDefault=true;out.si=L.states.indexOf(d);}else{out.none=true;return out;}}
  let bi=st.blocks.findIndex(b=>soc>=b.soc);out.fallback=bi<0;if(bi<0)bi=st.blocks.length-1;
  out.bi=bi;out.block=st.blocks[bi];
  const res=v=>v==="min"?minP:+v;
  out.on=res(out.block.price_on);out.off=res(out.block.price_off);
  if(out.on==null||out.off==null){out.noMin=true;return out;}
  const km=out.block.known_minutes;out.enough=!km||minute>=km;
  if(relayNow&&price>out.off){out.relay=false;out.why="price is high";out.change=true;}
  else if(relayNow&&!out.enough){out.relay=false;out.why="not enough confidence yet";out.change=true;}
  else if(!relayNow&&price<=out.on&&out.enough){out.relay=true;out.why="price is low";out.change=true;}
  else{out.relay=relayNow;out.change=false;out.why=relayNow?"price still at or below the stop price":(price<=out.on?"price is low, but waiting for :"+pad(km)+" to be sure":"price is above the start price");}
  return out;
}
function inWindow(){
  if(!M.now)return null;const t=M.now.h*60+M.now.m;
  for(const w of M.config.schedule){const a=parseHM(w.start),b=parseHM(w.end),s=a.h*60+a.m,e=b.h*60+b.m;
    if(s<e){if(w.days.includes(M.now.dow)&&t>=s&&t<e)return w;}
    else if(s>e){if((w.days.includes(M.now.dow)&&t>=s)||(w.days.includes((M.now.dow+6)%7)&&t<e))return w;}}
  return null;
}
function nextWindowStart(){
  if(!M.now)return null;const t=M.now.h*60+M.now.m;
  for(let d=0;d<8;d++){const dow=(M.now.dow+d)%7;let best=null;
    for(const w of M.config.schedule){if(!w.days.includes(dow))continue;const a=parseHM(w.start),s=a.h*60+a.m;if(d===0&&s<=t)continue;if(best==null||s<best)best=s;}
    if(best!=null)return {d,dow,h:Math.floor(best/60),m:best%60};}
  return null;
}
const MODES={auto:"by price",schedule:"on a schedule",manual_on:"always on",manual_off:"always off"};
function modeKey(){const c=M.config;return c.mode==="schedule"?(c.schedFall==="price"?"schedule_price":"schedule"):c.mode;}

// The precedence engine (PLAN §7.1/7.2). apply=true commits the relay change + logs it.
function evaluate(apply){
  const S=M.status,C=M.config,R={mode:modeKey()};
  const soc=S.car.soc==null?0:S.car.soc;
  const dflt=why=>{R.relay=C.defaultRelay;R.kind="default";R.reason=why+" — using your default ("+(C.defaultRelay?"ON":"OFF")+")";};
  if(C.mode==="manual_on"||C.mode==="manual_off"){R.relay=C.mode==="manual_on";R.kind="manual";R.reason="Manual "+(R.relay?"ON":"OFF")+(C.until&&S.clockValid?" until "+fT(C.until):"");}
  else if(!S.clockValid){dflt("Clock not set yet");}
  else{
    let w=null;
    if(C.mode==="schedule"){w=inWindow();if(w){R.relay=true;R.kind="schedule";R.win=w;R.reason="Schedule window "+daysText(w.days)+" "+fT(w.start)+"–"+fT(w.end);}
      else if(C.schedFall==="off"){R.relay=false;R.kind="schedule";R.reason="Outside schedule windows (schedule only)";}}
    if(R.relay===undefined){
      if(!S.pricesKnown||S.price==null)dflt("Prices unknown");
      else if(C.socTarget&&S.car.soc!=null&&S.car.soc>=C.socTarget){R.relay=false;R.kind="target";R.reason="SOC target "+C.socTarget+"% reached";}
      else if(S.car.soc!=null&&Math.round(S.car.soc)>=100){R.relay=false;R.kind="full";R.reason="Bolt is full";}
      else{
        const d=decide(toArr(M.logic),soc,S.price,M.now.m,S.relay,S.sticky,minPrice());R.d=d;R.kind="price";
        if(d.none||d.noMin)dflt(d.none?"State has no charging lines":"No forecast for “cheapest by 7am”");
        else{R.relay=d.relay;R.reason=(d.relay?"Price is low":"Price is high");
          if(d.why==="not enough confidence yet")R.reason="Not enough confidence yet";
          R.reason+=" ("+fc(S.price)+(d.relay?" ≤ "+ft(d.off)+" stop":" vs "+ft(d.on)+" start")+") — "+d.state;}
      }
    }
  }
  if(apply){
    if(R.d&&R.d.state)S.sticky=R.d.state;
    if(R.relay!==S.relay){
      S.relay=R.relay;const manual=R.kind==="manual";
      M.log.unshift({t:nowStamp(),k:R.relay?"on":"off",msg:(manual?"Manual: ":"")+(R.relay?"ON: ":"OFF: ")+R.reason+"."});
      if(C.pushover.enabled)M.log.unshift({t:nowStamp(),k:"push",msg:"Pushover sent ("+(R.relay?"ON":"OFF")+")."});
      if(R.relay&&S.car.status==="online"){S.car.status="charging";S.car.kw=6.8;}
      if(!R.relay&&S.car.status==="charging"){S.car.status="online";S.car.kw=0;}
      if(R.relay&&!S.session)S.session={since:M.now?fhm(M.now.h,M.now.m):"now",kwh:0,cost:0};
      if(!R.relay)S.session=null;
    }
  }
  return R;
}
const nowStamp=()=>M.now?DAYS[M.now.dow]+" "+fhm(M.now.h,M.now.m):"up "+upTxt(M.status.uptime);
const upTxt=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?d+" d "+h+" h":(h?h+":"+pad(m)+":"+pad(s%60):"0:"+pad(m)+":"+pad(s%60));};
function daysText(d){const s=[...d].sort();const k=s.join("");
  if(k==="0123456")return "every day";if(k==="12345")return "weekdays";if(k==="06")return "weekends";if(!s.length)return "no days";
  return s.map(x=>DAYS[x]).join(", ");}

// When will it next charge? (forecast from day-ahead)
function nextCharge(R){
  const C=M.config,S=M.status;
  if(!S.clockValid)return "As soon as the clock syncs and prices arrive, I'll decide again.";
  if(C.mode==="manual_off")return "Not until you switch me back to price or schedule.";
  const nw=C.mode==="schedule"?nextWindowStart():null;
  const nwTxt=nw?(nw.d===0?"today":nw.d===1?"tomorrow":DAYL[nw.dow])+" at "+fhm(nw.h,nw.m):null;
  if(C.mode==="schedule"&&C.schedFall==="off")return nwTxt?"The next schedule window starts "+nwTxt+".":"No schedule windows are set.";
  if(!R.d||R.d.on==null)return nwTxt?"The next schedule window starts "+nwTxt+".":"I can't forecast without prices.";
  const on=R.d.on;let found=null;
  for(let k=1;k<=24;k++){const hh=M.now.h+k,day=hh>=24?1:0,h=hh%24;const p=daAt(day,h);if(p==null){break;}if(p<=on){found={h,day,p};break;}}
  let txt=found?"Day-ahead prices say it should dip to "+fc(found.p)+" around "+fhs(found.h)+(found.day?" tomorrow":"")+" — that's at or below the "+ft(on)+" start price."
    :"The forecast I have"+(M.prices.tomorrow?" (through tomorrow)":" (tomorrow's comes at 5 pm)")+" doesn't get down to "+ft(on)+", so no charge is expected yet.";
  if(nwTxt)txt+=" The schedule also turns it on "+nwTxt+".";
  return txt;
}

  }else{
    const t=spec.type==="time"?"time":spec.type==="text"?"text":"number";
    const v=spec.type==="price"&&val==="min"?"":val;
    h+='<div class="row" style="flex-wrap:nowrap"><input type="'+t+'" '+(t==="number"?'inputmode="decimal" step="'+(spec.step||1)+'"':"")+' value="'+esc(v==null?"":v)+'">'+(spec.unit?'<span style="white-space:nowrap">'+spec.unit+'</span>':"")+'</div>';
    if(spec.type==="price"){const mp=minPrice();h+='<button type="button" class="opt'+(val==="min"?" sel":"")+'" data-min="1" style="margin-top:8px;width:100%;border:1px dashed var(--accent)"><b>cheapest by 7am (+'+ft(M.min_offset)+')</b><span>Uses the lowest day-ahead price before 7 am plus your margin'+(mp!=null?" — "+fc(mp)+" right now":"")+'.</span></button>';}
  }
  if(spec.help)h+='<div class="help">'+spec.help+'</div>';
  h+='<div class="err"></div>';
  if(spec.type!=="choice")h+='<div class="acts"><button type="button" class="btn quiet" data-c>Cancel</button><button type="button" class="btn primary" data-ok>Done</button></div>';
  p.innerHTML=h;document.body.appendChild(p);popEl=p;
  const r=btn.getBoundingClientRect(),w=p.offsetWidth;
  p.style.top=(r.bottom+scrollY+6)+"px";p.style.left=Math.max(8,Math.min(r.left+scrollX,scrollX+document.documentElement.clientWidth-w-8))+"px";
  const inp=p.querySelector("input");if(inp){inp.focus();inp.select&&inp.select();}
  const commit=v=>{const e=spec.validate?spec.validate(v):null;if(e){p.querySelector(".err").textContent=e;return;}spec.set(v);closePop();(spec.after||afterEdit)();};
  p.addEventListener("click",ev=>{
    const o=ev.target.closest(".opt[data-i]");if(o){commit(spec.options[+o.dataset.i].v);return;}
    if(ev.target.closest("[data-min]")){commit("min");return;}
    const c=ev.target.closest(".chip");if(c){const d=+c.dataset.d;p._days.has(d)?p._days.delete(d):p._days.add(d);c.classList.toggle("sel");return;}
    const pr=ev.target.closest("[data-preset]");if(pr){p._days=new Set(pr.dataset.preset.split("").map(Number));p.querySelectorAll(".chip").forEach(c=>c.classList.toggle("sel",p._days.has(+c.dataset.d)));return;}
    if(ev.target.closest("[data-c]")){closePop();return;}
    if(ev.target.closest("[data-ok]"))doOk();
  });
  function doOk(){

    if(raw===""){commit(spec.allowEmpty?null:NaN);return;}
    commit(Number(raw));

}

function carSentence(){
  const c=M.status.car,s=M.status;
  const soc=c.soc!=null?c.soc+"%":"unknown";
  if(c.status==="charging")return "Your Bolt is charging at <span class=big>"+c.kw.toFixed(1)+" kW</span>, now at "+soc+".";
  if(s.relay){if(c.status==="not_detected")return "The charger is <span class=big>on</span>, but I can't see your Bolt.";return "The charger is <span class=big>on</span>, but your Bolt isn't drawing power.";}
  const where={asleep:"Your Bolt is asleep",online:"Your Bolt is awake",not_detected:"I can't see your Bolt"}[c.status];
  return "The charger is <span class=big>off</span>. "+where+(c.status!=="not_detected"?" at "+soc:" (last known "+soc+")")+".";
}
function priceSentence(R){
  const S=M.status;if(!S.clockValid||!S.pricesKnown||S.price==null)return "";
  const p=fc(S.price);
  if(R.kind!=="price"||!R.d)return " Electricity costs "+p+" right now.";
  const d=R.d;const word=S.price<=d.on?"cheap":S.price>d.off?"too expensive":"in between";
  return " Electricity is "+word+" right now ("+p+").";
}
function planSentence(R){
  const S=M.status,C=M.config;
  if(R.kind==="default")return " I've just restarted and don't know the time yet, so I can't trust any prices. Until I can, the charger stays "+(C.defaultRelay?"on":"off")+" — that's your default.";
  if(R.kind==="manual")return R.relay?(C.until&&S.clockValid?" You switched it on by hand; I'll go back to "+(C.schedFall?"deciding":"deciding")+" by myself at "+fT(C.until)+".":" You switched it on by hand and it stays on until you change it."):" You switched it off by hand.";
  if(R.kind==="schedule")return R.relay?" The schedule keeps it on until "+fT(R.win.end)+".":" It's outside your schedule, and you've asked for schedule only.";
  if(R.kind==="target")return " It's reached your "+C.socTarget+"% limit, so I've stopped.";
  if(R.kind==="full")return " The battery is full.";
  const d=R.d;
  if(R.relay)return " I'll stop if it goes above "+ft(d.off)+".";
  if(d.enough===false&&S.price<=d.on)return " It's low enough, but I'll wait until :"+pad(d.block.known_minutes)+" past the hour to be sure.";
  return " I'll start when it's "+ft(d.on)+" or less.";
}

function priceTok(b,key,label){
  const v=b[key];const mp=minPrice();
  const lab=v==="min"?"cheapest by 7am (+"+ft(M.min_offset)+")":ft(v);
  return tok(lab,{type:"price",title:label,unit:"¢/kWh",step:0.1,get:()=>b[key],help:"Supply price only (no delivery). Negative means you're paid to use power.",
    validate:v=>v==="min"?null:(isNaN(v)||v<-50||v>100?"Enter a price between −50 and 100¢.":null),set:v=>{b[key]=v;}});
}
function blockSentence(st,b,i){
  const n=st.blocks.length,prev=i>0?st.blocks[i-1].soc:null;
  const socTok=tok(b.soc===0?"any level":b.soc+"% or more",{type:"num",title:"Use this line when battery is at least",unit:"%",get:()=>b.soc,help:"0 means “any level”. Lines are checked top to bottom; the first one the battery reaches wins.",validate:v=>!Number.isInteger(v)||v<0||v>100?"Whole number, 0–100.":null,set:v=>{b.soc=v;}});
  let s=b.soc===0?(i>0?"Otherwise, at "+socTok+(prev!=null&&prev>0?" below "+prev+"%":""):"At "+socTok):"When battery is "+socTok;
  s+=": start charging at "+priceTok(b,"price_on","Start charging at or below")+" or less, stop above "+priceTok(b,"price_off","Stop charging above")+", ";
  const km=b.known_minutes;
  s+=tok(km?"wait until :"+pad(km)+" past the hour":"no waiting",{type:"num",title:"Wait until this many minutes past the hour",unit:"min",get:()=>km||0,
    help:"Early in an hour the price average is built from only a few 5-minute readings. Waiting until e.g. :20 makes sure the price is really low. 0 = no waiting.",
    validate:v=>!Number.isInteger(v)||v<0||v>59?"Whole minutes, 0–59.":null,set:v=>{if(v)b.known_minutes=v;else delete b.known_minutes;}})+(km?" to be sure":"")+".";
  if(i===n-1&&b.soc>0)s+=' <span class="note">(Also used below '+b.soc+'% — it\'s the last line.)</span>';
  return s;
}
function stateWarnings(D){
  const W={},G=[];const add=(i,m,e)=>{(W[i]=W[i]||[]).push({m,e});};
  const names=new Set();
  D.states.forEach((s,i)=>{
    if(!s.name.trim())add(i,"Give this state a name.",true);
    if(names.has(s.name))add(i,"Another state already has this name.",true);names.add(s.name);
    if(!s.blocks.length)add(i,"Needs at least one charging line.",true);
    const socs=s.blocks.map(b=>b.soc);if(new Set(socs).size!==socs.length)add(i,"Two lines start at the same battery level — only the first will ever be used.");
    s.blocks.forEach((b,j)=>{if(b.price_on!=="min"&&b.price_off!=="min"&&+b.price_on>+b.price_off)add(i,"Line "+(j+1)+": start price ("+ft(b.price_on)+") is above the stop price ("+ft(b.price_off)+") — it would switch on and immediately off.");});
    const unsorted=s.blocks.some((b,j)=>j&&b.soc>s.blocks[j-1].soc);if(unsorted)add(i,"Lines will be put in order (highest battery first) when you save.");
  });
  // overlapping entry ranges (PLAN §7.3)
  const rng=s=>{let lo=-Infinity,li=false,hi=Infinity,hiI=false;s.entry.forEach(c=>{const v=+c.value;
      if(c.operator===">="||c.operator===">"){const inc=c.operator===">=";if(v>lo||(v===lo&&!inc)){lo=v;li=inc;}}
      else{const inc=c.operator==="<=";if(v<hi||(v===hi&&!inc)){hi=v;hiI=inc;}}});return {lo,li,hi,hiI};};
  const desc=r=>(r.lo>-Infinity?(r.li?"≥ ":"> ")+r.lo+"%":"")+(r.lo>-Infinity&&r.hi<Infinity?" and ":"")+(r.hi<Infinity?(r.hiI?"≤ ":"< ")+r.hi+"%":"");
  for(let a=0;a<D.states.length;a++)for(let b=a+1;b<D.states.length;b++){
    const A=D.states[a],B=D.states[b];if(!A.entry.length||!B.entry.length)continue;
    const x=rng(A),y=rng(B);let lo,li,hi,hiI;
    if(x.lo>y.lo||(x.lo===y.lo&&!x.li)){lo=x.lo;li=x.li;}else{lo=y.lo;li=y.li;}
    if(x.hi<y.hi||(x.hi===y.hi&&!x.hiI)){hi=x.hi;hiI=x.hiI;}else{hi=y.hi;hiI=y.hiI;}
    if(lo<hi||(lo===hi&&li&&hiI)){const m="Overlaps with “"+(a===b?"":B.name)+"” ("+desc(x)+" vs "+desc(y)+"): at "+(lo===hi?lo+"%":"some levels")+" both match, and the first one listed wins.";add(a,m);add(b,m.replace(B.name,A.name));}
  }
  return W;
}

const markDirty=()=>{draft().dirty=true;};

function addCond(i){const s=draft().states[i];s.entry.push({type:"soc",operator:s.entry.length?"<":">=",value:s.entry.length?100:50});markDirty();rerules();}
function delCond(i,j){draft().states[i].entry.splice(j,1);markDirty();rerules();}
function addBlock(i){const s=draft().states[i];const used=new Set(s.blocks.map(b=>b.soc));let v=50;while(used.has(v)&&v<100)v+=5;s.blocks.push({soc:v,price_on:0,price_off:1});markDirty();rerules();}

function pSchedule(){

      +'.'+(parseHM(w.end).h*60+parseHM(w.end).m<parseHM(w.start).h*60+parseHM(w.start).m?' <span class="small">(overnight)</span>':"")+(open?' <span class="tag">on now</span>':"")+' <button class="x" title="Remove" onclick="delWin('+i+')">×</button></p>';

function priceChart(){

  const X=x=>l+(W-l-r)*x/24,Y=y=>t+(H-t-b)*(ymax-y)/(ymax-ymin);
  let g="";
  for(let y=ymin;y<=ymax;y++){g+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(y)+'" y2="'+Y(y)+'" stroke="var('+(y===0?"--ink2":"--grid")+')" stroke-width="'+(y===0?1:.7)+'"/>';if((y-ymin)%(ymax-ymin>8?2:1)===0)g+='<text x="'+(l-6)+'" y="'+(Y(y)+4)+'" text-anchor="end">'+neg(String(y))+'</text>';}

  (S.onSpans||[]).forEach(sp=>{g+='<rect x="'+X(sp[0])+'" y="'+t+'" width="'+(X(sp[1])-X(sp[0]))+'" height="'+(H-t-b)+'" fill="var(--accent-soft)"/>';});
  const step=(arr,until)=>{let d="";arr.forEach((v,h)=>{if(isNaN(v)||h>=until)return;d+=(d?"L":"M")+X(h)+","+Y(v)+"H"+X(Math.min(h+1,24));});return d;};
  g+='<path d="'+step(DA_TODAY,24)+'" fill="none" stroke="var(--mute)" stroke-dasharray="4 3" stroke-width="1.5"/>';
  g+='<path d="'+step(P.actual,24)+'" fill="none" stroke="var(--accent)" stroke-width="2.2"/>';

  g+='<line x1="'+X(nh)+'" x2="'+X(nh)+'" y1="'+t+'" y2="'+(H-b)+'" stroke="var(--ink)" stroke-width="1"/><text x="'+(X(nh)+4)+'" y="'+(t+10)+'" style="fill:var(--ink)">now</text>';

  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Today\'s prices in cents per kWh">'+g+'</svg>';
}

function dailyChart(){

  // Car
  h+='<fieldset><legend>Car connection</legend><p class="intro">How I talk to the Bluetooth OBD dongle in the Bolt.</p>';
  h+=fld("mac","Dongle address",inp("mac","text",s.mac,'spellcheck="false" autocapitalize="characters"'),"Six pairs like 8C:DE:52:DE:B4:A0.");
  h+='<div class="field"><label>How often to check the car</label><div class="inl">every '+inp("pollOn","number",s.pollOn,'min="15" max="600"')+' seconds while charging, every '+inp("pollOff","number",s.pollOff,'min="5" max="720"')+' minutes otherwise</div>'+(SETERR.pollOn?'<div class="ferr">'+SETERR.pollOn+'</div>':"")+(SETERR.pollOff?'<div class="ferr">'+SETERR.pollOff+'</div>':"")+'<div class="help">Asking too often while off keeps the car awake and drains its 12 V battery.</div></div>';
  h+='<div class="field"><label>When is it “charging”?</label><div class="inl">when power is at least '+inp("thresholdW","number",s.thresholdW,'min="50" max="5000"')+' W, counting <select data-k="sign" id="f-sign"><option value="abs"'+(s.sign==="abs"?" selected":"")+'>either direction (not verified yet)</option><option value="pos"'+(s.sign==="pos"?" selected":"")+'>positive as charging</option><option value="neg"'+(s.sign==="neg"?" selected":"")+'>negative as charging</option></select></div>'+(SETERR.thresholdW?'<div class="ferr">'+SETERR.thresholdW+'</div>':"")+'<div class="help">Set the direction once you\'ve seen a real charge — an idle Bolt showed −35 W.</div></div>';
  h+='<div class="field"><label>Check after switching on</label><div class="inl">wait '+inp("probeDelay","number",s.probeDelay,'min="5" max="300"')+' seconds, then ask the car whether it started (used in the ON notification)</div>'+(SETERR.probeDelay?'<div class="ferr">'+SETERR.probeDelay+'</div>':"")+'</div>';
  h+='<div class="field"><label>When full</label><div class="inl">keep off for '+inp("fullHold","number",s.fullHold,'min="0" max="1440"')+' minutes after reaching 100%</div><div class="help">0 = just stop.</div></div></fieldset>';
  // Relay
  h+='<fieldset><legend>Charger relay</legend><p class="intro">The signal wire on GPIO 4.</p>';
  h+='<div class="field"><label>Wiring</label><div class="inl">the relay is on when GPIO 4 is <select data-k="relayActiveHigh" id="f-relayActiveHigh"><option value="1"'+(s.relayActiveHigh?" selected":"")+'>high</option><option value="0"'+(!s.relayActiveHigh?" selected":"")+'>low</option></select></div><div class="help">Check on the bench: if “ON” turns the charger off, flip this.</div></div>';
  h+='<div class="field"><label>When I can\'t decide</label><div class="inl">keep the charger <select data-k="defaultRelay" id="f-defaultRelay"><option value="0"'+(!s.defaultRelay?" selected":"")+'>off</option><option value="1"'+(s.defaultRelay?" selected":"")+'>on</option></select></div><div class="help">Used right after a restart, before the clock syncs, or when prices are missing.</div></div></fieldset>';
  // Prices
  h+='<fieldset><legend>Prices</legend><p class="intro">ComEd hourly pricing, supply only.</p><div class="field"><label>Trust prices for</label><div class="inl">'+inp("staleMin","number",s.staleMin,'min="5" max="120"')+' minutes without a fresh 5-minute reading</div>'+(SETERR.staleMin?'<div class="ferr">'+SETERR.staleMin+'</div>':"")+'<div class="help">After that I use the day-ahead forecast (marked “estimated”). If that\'s missing too, I fall back to the default above.</div></div></fieldset>';
  if(s.dirty)h+='<div class="savebar"><span class="msg">Unsaved settings.</span><button class="btn quiet" onclick="SET=null;SETERR={};render()">Discard</button><button class="btn primary" onclick="saveSettings()">Save settings</button></div>';
  h+='<p style="margin-top:30px"><a href="#about">About this device →</a> firmware, updates, memory and uptime.</p>';
  return h;
}
function fld2(k,v){return '<input data-k="'+k+'" data-scale="60" type="number" min="1" max="60" value="'+v+'" style="width:64px;padding:3px 6px;border:1px solid var(--rule);background:var(--card);border-radius:3px">';}
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k||page()!=="settings")return;const s=setDraft();
  const el=e.target;let v=el.type==="checkbox"?el.checked:el.type==="number"?(el.value===""?NaN:Number(el.value)*(el.dataset.scale?+el.dataset.scale:1)):el.value;
  if(k==="relayActiveHigh"||k==="defaultRelay")v=el.value==="1";
  s[k]=v;const was=s.dirty;s.dirty=true;validateSettings(false);
  if(!was){const y=scrollY;render();scrollTo(0,y);const n=$('[data-k="'+k+'"]');if(n&&n.focus){n.focus();if(n.setSelectionRange&&n.type==="text")n.setSelectionRange(n.value.length,n.value.length);}}
});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k&&page()==="settings"){validateSettings(true);}});
function validateSettings(show){
  const s=setDraft(),E={};
  if(s.pushEnabled&&!/^[A-Za-z0-9]{30}$/.test(s.token))E.token="Should be exactly 30 letters/digits"+(s.token?" (this one is "+s.token.length+")":"")+".";
  if(s.pushEnabled&&!/^[A-Za-z0-9]{30}$/.test(s.user))E.user="Should be exactly 30 letters/digits.";
  if(!/^([0-9A-F]{2}:){5}[0-9A-F]{2}$/i.test(s.mac))E.mac="That doesn't look like a Bluetooth address (e.g. 8C:DE:52:DE:B4:A0).";
  const rng=(k,a,b,m)=>{if(!Number.isFinite(s[k])||s[k]<a||s[k]>b)E[k]=m;};
  rng("pollOn",15,600,"While charging: 15–600 seconds.");rng("pollOff",5,720,"Otherwise: 5–720 minutes.");rng("thresholdW",50,5000,"Threshold: 50–5000 W.");
  rng("probeDelay",5,300,"5–300 seconds.");rng("staleMin",5,120,"5–120 minutes.");rng("fullHold",0,1440,"0–1440 minutes.");rng("wifiTimeout",60,3600,"1–60 minutes.");
  if(show){SETERR=E;const y=scrollY;render();scrollTo(0,y);}
  return E;
}
function saveSettings(){
  const E=validateSettings(false);SETERR=E;if(Object.keys(E).length){render();toast("Please fix the highlighted fields.");return;}
  const s=SET,C=M.config;C.pushover={enabled:s.pushEnabled,token:s.token,user:s.user,device:s.device};
  ["mac","pollOn","pollOff","thresholdW","sign","relayActiveHigh","defaultRelay","probeDelay","staleMin","fullHold","wifiTimeout"].forEach(k=>C[k]=s[k]);
  SET=null;SETERR={};M.log.unshift({t:nowStamp(),k:"info",msg:"Settings saved."});evaluate(true);render();toast("Settings saved.");
}
function pushTest(){const s=setDraft();if(!s.pushEnabled){toast("Notifications are turned off — tick “Send notifications” first.");return;}
  const E=validateSettings(true);if(E.token||E.user){toast("Fix the token/user key first.");return;}
  if(!M.status.clockValid){toast("Can't send yet — HTTPS needs the clock, which isn't set.");return;}
  toast("Sending…");setTimeout(()=>{M.log.unshift({t:nowStamp(),k:"push",msg:"Pushover test sent."});toast("Test message sent to "+(s.device||"all devices")+".");},900);}
function wifiScan(){scanState="busy";pickNet=null;render();setTimeout(()=>{scanState=[{ssid:"Syrota-Home",rssi:-61,lock:1},{ssid:"Syrota-Garage",rssi:-54,lock:1},{ssid:"Syrota-Guest",rssi:-63,lock:0},{ssid:"xfinitywifi",rssi:-78,lock:0},{ssid:"NETGEAR-5G-42",rssi:-84,lock:1}];render();},1300);}
function wifiJoin(){const n=scanState[pickNet],p=$("#f-wpass").value;if(n.lock&&p.length<8){SETERR.wpass="WPA passwords are at least 8 characters.";render();return;}
  delete SETERR.wpass;M.log.unshift({t:nowStamp(),k:"info",msg:"Wi-Fi changed to "+n.ssid+"."});pickNet=null;scanState=null;render();
  toast("Saved. Trying "+n.ssid+" for "+Math.round(M.config.wifiTimeout/60)+" min — if it fails, look for the ChargerControl-4F2A hotspot.");}

/* ---------- About this device ---------- */
let OTA={url:null,err:null,check:null,busy:false,pct:null,phase:""};
function pAbout(){
  const S=M.status,C=M.config;if(OTA.url==null)OTA.url=C.otaUrl;
  const hp=S.heap,kb=b=>(b/1024).toFixed(0)+" KB";
  let h='<h2>About this device</h2>';
  h+='<p class="lede" style="font-size:21px">An ESP32-C3 in the garage, running firmware <b>'+S.fw+'</b>. It has been up for '+upTxt(S.uptime)+' since its last restart ('+esc(S.reset.toLowerCase())+').</p>';
  if(S.rollback)h+='<div class="banner err"><b>Running from rollback.</b> The last update didn\'t confirm itself within 5 minutes (Wi-Fi + one price fetch + web page), so the device went back to the previous version.</div>';
  else h+='<p class="small">Running normally — not a rollback.</p>';
  h+='<div class="kicker">Updates</div><p class="small">Updates come over HTTPS from GitHub Releases. I check the manifest, download to the spare slot, verify it and restart.</p>';
  h+='<div class="field"><label for="f-ota">Update manifest URL</label><input id="f-ota" type="url" value="'+esc(OTA.url)+'" spellcheck="false" style="max-width:none"'+(OTA.err?' class="bad"':"")+'>'+(OTA.err?'<div class="ferr">'+OTA.err+'</div>':"")+'<div class="help">Must start with https://. A direct .bin link also works, but then there\'s no checksum to verify. <button class="btn link" onclick="OTA.url=null;OTA.err=null;M.config.otaUrl=\''+"https://github.com/sergesyrota/charger-cost-control/releases/latest/download/manifest.json"+'\';render()">Reset to default</button></div></div>';
  h+='<div class="row"><button class="btn" onclick="otaCheck()"'+(OTA.busy?" disabled":"")+'>'+(OTA.busy&&OTA.pct==null?'<span class="spin"></span> Checking…':"Check for updates")+'</button><button class="btn danger" onclick="reboot()">Restart device</button></div>';
  if(OTA.check){const c=OTA.check;
    if(c.same)h+='<p>You\'re up to date (<b>'+S.fw+'</b>).</p>';
    else{h+='<div class="card"><h3>Version '+c.version+' is available</h3><p class="small">You have '+S.fw+'. '+(c.bin?"<b style='color:var(--warn)'>Direct .bin link — no sha256 check.</b>":"Size "+(c.size/1048576).toFixed(2)+" MB · sha256 "+c.sha.slice(0,12)+"…")+'</p><p>'+c.notes+'</p>';
      if(OTA.pct!=null)h+='<div class="prog"><div style="width:'+OTA.pct+'%"></div></div><p class="small sans">'+OTA.phase+'</p>';
      else h+='<button class="btn primary" onclick="otaInstall()">Install '+c.version+'</button> <span class="small">The charger stays as it is during the update (about a minute).</span>';
      h+='</div>';}}
  h+='<div class="kicker">Health</div><dl class="dl">';
  h+='<dt>Clock</dt><dd>'+(S.clockValid?"Synced via NTP (America/Chicago)":"<b>Not set</b> — waiting for NTP")+'</dd>';
  h+='<dt>Wi-Fi</dt><dd>'+esc(S.ssid)+', '+S.rssi+' dBm, '+S.ip+(S.hotspot?" · hotspot on":" · hotspot off")+'</dd>';
  h+='<dt>Memory</dt><dd>'+kb(hp.free)+' free now, lowest ever '+kb(hp.min)+', largest block '+kb(hp.largest)+'</dd>';
  h+='<dt>Prices</dt><dd>'+(S.pricesKnown?"5-min feed "+ago(S.ageMin)+(S.estimated?" (stale → using day-ahead)":""):"none yet")+'</dd>';
  h+='<dt>Car link</dt><dd>Dongle '+esc(C.mac)+' · '+({charging:"charging",online:"online",asleep:"asleep",not_detected:"not detected"})[S.car.status]+'</dd>';
  h+='<dt>Uptime</dt><dd>'+upTxt(S.uptime)+' · last reset: '+esc(S.reset)+'</dd>';
  h+='<dt>Firmware</dt><dd>'+S.fw+' (installed '+S.fwDate+') · ESP32-C3 · 4 MB flash</dd></dl>';
  h+='<p class="small"><a href="#history">The diary →</a> has every event, error and notification.</p>';
  return h;
}
function otaCheck(){
  const u=$("#f-ota").value.trim();OTA.url=u;OTA.check=null;OTA.pct=null;
  if(!/^https:\/\/[^\s/]+\.[^\s]+/.test(u)){OTA.err=/^http:\/\//i.test(u)?"Plain http:// isn't allowed — updates must use https://.":"Enter a full https:// address.";render();return;}
  OTA.err=null;M.config.otaUrl=u;OTA.busy=true;render();
  setTimeout(()=>{OTA.busy=false;const bin=/\.bin$/i.test(u);
    OTA.check=M.status.fw==="1.4.0"?{same:true}:{version:"1.4.0",bin,size:1214336,sha:"9f2c41d07be3a5e8c0d1",notes:"Adds the overlap warning for state entry rules, retries Pushover once after 60 s, and fixes the “estimated” price flag after a Wi-Fi drop."};render();},1100);
}
function otaInstall(){
  OTA.busy=true;OTA.pct=0;OTA.phase="Downloading…";render();
  const iv=setInterval(()=>{OTA.pct=Math.min(100,OTA.pct+7+Math.random()*9);
    OTA.phase=OTA.pct<100?"Downloading… "+Math.floor(OTA.pct)+"% of 1.16 MB":(OTA.check.bin?"Done (no checksum to verify). Restarting…":"Verifying sha256… OK. Restarting…");
    if(page()==="about")render();
    if(OTA.pct>=100){clearInterval(iv);setTimeout(()=>{M.status.fw="1.4.0";M.status.fwDate="today";M.status.uptime=4;M.status.reset="Software (OTA update)";M.status.rollback=false;
      M.log.unshift({t:nowStamp(),k:"info",msg:"OTA: installed 1.4.0, restarted. Will confirm after Wi-Fi + one price fetch."});OTA={url:null,err:null,check:null,busy:false,pct:null,phase:""};render();toast("Updated to 1.4.0 and restarted.");},1400);}
  },300);
}
function reboot(){if(!confirm("Restart the device now? The relay goes to your default ("+(M.config.defaultRelay?"ON":"OFF")+") until the clock and prices are back."))return;
  toast("Restarting…");setTimeout(()=>{M.status.uptime=6;M.status.reset="Software (user restart)";M.log.unshift({t:"up 0:00:01",k:"info",msg:"Restart requested from the web page."});render();toast("Back up.");},1500);}

/* ---------- demo switcher ---------- */
function demoMenu(){$("#demoMenu").innerHTML='<div class="t">Demo scenario</div>'+SCEN.slice(1).map((s,i)=>'<button type="button" data-n="'+(i+1)+'" class="'+(M.scenario===i+1?"sel":"")+'"><b>'+(i+1)+". "+s.name+'</b><br><span class="mute">'+s.desc+'</span></button>').join("");}
$("#demoBtn").onclick=e=>{e.stopPropagation();demoMenu();$("#demo").classList.toggle("open");};
$("#demoMenu").onclick=e=>{const b=e.target.closest("button[data-n]");if(!b)return;loadScenario(+b.dataset.n);SIM=null;OTA.check=null;$("#demo").classList.remove("open");render();toast("Scenario: "+SCEN[+b.dataset.n].name);};
document.addEventListener("click",e=>{if(!e.target.closest("#demo"))$("#demo").classList.remove("open");});

loadScenario(1);render();
</script>
