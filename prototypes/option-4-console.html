<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charger — Option 4: Console</title>
<style>
:root{
  --bg:#0c1117;--panel:#121921;--panel2:#17202a;--inset:#0e141b;--line:#222d3a;--line2:#2f3d4f;
  --tx:#d8e0ea;--mut:#8293a8;--dim:#5a6a80;
  --amb:#f2a93b;--grn:#3fd17f;--red:#f0605a;--cy:#5bb8dc;--vi:#a98bf0;
  --ambbg:rgba(242,169,59,.13);--grnbg:rgba(63,209,127,.13);--redbg:rgba(240,96,90,.13);--cybg:rgba(91,184,220,.13);
  --shade:rgba(63,209,127,.10);--shadow:0 12px 40px rgba(0,0,0,.55);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg:#eef1f4;--panel:#fff;--panel2:#f5f7f9;--inset:#f8f9fb;--line:#d2d8e0;--line2:#aeb8c5;
  --tx:#0a1220;--mut:#3f4b5c;--dim:#6a7585;
  --amb:#9a5800;--grn:#037a3a;--red:#bf2219;--cy:#0a6890;--vi:#5b3cc4;
  --ambbg:#fff1dc;--grnbg:#dcf5e6;--redbg:#fde3e1;--cybg:#dcf0f8;--shade:rgba(3,122,58,.10);--shadow:0 12px 40px rgba(10,20,40,.18);color-scheme:light}}
:root[data-theme=light]{
  --bg:#eef1f4;--panel:#fff;--panel2:#f5f7f9;--inset:#f8f9fb;--line:#d2d8e0;--line2:#aeb8c5;
  --tx:#0a1220;--mut:#3f4b5c;--dim:#6a7585;
  --amb:#9a5800;--grn:#037a3a;--red:#bf2219;--cy:#0a6890;--vi:#5b3cc4;
  --ambbg:#fff1dc;--grnbg:#dcf5e6;--redbg:#fde3e1;--cybg:#dcf0f8;--shade:rgba(3,122,58,.10);--shadow:0 12px 40px rgba(10,20,40,.18);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 var(--sans);font-variant-numeric:tabular-nums}
body{overflow-x:hidden}
a{color:var(--cy)}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
kbd{font:11px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--mut);background:var(--panel2)}
.lbl{font:600 10px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
/* top */
.top{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .back{font:11px var(--mono);color:var(--mut);text-decoration:none;white-space:nowrap}
.top .back:hover{color:var(--tx)}
.brand{font:700 12px var(--mono);letter-spacing:.14em;white-space:nowrap}
.brand b{color:var(--amb)}
.sp{flex:1}
.kbtn{display:flex;align-items:center;gap:8px;min-width:0;border:1px solid var(--line);background:var(--inset);border-radius:4px;padding:3px 6px 3px 10px;color:var(--mut);cursor:pointer}
.kbtn span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ib{border:1px solid var(--line);background:transparent;border-radius:4px;height:26px;min-width:26px;cursor:pointer;color:var(--mut)}
.ib:hover,.kbtn:hover{border-color:var(--line2);color:var(--tx)}
#navBtn{display:none}
/* strip */
.strip{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel2)}
.cell{padding:5px 12px;border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column;justify-content:center}
.cell .v{font:600 15px/1.25 var(--mono);white-space:nowrap}
.cell .v small{font-size:11px;color:var(--mut);font-weight:400}
.cell.grow{flex:1;border-right:0}
.pill{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--mono);letter-spacing:.06em;padding:2px 8px;border-radius:3px;border:1px solid}
.pill.on{color:var(--grn);background:var(--grnbg);border-color:var(--grn)}
.pill.off{color:var(--mut);background:transparent;border-color:var(--line2)}
.pill.def{color:var(--amb);background:var(--ambbg);border-color:var(--amb)}
.led{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--dim);flex:none}
.led.g{background:var(--grn);box-shadow:0 0 6px var(--grn)}.led.a{background:var(--amb);box-shadow:0 0 6px var(--amb)}.led.r{background:var(--red);box-shadow:0 0 6px var(--red)}
.pill.on .led{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.dots{display:flex;gap:12px;align-items:center;font:11px var(--mono);color:var(--mut)}
.dots span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.c-g{color:var(--grn)}.c-a{color:var(--amb)}.c-r{color:var(--red)}.c-c{color:var(--cy)}.c-m{color:var(--mut)}.c-d{color:var(--dim)}
/* banners */
.banner{display:flex;gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid;font-size:12.5px}
.banner.a{background:var(--ambbg);border-color:var(--amb);color:var(--tx)}
.banner.r{background:var(--redbg);border-color:var(--red)}
.banner.c{background:var(--cybg);border-color:var(--cy)}
.banner b{font-family:var(--mono)}
.banner .sp{flex:1}
/* layout */
.body{display:grid;grid-template-columns:196px minmax(0,1fr);min-height:calc(100vh - 90px)}
.side{border-right:1px solid var(--line);background:var(--panel);padding:8px 0 80px}
.side h4{margin:12px 14px 4px;font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.side a{display:flex;align-items:center;gap:8px;padding:5px 14px;color:var(--mut);text-decoration:none;border-left:2px solid transparent;font-size:13px}
.side a:hover{color:var(--tx);background:var(--panel2)}
.side a.act{color:var(--tx);border-left-color:var(--amb);background:var(--panel2)}
.side a .k{margin-left:auto;font:10px var(--mono);color:var(--dim)}
.side a .bd{font:600 9px var(--mono);padding:0 4px;border-radius:2px;background:var(--ambbg);color:var(--amb)}
.side .hint{margin:16px 14px 0;padding-top:10px;border-top:1px solid var(--line);font:11px/1.8 var(--mono);color:var(--dim)}
main{padding:14px 16px 110px;min-width:0}
.ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.ph h1{margin:0;font:600 16px var(--sans);letter-spacing:.01em}
.ph .crumb{font:11px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.ph .sp{flex:1}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:5px;min-width:0}
.pnl>.hd{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.pnl>.hd .sp{flex:1}
.pnl>.bd{padding:10px 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px}
.kv dt{color:var(--mut)}.kv dd{margin:0;font-family:var(--mono);text-align:right;min-width:0;overflow-wrap:anywhere}
.big{font:600 30px/1.1 var(--mono);letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);border-radius:4px;padding:5px 11px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--amb);border-color:var(--amb);color:#111;font-weight:600}
.btn.grn{background:var(--grn);border-color:var(--grn);color:#06140c;font-weight:600}
.btn.dng{color:var(--red);border-color:var(--red);background:transparent}
.btn.sm{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=password],input[type=time],input[type=url],select,textarea{background:var(--inset);border:1px solid var(--line2);border-radius:3px;padding:4px 7px;min-width:0;font-family:var(--mono);font-size:12.5px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--cy);outline-offset:-1px}
input.bad{border-color:var(--red);background:var(--redbg)}
.err{color:var(--red);font-size:12px;margin-top:3px}
.warn{color:var(--amb);font-size:12px}
.hint2{color:var(--mut);font-size:12px}
.fld{display:grid;grid-template-columns:200px minmax(0,1fr);gap:4px 14px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.fld:last-child{border-bottom:0}
.fld>label{padding-top:4px;color:var(--mut)}
.fld input[type=text],.fld input[type=url],.fld input[type=password],.fld select{width:100%;max-width:420px}
.fld input[type=number]{width:110px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-right:1px solid var(--line2);background:transparent;padding:6px 12px;cursor:pointer;color:var(--mut);font-size:12.5px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ambbg);color:var(--amb);font-weight:600}
.seg button:disabled{opacity:.4;cursor:not-allowed}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
.t th{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t td.n,.t th.n{text-align:right;font-family:var(--mono)}
.t tr.hl td{background:var(--grnbg)}
.t tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.tag{display:inline-block;font:600 9.5px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:0 5px;border-radius:2px;border:1px solid currentColor;white-space:nowrap}
.tag.g{color:var(--grn)}.tag.a{color:var(--amb)}.tag.r{color:var(--red)}.tag.c{color:var(--cy)}.tag.m{color:var(--mut)}.tag.v{color:var(--vi)}
/* hero */
.hero{display:grid;grid-template-columns:6px minmax(0,1fr);overflow:hidden}
.hero .bar{background:var(--dim)}
.hero.on .bar{background:var(--grn)}.hero.def .bar{background:var(--amb)}.hero.warn .bar{background:var(--amb)}
.hero .in{padding:12px 16px}
.hero .state{font:700 26px/1.1 var(--mono);letter-spacing:.02em}
.hero.on .state{color:var(--grn)}
.hero .why{font-size:15px;margin:6px 0 10px}
.lines{display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 10px;font-size:12.5px;margin-bottom:12px}
.lines .lbl{padding-top:2px}
.socbar{height:8px;background:var(--inset);border:1px solid var(--line);border-radius:2px;position:relative;overflow:hidden;margin:6px 0}
.socbar i{position:absolute;left:0;top:0;bottom:0;background:var(--grn)}
.socbar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--amb)}
.chain{display:flex;gap:6px;flex-wrap:wrap}
.chain span{font:12px var(--mono);padding:3px 8px;border:1px solid var(--line2);border-radius:3px;color:var(--mut)}
.chain span.cur{border-color:var(--grn);color:var(--grn);background:var(--grnbg)}
/* logic */
.split{display:grid;grid-template-columns:250px minmax(0,1fr);gap:10px;align-items:start}
.slist{list-style:none;margin:0;padding:4px}
.slist li{display:flex;align-items:center;gap:6px;padding:7px 6px;border:1px solid transparent;border-radius:4px;cursor:pointer;margin-bottom:2px}
.slist li:hover{background:var(--panel2)}
.slist li.sel{border-color:var(--amb);background:var(--ambbg)}
.slist li.drag{opacity:.4}
.slist li.over{box-shadow:inset 0 2px 0 var(--cy)}
.slist .grip{cursor:grab;color:var(--dim);font:14px var(--mono);user-select:none;padding:0 2px}
.slist .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slist .sub{font:11px var(--mono);color:var(--mut)}
.slist .ord{font:10px var(--mono);color:var(--dim);width:14px}
.slist .mv{display:flex;flex-direction:column;margin-left:auto}
.slist .mv button{border:0;background:none;color:var(--dim);cursor:pointer;font-size:10px;line-height:1;padding:1px 3px}
.slist .mv button:hover{color:var(--tx)}
.etab input[type=text],.etab input[type=number],.etab select{width:100%;min-width:56px}
.etab td.pl{color:var(--mut);font-size:12px;min-width:180px}
.etab td.x{width:28px;text-align:center}
.xb{border:0;background:none;color:var(--dim);cursor:pointer;font-size:15px;line-height:1}
.xb:hover{color:var(--red)}
.diff{font:11.5px/1.5 var(--mono);background:var(--inset);border:1px solid var(--line);border-radius:3px;max-height:320px;overflow:auto;white-space:pre}
.diff div{padding:0 8px}
.diff .a{background:var(--grnbg);color:var(--grn)}.diff .d{background:var(--redbg);color:var(--red)}.diff .gap{color:var(--dim);background:var(--panel2)}
.dirty{position:fixed;left:212px;right:130px;bottom:12px;z-index:30;display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border:1px solid var(--amb);border-radius:5px;box-shadow:var(--shadow)}
.dirty.show{display:flex}
.dirty .msg{flex:1;min-width:160px}
textarea.raw{width:100%;min-height:380px;resize:vertical;line-height:1.5;white-space:pre;tab-size:2}
/* schedule */
.day{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.win{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line2);border-radius:4px;padding:2px 4px 2px 6px;margin:2px 6px 2px 0;background:var(--inset)}
.win input{border:0;background:transparent;padding:1px}
.tl{position:relative;height:10px;background:var(--inset);border:1px solid var(--line);border-radius:2px;margin-top:4px}
.tl i{position:absolute;top:0;bottom:0;background:var(--grn);opacity:.75}
/* charts */
svg{display:block;max-width:100%}
.ax{font:10px var(--mono);fill:var(--dim)}
.gl{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:11px var(--mono);color:var(--mut);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}
.readout{font:11.5px var(--mono);color:var(--mut);min-height:18px;margin-bottom:4px}
.prog{height:10px;background:var(--inset);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--amb);transition:width .2s}
.loglist{font:12px/1.55 var(--mono)}
.loglist div{display:grid;grid-template-columns:150px 64px minmax(0,1fr);gap:10px;padding:3px 0;border-bottom:1px solid var(--line)}
.loglist div:last-child{border-bottom:0}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(5,8,12,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:10vh 12px 12px}
.ov.show{display:flex}
.pal{width:min(560px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 14px;font:14px var(--sans);background:transparent;outline:none}
.pal ul{list-style:none;margin:0;padding:4px;max-height:52vh;overflow:auto}
.pal li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:4px;cursor:pointer}
.pal li.on{background:var(--ambbg)}
.pal li .ty{font:10px var(--mono);color:var(--dim);width:52px;text-transform:uppercase;letter-spacing:.08em}
.pal li .k{margin-left:auto}
.pal .ft{padding:6px 12px;border-top:1px solid var(--line);font:11px var(--mono);color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
.help{width:min(520px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:6px;box-shadow:var(--shadow);padding:14px 16px}
.help table{width:100%;font-size:12.5px;border-collapse:collapse}
.help td{padding:3px 0}.help td:first-child{width:130px}
#toasts{position:fixed;top:48px;right:14px;z-index:60;display:flex;flex-direction:column;gap:6px;max-width:min(380px,calc(100vw - 28px))}
.toast{background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--grn);border-radius:4px;padding:8px 12px;box-shadow:var(--shadow);font-size:12.5px;animation:tin .18s ease-out}
.toast.a{border-left-color:var(--amb)}.toast.r{border-left-color:var(--red)}.toast.c{border-left-color:var(--cy)}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}
.demo{position:fixed;right:12px;bottom:12px;z-index:40;font:11px var(--mono)}
.demo>button{border:1px dashed var(--line2);background:var(--panel);color:var(--mut);border-radius:4px;padding:4px 8px;cursor:pointer;opacity:.85}
.demo .dl{display:none;position:absolute;right:0;bottom:30px;background:var(--panel);border:1px solid var(--line2);border-radius:5px;box-shadow:var(--shadow);padding:4px;width:260px}
.demo.open .dl{display:block}
.demo .dl button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:3px;cursor:pointer;color:var(--tx);font:12px var(--sans)}
.demo .dl button.on{background:var(--ambbg);color:var(--amb)}
.demo .dl button:hover{background:var(--panel2)}
.scrim{display:none}
@media (max-width:1100px){.s3{grid-column:span 6}.s4,.s5,.s7,.s8{grid-column:span 12}.s6{grid-column:span 12}}
@media (max-width:860px){
  #navBtn{display:inline-block}
  .top .brand{display:none}
  .body{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;left:0;bottom:0;width:230px;z-index:45;transform:translateX(-102%);transition:transform .18s;overflow:auto;box-shadow:var(--shadow)}
  body.nav .side{transform:none}
  body.nav .scrim{display:block;position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.4)}
  .split{grid-template-columns:minmax(0,1fr)}
  .dirty{left:12px;right:12px;bottom:52px}
  .fld{grid-template-columns:minmax(0,1fr)}
  .fld>label{padding-top:0}
  .s3{grid-column:span 12}
  .kbtn kbd{display:none}
}
@media (max-width:560px){
  main{padding:10px 10px 120px}
  .strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .cell{padding:4px 8px;border-bottom:1px solid var(--line)}
  .cell .v{font-size:13.5px}
  .cell.hide-s{display:none}
  .cell.grow{grid-column:1/-1}
  .dots{gap:8px;flex-wrap:wrap}
  .loglist div{grid-template-columns:minmax(0,1fr) auto}
  .loglist div span:nth-child(3){grid-column:1/-1}
  .big{font-size:24px}
  .hero .state{font-size:21px}
  .top .back{font-size:10px}
  .day{grid-template-columns:40px minmax(0,1fr)}
  .day>.row{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="ib" id="navBtn" data-act="nav" aria-label="Menu">≡</button>
  <a class="back" href="index.html">← all options</a>
  <span class="brand">CHARGER<b>/</b>CONSOLE</span>
  <span class="sp"></span>
  <button class="kbtn" data-act="pal"><span>Jump or run…</span><kbd id="kmod">⌘K</kbd></button>
  <button class="ib" data-act="help" title="Keyboard shortcuts (?)">?</button>
  <button class="ib" data-act="theme" title="Toggle light/dark">◐</button>
</header>
<div class="strip" id="strip"></div>
<div id="banner"></div>
<div class="body">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<div class="scrim" data-act="nav"></div>
<div class="dirty" id="dirty"></div>
<div class="ov" id="palOv"><div class="pal"><input id="palIn" placeholder="Go to page or run an action…" autocomplete="off" spellcheck="false"><ul id="palList"></ul><div class="ft"><span>↑↓ select</span><span>↵ run</span><span>esc close</span></div></div></div>
<div class="ov" id="helpOv"><div class="help"><div class="row" style="margin-bottom:8px"><b>Keyboard shortcuts</b><span class="sp"></span><button class="btn sm" data-act="closeov">Close</button></div><table id="helpT"></table></div></div>

const f1=v=>(v==null||isNaN(v))?'—':r1(v).toFixed(1);
const ct=v=>(v==null||isNaN(v))?'—':f1(v)+'¢';
const pad=n=>String(n).padStart(2,'0');

const dur=s=>{s=Math.floor(s);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d}d ${h}h ${pad(m)}m`:h?`${h}h ${pad(m)}m`:`${m}m ${pad(s%60)}s`};

/* logic JSON <-> editor model */
function fromJSON(j){
 if(!j||typeof j!=='object'||!j.states||typeof j.states!=='object'||Array.isArray(j.states))throw Error('Expected an object with a "states" object');
 const L={select:typeof j.state_select==='string'?j.state_select:'',states:[]};
 for(const [name,s] of Object.entries(j.states)){
  if(!s||typeof s!=='object')throw Error(`State "${name}" must be an object`);
  const ec=s.entry_conditions||[],cl=s.charging_logic||[];
  if(!Array.isArray(ec)||!Array.isArray(cl))throw Error(`State "${name}": entry_conditions and charging_logic must be arrays`);
  L.states.push({name,cond:ec.map((c,i)=>{if(c.type&&c.type!=='soc')throw Error(`${name} condition ${i+1}: only type "soc" is supported`);if(!['>','>=','<','<='].includes(c.operator))throw Error(`${name} condition ${i+1}: bad operator "${c.operator}"`);if(typeof c.value!=='number')throw Error(`${name} condition ${i+1}: value must be a number`);return{op:c.operator,value:c.value}}),
   blocks:cl.map((b,i)=>{const ok=v=>v==='min'||typeof v==='number';if(typeof b.soc!=='number'||!ok(b.price_on)||!ok(b.price_off))throw Error(`${name} block ${i+1}: soc must be a number; price_on/price_off a number or "min"`);return{soc:b.soc,on:String(b.price_on),off:String(b.price_off),km:b.known_minutes==null?'':String(b.known_minutes)}})});
 }
 return L;
}
const pv=v=>v==='min'?'min':Number(v);
function toJSON(L){
 const o={};if(L.select)o.state_select=L.select;o.states={};
 for(const s of L.states){o.states[s.name]={entry_conditions:s.cond.map(c=>({type:'soc',value:Number(c.value),operator:c.op})),charging_logic:s.blocks.map(b=>{const x={soc:Number(b.soc),price_on:pv(b.on),price_off:pv(b.off)};if(b.km!==''&&b.km!=null)x.known_minutes=Number(b.km);return x})}}
 return o;
}
const jtxt=L=>JSON.stringify(toJSON(L),null,2);

/* ---------- time / prices ---------- */
function now(){return new Date(S.base.getTime()+(Date.now()-S.t0))}
function nowH(){const d=now();return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600}
function lowest7(){const h=now().getHours();let c=[];if(h<17)c=DA_T.slice(0,7);else c=DA_T.slice(h+1).concat(DA_N.slice(0,7));c=c.filter(v=>!isNaN(v));return c.length?r1(Math.min(...c)):null}
function minPrice(){const l=lowest7();return l==null?null:r1(l+Number(S.cfg.min_offset))}
function priceKnown(){return S.st.clock&&S.st.price!=null}

/* ---------- decision engine (mirrors PLAN §7) ---------- */
const OPS={'>':(a,b)=>a>b,'>=':(a,b)=>a>=b,'<':(a,b)=>a<b,'<=':(a,b)=>a<=b};
function engine(L,soc,sticky){
 L=L||S.logic;soc=soc==null?(S.st.soc==null?0:S.st.soc):soc;sticky=sticky||S.st.sticky;
 let name=sticky,forced=false,entered=false;
 if(L.select&&L.states.some(s=>s.name===L.select)){name=L.select;forced=true}
 else for(const s of L.states){if(s.cond.length&&s.cond.every(c=>OPS[c.op](soc,Number(c.value)))){name=s.name;entered=true;break}}
 let st=L.states.find(s=>s.name===name);let blocks=st&&st.blocks.length?st.blocks:((L.states.find(s=>s.name==='default')||{}).blocks||[]);
 let bi=blocks.findIndex(b=>soc>=Number(b.soc));if(bi<0)bi=blocks.length-1;
 const b=blocks[bi];const mp=minPrice();
 const res=v=>v==='min'?mp:Number(v);
 return{name,forced,entered,stIdx:L.states.indexOf(st),bi,b,on:b?res(b.on):null,off:b?res(b.off):null,km:b&&b.km!==''?Number(b.km):0,soc};
}
function inWindow(d){
 const day=d.getDay(),m=d.getHours()*60+d.getMinutes(),toM=t=>{const[a,b]=t.split(':');return a*60+ +b};
 for(const w of S.cfg.sched[day]||[]){const s=toM(w.s),e=toM(w.e);if(s<e?(m>=s&&m<e):(m>=s))return{day,w}}
 const pd=(day+6)%7;for(const w of S.cfg.sched[pd]||[]){const s=toM(w.s),e=toM(w.e);if(s>e&&m<e)return{day:pd,w}}
 return null;
}
function untilTxt(){return S.ov.until?' until '+hm(new Date(S.ov.until)):''}
function decide(manualMsg){
 const s=S.st,c=S.cfg,m=S.ov.mode,prev=s.relay;let relay=prev,why='',kind='',e=null;
 if(S.ov.until&&s.clock&&now().getTime()>=S.ov.until){S.ov={mode:'auto',until:null};addLog('sys','Override expired → Auto (price)')}
 const dflt=r=>{relay=c.default_relay;kind='def';why=`Default ${c.default_relay?'ON':'OFF'}: ${r}`};
 if(S.ov.mode==='manual_on'){relay=true;kind='man';why='Manual ON'+untilTxt()}
 else if(S.ov.mode==='manual_off'){relay=false;kind='man';why='Manual OFF'+untilTxt()}
 else if(!s.clock)dflt('clock not set yet (waiting for NTP) — schedule and price logic need time');
 else{
  const soc=s.soc==null?null:Math.round(s.soc);
  if(soc!=null&&soc>=100){relay=false;kind='ovl';why='OFF: Bolt is full'}
  else if(soc!=null&&c.soc_target&&soc>=c.soc_target){relay=false;kind='ovl';why=`OFF: SOC target ${c.soc_target}% reached`}
  else{
   const w=(m==='schedule'||m==='sched_price')?inWindow(now()):null;
   if(w){relay=true;kind='sched';why=`Schedule window ${DAYS[w.day]} ${w.w.s}–${w.w.e}`}
   else if(m==='schedule'&&S.cfg.sched_out==='off'){relay=false;kind='sched';why='Outside schedule windows (schedule only)'}
   else if(!priceKnown())dflt(`no price data (5-min feed stale > ${c.stale_min} min, no day-ahead for this hour)`);
   else{
    e=engine();kind='price';const p=s.price,mm=now().getMinutes(),enough=!e.km||mm>=e.km;
    if(!e.b){dflt('no charging blocks in state '+e.name)}
    else if(prev&&p>e.off){relay=false;why=`Price is high (${f1(p)}¢ > ${f1(e.off)}¢)`}
    else if(prev&&!enough){relay=false;why=`Not enough confidence yet (:${pad(mm)} < :${pad(e.km)})`}
    else if(!prev&&p<=e.on&&enough){relay=true;why=`Price is low (${f1(p)}¢ ≤ ${f1(e.on)}¢)`}
    else if(prev){why=`Holding ON — price ${f1(p)}¢ hasn't risen above stop ${f1(e.off)}¢`}
    else if(p<=e.on){why=`Price ${f1(p)}¢ is low, waiting for :${pad(e.km)} confidence (now :${pad(mm)})`}
    else{why=`Waiting — start at ≤ ${f1(e.on)}¢, now ${f1(p)}¢`}
   }
  }
 }
 s.relay=relay;s.why=why;s.kind=kind;
 if(!e&&s.clock&&priceKnown())e=engine();
 if(e){s.sticky=e.name}
 if(relay!==prev){
  const msg=kind==='man'?`Manual: ${relay?'ON':'OFF'}${untilTxt()}`:(manualMsg?'Manual: ':'')+(relay?'ON: ':'OFF: ')+why.replace(/^OFF: /,'');
  addLog('relay',`Relay ${relay?'ON':'OFF'} — ${why}`);
  if(c.po.en&&c.po.token&&c.po.user){addLog('push','Pushover sent: '+msg);toast('Push → '+msg,'c')}
 }
}
function nextCharge(){
 const s=S.st;
 if(S.ov.mode==='manual_on')return S.ov.until?`Manual ON ends ${hm(new Date(S.ov.until))}, then price logic resumes`:'Manual ON indefinitely';
 if(S.ov.mode==='manual_off')return S.ov.until?`Manual OFF ends ${hm(new Date(S.ov.until))}`:'Not until you leave Manual OFF';
 if(!s.clock||!priceKnown())return'Unknown until clock and prices are available';
 if(s.relay){const e=engine();return s.kind==='price'?`Charging now — stops if price > ${f1(e.off)}¢`:'Charging now'}
 const e=engine();if(!e.b)return'—';
 const h=now().getHours(),cands=[];for(let i=h+1;i<24;i++)cands.push([i,DA_T[i],'today']);for(let i=0;i<7;i++)cands.push([i,DA_N[i],'tomorrow']);
 const hit=cands.find(x=>x[1]<=e.on);
 if(hit)return`Likely ~${pad(hit[0])}:${pad(e.km||0)} ${hit[2]} (forecast ${f1(hit[1])}¢ ≤ ${f1(e.on)}¢)`;
 const lo=lowest7();return`Not expected before 07:00 — lowest forecast ${f1(lo)}¢ vs start ≤ ${f1(e.on)}¢`;
}

/* ---------- event log ---------- */
function addLog(type,msg){const s=S.st;S.log.unshift({t:s.clock?now().getTime():null,up:s.up+(Date.now()-S.t0)/1000,type,msg})}
function seedLog(sc){
 const b=S.base.getTime(),H=3600e3,L=[];const add=(dh,type,msg)=>L.push({t:b-dh*H,up:sc.up-dh*3600,type,msg});
 if(!sc.clock){
  const u=sc.up;[[0,'sys','Wi-Fi connected Syrota-Guest, IP 192.168.7.42, RSSI -63'],[0,'sys','NTP sync pending (pool.ntp.org, time.google.com)'],[0,'relay','Relay → default OFF (no clock, no prices)'],[0,'err','Boot after reset: TASK_WDT — running from rollback (1.3.1)'],[0,'sys','Boot 1.3.1, heap 142 KB free']].forEach((x,i)=>L.push({t:null,up:Math.max(1,u-6-i*8),type:x[1],msg:x[2]}));
  L.push({t:null,up:null,type:'sys',msg:'— previous boot —'});
 }
 const rel=[];
 if(sc.sc===1){rel.push([0.62,'relay','Relay ON — Price is low (1.3¢ ≤ 3¢) Bolt/Поездка (forced)'],[0.61,'push','Pushover sent: ON: Price is low (1.3¢ ≤ 3¢) — Bolt/Поездка soc≥0. Charging started: 6.7 kW, 47%.'],[2.1,'sys','state_select → Поездка (forced from UI)'])}
 if(sc.sc===2){rel.push([0.3,'car','Poll: car asleep (228334 → ERROR)'],[4.2,'err','5-min feed fetch failed: timeout; retry ok at +60 s'])}
 if(sc.sc===3){rel.push([1.04,'relay','Relay ON — Price is low (1.8¢ ≤ 2¢) Bolt/Заряд'],[1.03,'push','Pushover sent: ON: Price is low (1.8¢ ≤ 2¢) — Bolt/Заряд soc≥0. Car not detected.'],[1.0,'car','Poll: BLE connect timeout (car not detected)'])}
 if(sc.sc===5){rel.push([0.58,'relay','Relay ON — Manual ON until 06:00'],[0.579,'push','Pushover sent: Manual: ON until 06:00. Charging started: 6.6 kW, 65%.'],[0.4,'err','5-min feed stale — using day-ahead estimate'])}
 const base=[[13.5,'car','Poll: online, SOC 66%, 13.1 V aux'],[17.4,'relay','Relay OFF — Price is high (3.4¢ > 3¢), Bolt/Заряд (66%, 2m ago)'],[17.39,'push','Pushover sent: OFF: Price is high (3.4¢ > 3¢), Bolt/Заряд (66%, 2m ago).'],[20.9,'relay','Relay ON — Price is low (1.8¢ ≤ 2¢)'],[20.89,'push','Pushover sent: ON: Price is low (1.8¢ ≤ 2¢) — Bolt/Заряд soc≥0. Charging started: 6.8 kW, 31%.'],[22,'sys','Daily stats flushed (hourly.bin 24 rec)'],[26,'sys','OTA check: 1.3.2 is current']];
 if(sc.clock)rel.concat(base).forEach(x=>add(...x));else base.forEach(x=>L.push({t:b-x[0]*H-86400e3,up:null,type:x[1],msg:x[2]}));
 return L;
}

  wifi:{ssid:'Syrota-Guest',rssi:n===3?-79:-63,ip:'192.168.7.42',mode:'STA'},heap:{free:n===4?142300:118400,min:n===4?139800:n===3?52300:84200,largest:n===4?98304:61440},
  v:sc.car==='charging'?357.2:null,a:sc.car==='charging'?-(sc.kw*1000/357.2):null};
 S.fw.ver=sc.rb?'1.3.1':'1.3.2';S.fw.avail=null;S.fw.prog=null;
 S.ov={mode:sc.mode,until:sc.until?new Date(2026,10,8,sc.until[0],sc.until[1]).getTime():null};

 decide();render();
}

}

 const s=S.st,h=health(),d=now(),soc=s.soc,car=CAR[s.car];
 const relay=s.kind==='def'?`<span class="pill def"><i class="led a"></i>${s.relay?'ON':'OFF'} · DEFAULT</span>`:s.relay?`<span class="pill on"><i class="led g"></i>RELAY ON</span>`:`<span class="pill off"><i class="led"></i>RELAY OFF</span>`;
 $('#strip').innerHTML=`
 <div class="cell"><span class="lbl">Relay</span><div class="v">${relay}</div></div>
 <div class="cell"><span class="lbl">Mode</span><div class="v" style="font-size:12.5px">${MODE[S.ov.mode]}${S.ov.until?`<small> →${hm(new Date(S.ov.until))}</small>`:''}</div></div>
 <div class="cell"><span class="lbl">Price now</span><div class="v ${s.est?'c-a':''}">${priceKnown()?ct(s.price):'—'}${s.est?'<small> est</small>':''}</div></div>
 <div class="cell hide-s"><span class="lbl">Min by 7a</span><div class="v">${priceKnown()?ct(minPrice()):'—'}<small> ${priceKnown()?f1(lowest7())+'+'+f1(S.cfg.min_offset):''}</small></div></div>
 <div class="cell"><span class="lbl">SOC</span><div class="v">${soc==null?'—':soc+'%'}<small> ${s.car==='charging'||s.car==='online'?'live':h.seen==null?'unknown':ago(h.seen)}</small></div></div>
 <div class="cell"><span class="lbl">Car</span><div class="v ${car[1]}" style="font-size:12.5px">${car[0]}${s.kw?`<small> ${f1(s.kw)} kW</small>`:''}</div></div>

/* ----- logic editor ----- */
function isDirty(){return S.draft&&jtxt(S.draft)!==jtxt(S.logic)}
function intervalOf(st){let lo=0,li=true,hi=100,hiI=true;for(const c of st.cond){const v=Number(c.value);if(c.op[0]==='>'){const inc=c.op==='>=';if(v>lo||(v===lo&&!inc)){lo=v;li=inc}}else{const inc=c.op==='<=';if(v<hi||(v===hi&&!inc)){hi=v;hiI=inc}}}return{lo,li,hi,hiI}}
const emptyI=i=>i.lo>i.hi||(i.lo===i.hi&&!(i.li&&i.hiI));
const iTxt=i=>i.lo===i.hi?`${i.lo}%`:`${i.li?'[':'('}${i.lo}, ${i.hi}${i.hiI?']':')'}`;
function validate(L){
 const errs=[],warns=[],names=new Set();
 L.states.forEach((s,si)=>{
  if(!s.name.trim())errs.push(`State ${si+1}: name is empty`);else if(names.has(s.name))errs.push(`Duplicate state name "${s.name}"`);names.add(s.name);
  s.cond.forEach((c,i)=>{if(c.value===''||isNaN(c.value)||c.value<0||c.value>100)errs.push(`${s.name} condition ${i+1}: SOC must be 0–100`)});
  if(!s.blocks.length&&!L.states.some(x=>x.name==='default'))warns.push(`${s.name}: no charging blocks — relay falls to default`);
  s.blocks.forEach((b,i)=>{const pfx=`${s.name} block ${i+1}`;
   if(b.soc===''||isNaN(b.soc)||b.soc<0||b.soc>100)errs.push(`${pfx}: SOC must be 0–100`);
   for(const k of['on','off'])if(!(b[k]==='min'||/^-?\d+(\.\d+)?$/.test(String(b[k]).trim())))errs.push(`${pfx}: ${k==='on'?'start':'stop'} price must be a number or "min"`);
   if(b.km!==''&&(isNaN(b.km)||b.km<0||b.km>59||!Number.isInteger(+b.km)))errs.push(`${pfx}: known minutes must be 0–59`);
   if(b.on!=='min'&&b.off!=='min'&&+b.off<+b.on)warns.push(`${pfx}: stop (${b.off}¢) is below start (${b.on}¢) — relay would flap`);
  });
  if(s.blocks.length&&Math.min(...s.blocks.map(b=>+b.soc))>0)warns.push(`${s.name}: no block at 0% — below ${Math.min(...s.blocks.map(b=>+b.soc))}% the last block is used`);
  if(s.cond.length&&emptyI(intervalOf(s)))warns.push(`${s.name}: entry conditions can never all be true`);
 });
 const cs=L.states.filter(s=>s.cond.length);
 for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){const a=intervalOf(cs[i]),b=intervalOf(cs[j]);
  const lo=a.lo>b.lo?a.lo:b.lo,li=a.lo>b.lo?a.li:b.lo>a.lo?b.li:a.li&&b.li,hi=a.hi<b.hi?a.hi:b.hi,hiI=a.hi<b.hi?a.hiI:b.hi<a.hi?b.hiI:a.hiI&&b.hiI;
  const x={lo,li,hi,hiI};if(!emptyI(x)&&!emptyI(a)&&!emptyI(b))warns.push(`Entry ranges overlap: "${cs[i].name}" and "${cs[j].name}" both match SOC ${iTxt(x)} — first in order wins`)}
 if(L.select&&!L.states.some(s=>s.name===L.select))errs.push(`Forced state "${L.select}" doesn't exist`);
 return{errs,warns};
}
function lineDiff(a,b){
 a=a.split('\n');b=b.split('\n');const n=a.length,m=b.length,T=Array.from({length:n+1},()=>new Uint16Array(m+1));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)T[i][j]=a[i]===b[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
 const out=[];let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){out.push([' ',a[i]]);i++;j++}else if(T[i+1][j]>=T[i][j+1])out.push(['-',a[i++]]);else out.push(['+',b[j++]])}
 while(i<n)out.push(['-',a[i++]]);while(j<m)out.push(['+',b[j++]]);return out;
}
function diffHTML(){
 const d=lineDiff(jtxt(S.logic),jtxt(S.draft)),keep=new Set();
 d.forEach((x,i)=>{if(x[0]!==' ')for(let k=i-2;k<=i+2;k++)keep.add(k)});
 if(!keep.size)return{html:'<div class="gap">No changes — draft matches device.</div>',n:0};
 let html='',last=-1,n=0;d.forEach((x,i)=>{if(!keep.has(i))return;if(last>=0&&i>last+1)html+='<div class="gap">⋯</div>';last=i;if(x[0]!==' ')n++;html+=`<div class="${x[0]==='+'?'a':x[0]==='-'?'d':''}">${x[0]} ${esc(x[1])}</div>`});
 return{html,n};
}

function saveLogic(){
 const v=validate(S.draft);if(v.errs.length){toast('Fix errors before saving','r');return}
 if(v.warns.length&&!S.ackWarn){S.ackWarn=true;renderDirty();toast(v.warns[0],'a');return}
 const selName=S.draft.states[S.sel]&&S.draft.states[S.sel].name;
 S.draft.states.forEach(s=>s.blocks.sort((a,b)=>+b.soc-+a.soc));
 S.logic=clone(S.draft);S.ackWarn=false;S.sel=Math.max(0,S.logic.states.findIndex(s=>s.name===selName));

function five(){ // 5-min points up to now: [hour, price]
 const sc=SC[S.sc],r=rng(7+S.sc),nh=sc.t[0]+sc.t[1]/60,pts=[];
 for(let t=0;t<=nh;t+=1/12){const h=Math.floor(t);pts.push([t,r1(DA_T[h]+(r()-.5)*1.4+Math.sin(t*3)*.3)])}
 const last=pts.slice(-6);if(S.st.price!=null&&!S.st.est)last.forEach((p,i)=>p[1]=r1(S.st.price+(i-2.5)*.08));
 if(S.st.est)pts.splice(Math.max(0,pts.length-6));
 return pts;
}
function actual(){const nh=SC[S.sc].t[0],r=rng(31+S.sc);return DA_T.map((v,h)=>h<nh?r1(v+(r()-.5)*1.1):null)}
function powerAt(h){const sc=SC[S.sc];if(sc.noPow&&h>=sc.noPow[0]&&h<=sc.noPow[1])return null;return sc.on.some(([a,b])=>h>=a&&h<=b)?6.7+Math.sin(h*9)*.12:0}
function socAt(h){const p=SC[S.sc].socPts;if(!p.length||h<p[0][0]||h>p[p.length-1][0])return null;for(let i=1;i<p.length;i++)if(h<=p[i][0]){const[a,x]=p[i-1],[b,y]=p[i];return x+(y-x)*(h-a)/((b-a)||1)}return null}
function priceChart(H,id,e){
 const W=720,pl=30,pr=10,pt=8,pb=20,nh=nowH(),F=five(),A=actual();
 const vals=DA_T.concat(F.map(p=>p[1]),A.filter(v=>v!=null));if(e){vals.push(e.on,e.off)}
 const lo=Math.floor(Math.min(0,...vals)),hi=Math.ceil(Math.max(...vals)+.3);
 const x=h=>pl+(W-pl-pr)*h/24,y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
 let g='';const step=hi-lo>8?2:1;
 for(let v=lo;v<=hi;v+=step)g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
 for(let h=0;h<=24;h+=3)g+=`<text class="ax" x="${x(h)}" y="${H-5}" text-anchor="middle">${pad(h%24)}</text>`;
 const shade=SC[S.sc].on.map(([a,b])=>`<rect x="${x(a)}" y="${pt}" width="${Math.max(1,x(b)-x(a))}" height="${H-pt-pb}" fill="var(--shade)"/>`).join('');
 const da='M'+DA_T.map((v,h)=>`${x(h)},${y(v)}H${x(h+1)}`).join('L');
 const ac=A.map((v,h)=>v==null?'':`<line x1="${x(h)+2}" x2="${x(h+1)-2}" y1="${y(v)}" y2="${y(v)}" stroke="var(--vi)" stroke-width="2.5"/>`).join('');
 const fv=F.length?`<polyline fill="none" stroke="var(--amb)" stroke-width="1.4" points="${F.map(p=>x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ')}"/>`:'';
 const th=e?`<line x1="${pl}" x2="${W-pr}" y1="${y(e.on)}" y2="${y(e.on)}" stroke="var(--grn)" stroke-dasharray="4 3"/><text class="ax" x="${W-pr-2}" y="${y(e.on)-3}" text-anchor="end" style="fill:var(--grn)">start ≤ ${f1(e.on)}</text><line x1="${pl}" x2="${W-pr}" y1="${y(e.off)}" y2="${y(e.off)}" stroke="var(--red)" stroke-dasharray="2 3"/><text class="ax" x="${W-pr-2}" y="${y(e.off)+(e.off===e.on?11:-3)}" text-anchor="end" style="fill:var(--red)">stop &gt; ${f1(e.off)}</text>`:'';
 const nl=`<line x1="${x(nh)}" x2="${x(nh)}" y1="${pt}" y2="${H-pb}" stroke="var(--cy)"/><text class="ax" x="${x(nh)+3}" y="${pt+9}" style="fill:var(--cy)">now</text>`;
 return`<div class="legend"><span><i style="background:var(--dim)"></i>day-ahead</span><span><i style="background:var(--vi)"></i>hourly actual</span><span><i style="background:var(--amb)"></i>5-min</span><span><i style="background:var(--shade);height:9px"></i>relay ON</span></div>
 <svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="height:${H}px" data-chart="${id}" data-pl="${pl}" data-pr="${pr}" data-w="${W}">${shade}${g}<path d="${da}" fill="none" stroke="var(--dim)" stroke-width="1.5"/>${ac}${fv}${th}${nl}<line class="hov" x1="-9" x2="-9" y1="${pt}" y2="${H-pb}" stroke="var(--mut)" stroke-dasharray="2 2"/></svg>`;
}
function powerChart(H){
 const W=720,pl=30,pr=30,pt=8,pb=20,nh=nowH(),x=h=>pl+(W-pl-pr)*h/24,yp=v=>pt+(H-pt-pb)*(1-v/8),ys=v=>pt+(H-pt-pb)*(1-v/100);
 let g='';for(let v=0;v<=8;v+=2)g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${yp(v)}" y2="${yp(v)}"/><text class="ax" x="${pl-4}" y="${yp(v)+3}" text-anchor="end">${v}</text><text class="ax" x="${W-pr+4}" y="${yp(v)+3}">${v*12.5}%</text>`;
 for(let h=0;h<=24;h+=3)g+=`<text class="ax" x="${x(h)}" y="${H-5}" text-anchor="middle">${pad(h%24)}</text>`;
 let pa='',open=false;for(let h=0;h<=nh;h+=1/12){const p=powerAt(h);if(p==null){if(open){pa+=`L${x(h)},${yp(0)}`;open=false}continue}pa+=(open?'L':`M${x(h)},${yp(0)}L`)+`${x(h).toFixed(1)},${yp(p).toFixed(1)}`;open=true}
 if(open)pa+=`L${x(Math.min(nh,24))},${yp(0)}Z`;
 const sp=[];for(let h=0;h<=nh;h+=1/12){const s=socAt(h);if(s!=null)sp.push(x(h).toFixed(1)+','+ys(s).toFixed(1))}
 const shade=SC[S.sc].on.map(([a,b])=>`<rect x="${x(a)}" y="${pt}" width="${Math.max(1,x(b)-x(a))}" height="${H-pt-pb}" fill="var(--shade)"/>`).join('');
 const nogap=SC[S.sc].noPow?`<rect x="${x(SC[S.sc].noPow[0])}" y="${pt}" width="${x(Math.min(nh,SC[S.sc].noPow[1]))-x(SC[S.sc].noPow[0])}" height="${H-pt-pb}" fill="url(#hatch)"/>`:'';
 return`<div class="legend"><span><i style="background:var(--cy)"></i>power kW (left)</span><span><i style="background:var(--grn)"></i>SOC % (right)</span><span><i style="background:var(--amb);height:9px;opacity:.5"></i>relay ON, car not detected</span></div>
 <svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="height:${H}px" data-chart="pow" data-pl="${pl}" data-pr="${pr}" data-w="${W}"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="var(--amb)" opacity=".3"/></pattern></defs>${shade}${nogap}${g}<path d="${pa}" fill="var(--cybg)" stroke="var(--cy)" stroke-width="1.3"/>${sp.length?`<polyline fill="none" stroke="var(--grn)" stroke-width="1.8" points="${sp.join(' ')}"/>`:''}<line x1="${x(nh)}" x2="${x(nh)}" y1="${pt}" y2="${H-pb}" stroke="var(--cy)"/><line class="hov" x1="-9" x2="-9" y1="${pt}" y2="${H-pb}" stroke="var(--mut)" stroke-dasharray="2 2"/></svg>`;
}
function daily(){const r=rng(99),out=[];for(let i=13;i>=0;i--){const d=new Date(S.base);d.setDate(d.getDate()-i);const k=i===0?(S.st.sk||0)+(SC[S.sc].on.length?18.4:0):r()<.2?0:r1(8+r()*22);const p=r1(.8+r()*1.6);out.push({d,k,c:r1(k*p)})}return out}

function pollCar(){
 if(S.polling)return;S.polling=true;render();toast('Polling car over BLE…','c');
 setTimeout(()=>{S.polling=false;const s=S.st;
  if(s.car==='not_detected'||s.car==='unknown'){s.car='not_detected';addLog('car','Poll: BLE connect timeout — car not detected');toast('Car not detected (BLE timeout 10 s)','a')}
  else if(s.car==='asleep'){addLog('car','Poll: car asleep (228334 → ERROR)');s.seenS=0;toast('Car asleep — SOC kept at '+s.soc+'%','a')}
  else{s.seenS=0;addLog('car',`Poll: ${s.car}, SOC ${s.soc}%, ${f1(s.kw||0)} kW`);toast(`Car ${s.car}: SOC ${s.soc}%, ${f1(s.kw||0)} kW`)}
  if(s.seenS===0){s.seenS=-(Date.now()-S.t0)/1000}
  render()},1200);
}

}

 const t=e.target,k=t.dataset.in;if(!k)return;const st=ST();
 if(k==='cval'){st.cond[+t.dataset.i].value=t.value===''?'':+t.value;S.ackWarn=false;const pl=t.closest('tr').querySelector('.pl'),c=st.cond[+t.dataset.i];pl.textContent=`SOC ${opTxt[c.op]} ${c.value}%${c.op.length===1?' (strict)':' (inclusive)'}`}
 else if(k==='bf'){const b=st.blocks[+t.dataset.i],K=t.dataset.k;b[K]=K==='on'||K==='off'?t.value.trim():(t.value===''?'':+t.value);
  const bad=K==='on'||K==='off'?!(b[K]==='min'||/^-?\d+(\.\d+)?$/.test(b[K])):K==='soc'?(b.soc===''||b.soc<0||b.soc>100):(b.km!==''&&(b.km<0||b.km>59));t.classList.toggle('bad',bad)}

});

 const on=SC[S.sc].on.some(([a,b])=>h>=a&&h<=b),fut=h>nowH();
 if(sv.dataset.chart==='pow'){const p=powerAt(h),s=socAt(h);ro.textContent=fut?`${hr(h)} · future`:`${hr(h)} · ${p==null?'car not detected':f1(p)+' kW'} · SOC ${s==null?'—':Math.round(s)+'%'} · relay ${on?'ON':'OFF'}`}
 else{const F=five(),f=F.reduce((b,p)=>Math.abs(p[0]-h)<Math.abs(b[0]-h)?p:b,F[0]||[0,null]),A=actual()[Math.floor(h)];ro.textContent=`${hr(h)} · day-ahead ${ct(DA_T[Math.floor(h)])}${A!=null?` · actual ${ct(A)}`:''}${!fut&&f[1]!=null?` · 5-min ${ct(f[1])}`:''} · relay ${fut?'—':on?'ON':'OFF'}`}
});

/* ---------- command palette ---------- */
let palItems=[],palSel=0;
function palAll(){
 const nav=[];NAV.forEach(([g,it])=>it.forEach(([id,t,k])=>nav.push({ty:'go',t:`${g} › ${t}`,k:'g '+k,run:()=>go(id)})));
 const acts=[
  {ty:'run',t:'Poll car now',k:'p',run:pollCar},
  {ty:'run',t:'Manual ON for 2 hours',run:()=>ACT.man2h()},
  {ty:'run',t:'Manual ON (indefinitely)',run:()=>setMode('manual_on')},
  {ty:'run',t:'Manual OFF (indefinitely)',run:()=>setMode('manual_off')},
  {ty:'run',t:'Back to Auto (price)',run:()=>setMode('auto')},
  {ty:'run',t:'Send test push',run:()=>ACT.ptest()},
  {ty:'run',t:'Check firmware update',run:()=>{go('firmware');setTimeout(()=>ACT.fcheck(),50)}},
  {ty:'run',t:'Save logic changes',k:isMac?'⌘S':'Ctrl S',run:()=>isDirty()?saveLogic():toast('No unsaved logic changes','a')},
  {ty:'run',t:'Export logic.json',run:()=>ACT.rexport()},
  {ty:'run',t:'Toggle light / dark',run:()=>ACT.theme()},
  {ty:'run',t:'Keyboard shortcuts',k:'?',run:()=>ACT.help()}];
 S.logic.states.forEach(s=>acts.push({ty:'state',t:`Force state: ${s.name}`,run:()=>{S.draft.select=s.name;saveLogicQuick()}}));
 acts.push({ty:'state',t:'Force state: Auto (entry conditions)',run:()=>{S.draft.select='';saveLogicQuick()}});
 for(let i=1;i<=5;i++)acts.push({ty:'demo',t:`Demo scenario ${i}: ${SC[i].name}`,run:()=>{loadScenario(i);renderDemo()}});
 return nav.concat(acts);
}
function saveLogicQuick(){if(isDirty()&&jtxt({...S.logic,select:S.draft.select})!==jtxt(S.draft)){toast('Forced state staged with your other edits — review and Save','a');go('logic');render();return}S.logic.select=S.draft.select;addLog('sys','state_select → '+(S.logic.select||'Auto'));decide();toast('Forced state: '+(S.logic.select||'Auto'));render()}
function score(q,t){q=q.toLowerCase();t=t.toLowerCase();if(!q)return 1;if(t.includes(q))return 100-t.indexOf(q);let i=0,s=0;for(const c of t){if(c===q[i]){i++;s++}if(i===q.length)return s}return 0}
function openPal(){$('#palOv').classList.add('show');$('#palIn').value='';palFilter();setTimeout(()=>$('#palIn').focus(),0)}
function palFilter(){const q=$('#palIn').value.trim();palItems=palAll().map(x=>({...x,s:score(q,x.t)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);palSel=0;palDraw()}
function palDraw(){$('#palList').innerHTML=palItems.map((x,i)=>`<li class="${i===palSel?'on':''}" data-act="palrun" data-i="${i}"><span class="ty">${x.ty}</span><span>${esc(x.t)}</span>${x.k?`<span class="k"><kbd>${x.k}</kbd></span>`:''}</li>`).join('')||'<li class="c-m">No matches</li>';const on=$('#palList li.on');if(on)on.scrollIntoView({block:'nearest'})}
function runPal(i){const x=palItems[i];closeOv();if(x)x.run()}
function closeOv(){document.querySelectorAll('.ov').forEach(o=>o.classList.remove('show'))}
$('#palIn').addEventListener('input',palFilter);
$('#palIn').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){palSel=Math.min(palItems.length-1,palSel+1);palDraw();e.preventDefault()}else if(e.key==='ArrowUp'){palSel=Math.max(0,palSel-1);palDraw();e.preventDefault()}else if(e.key==='Enter'){runPal(palSel);e.preventDefault()}});
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeOv()}));

/* ---------- keyboard ---------- */
const KEYS={};NAV.forEach(([g,it])=>it.forEach(([id,,k])=>KEYS[k]=id));
$('#helpT').innerHTML=[[`${isMac?'⌘':'Ctrl'} K`,'Command palette'],['?','This help'],['p','Poll car now'],[`${isMac?'⌘':'Ctrl'} S`,'Save logic changes'],['Esc','Close overlay / menu']].concat(NAV.flatMap(([g,it])=>it.map(([id,t,k])=>['g '+k,'Go to '+t]))).map(([k,t])=>`<tr><td>${k.split(' ').map(x=>`<kbd>${x}</kbd>`).join(' ')}</td><td>${t}</td></tr>`).join('');
let gPending=0;
document.addEventListener('keydown',e=>{
 const mod=e.metaKey||e.ctrlKey,typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
 if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();$('#palOv').classList.contains('show')?closeOv():openPal();return}
 if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();if(isDirty())saveLogic();return}
 if(e.key==='Escape'){closeOv();document.body.classList.remove('nav');$('#demo').classList.remove('open');if(typing)document.activeElement.blur();return}
 if(typing||mod||e.altKey)return;
 if(gPending&&Date.now()-gPending<1200&&KEYS[e.key]){gPending=0;go(KEYS[e.key]);return}
 gPending=0;
 if(e.key==='g'){gPending=Date.now();return}
 if(e.key==='?'){ACT.help();return}
 if(e.key==='p'){pollCar();return}
 if(S.route==='logic'&&(e.key==='ArrowUp'||e.key==='ArrowDown')&&document.activeElement.closest&&document.activeElement.closest('#slist')){e.preventDefault();S.sel=Math.max(0,Math.min(S.draft.states.length-1,S.sel+(e.key==='ArrowUp'?-1:1)));render();const li=document.querySelector(`#slist li[data-i="${S.sel}"]`);if(li)li.focus()}
});
window.addEventListener('beforeunload',e=>{if(isDirty()){e.preventDefault();e.returnValue=''}});

/* ---------- demo switcher ---------- */
function renderDemo(){$('#demoList').innerHTML='<div class="lbl" style="padding:4px 8px">Demo scenario</div>'+[1,2,3,4,5].map(i=>`<button class="${S.sc===i?'on':''}" data-act="scen" data-n="${i}">${i}. ${SC[i].name}</button>`).join('');$('#demoN').textContent=S.sc}

/* ---------- boot ---------- */
loadScenario(1);renderDemo();route();
setInterval(()=>{renderStrip();if(S.st.clock&&S.ov.until&&now().getTime()>=S.ov.until){decide();render()}},1000);
</script>
</body>
</html>
