<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Charger</title>
<style>
:root{
  --bg:#eef1f4;--bg2:#e3e8ee;--card:rgba(255,255,255,.72);--card-solid:#fff;--line:rgba(60,70,90,.12);
  --txt:#16191f;--sub:#5d6673;--mute:#8d96a3;--grn:#16c264;--grn2:#0fa957;--grn-soft:rgba(22,194,100,.14);
  --idle:#9aa3ae;--idle-soft:rgba(130,140,155,.16);--amb:#f0a020;--amb-soft:rgba(240,160,32,.16);
  --red:#ec4b4b;--red-soft:rgba(236,75,75,.14);--blu:#2f7cf6;--blu-soft:rgba(47,124,246,.13);
  --sheet:rgba(250,251,253,.94);--shadow:0 6px 24px rgba(30,40,60,.08);--tab:rgba(248,249,251,.82);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c0e12;--bg2:#141821;--card:rgba(32,36,45,.66);--card-solid:#1c2029;--line:rgba(200,210,230,.1);
  --txt:#eef1f6;--sub:#a2abb8;--mute:#6f7886;--grn:#2ee07d;--grn2:#22c86c;--grn-soft:rgba(46,224,125,.15);
  --idle:#7d8693;--idle-soft:rgba(150,160,175,.14);--amb-soft:rgba(240,160,32,.18);--red-soft:rgba(236,75,75,.18);
  --blu-soft:rgba(47,124,246,.2);--sheet:rgba(26,29,37,.95);--shadow:0 6px 24px rgba(0,0,0,.35);--tab:rgba(20,23,30,.85);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;overflow-x:hidden}
body{background:radial-gradient(120% 60% at 50% -10%,var(--bg2),var(--bg) 60%) fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:440px;margin:0 auto;padding:0 16px 110px;transition:max-width .35s ease}
.app.wide{max-width:1000px}
#conn{max-width:440px;margin:0 auto;padding:6px 16px 0}
#conn:empty{display:none}
.nav{display:flex;align-items:center;min-height:44px;gap:8px;position:sticky;top:0;z-index:5;margin:0 -16px;padding:4px 16px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.nav .back{display:flex;align-items:center;color:var(--blu);font-weight:500;margin-left:-6px}
.nav .ttl{flex:1;text-align:center;font-weight:600}
.nav .act{color:var(--blu);font-weight:600;min-width:52px;text-align:right}
.nav .act button{color:var(--blu);font-weight:600}
.big{font-size:32px;font-weight:750;letter-spacing:-.02em;margin:4px 0 12px}
.screen.fade{animation:fade .25s ease}
.screen.push{animation:pushin .32s cubic-bezier(.2,.8,.2,1)}
.screen.pop{animation:popin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes pushin{from{transform:translateX(40px);opacity:0}}
@keyframes popin{from{transform:translateX(-40px);opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--card);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:14px 16px}
.muted{color:var(--sub)}.small{font-size:13px}.tiny{font-size:11.5px}
.hero{text-align:center;padding-top:4px}
.hero h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.02em}
.hero .why{color:var(--sub);font-size:14px;margin:0 auto;max-width:330px}
.ringwrap{position:relative;width:250px;height:250px;margin:14px auto 6px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c .v{font-size:46px;font-weight:760;letter-spacing:-.03em;line-height:1}
.ring-c .v small{font-size:20px;font-weight:600;margin-left:2px}
.ring-c .l{font-size:13px;color:var(--sub);margin-top:6px}
.arc{transition:stroke-dasharray .8s ease,stroke .4s}
.charging .arc{filter:drop-shadow(0 0 8px rgba(22,194,100,.55));animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 16px rgba(22,194,100,.85))}}
.flow{animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}
.relaypill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;font-weight:600;font-size:14px;background:var(--idle-soft);color:var(--sub)}
.relaypill.on{background:var(--grn-soft);color:var(--grn2)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.on .dot{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 14px}
.pchip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13.5px;backdrop-filter:blur(12px)}
.pchip b{font-size:15px}
.modebtn{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:24px;text-align:left;color:#fff;background:linear-gradient(135deg,#2a313d,#434c5c);box-shadow:0 10px 26px rgba(30,40,60,.22);transition:transform .15s}
.modebtn.go{background:linear-gradient(135deg,#0fb85b,#3ad98a)}
.modebtn:active{transform:scale(.98)}
.modebtn .ic{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.modebtn .t{font-weight:700;font-size:17px}.modebtn .s{font-size:12.5px;opacity:.85}
.modebtn .chev{margin-left:auto;opacity:.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{padding:13px 14px;border-radius:20px;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:3px}
.tile .h{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tile .h svg{width:15px;height:15px}
.tile .m{font-size:19px;font-weight:700;letter-spacing:-.01em}
.tile .d{font-size:12.5px;color:var(--sub)}
.tile .mini{margin-top:auto;align-self:flex-start;font-size:12.5px;font-weight:600;color:var(--blu);padding:4px 10px;border-radius:99px;background:var(--blu-soft)}
.sysrow{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:10px;padding:11px 14px;font-size:12.5px;color:var(--sub);width:100%;flex-wrap:wrap}
.sysrow span{display:inline-flex;align-items:center;gap:4px}
.ok{color:var(--grn2)}.bad{color:var(--red)}.warn{color:var(--amb)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;margin:8px 0;font-size:13.5px;text-align:left}
.banner.amb{background:var(--amb-soft)}.banner.blu{background:var(--blu-soft)}.banner.red{background:var(--red-soft)}
.banner svg{margin-top:1px}
.group{margin:18px 0 0}
.group>.gh{font-size:12.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin:0 16px 6px}
.group>.gf{font-size:12.5px;color:var(--sub);margin:6px 16px 0}
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:48px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:56px;right:0;border-top:1px solid var(--line)}
.list.noic .row+.row::before{left:14px}
.row .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.row .ico svg{width:17px;height:17px}
.row .lab{flex:1;min-width:0}
.row .lab small{display:block;color:var(--sub);font-size:12.5px}
.row .val{color:var(--sub);font-size:14px;text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--mute);width:16px;height:16px}
button.row:active{background:var(--line)}
.row input[type=text],.row input[type=number],.row input[type=url],.row input[type=password],.row input[type=time],.row select{border:0;background:transparent;text-align:right;outline:none;min-width:0;width:140px;color:var(--sub)}
.row input:focus{color:var(--txt)}
.row input:disabled{opacity:.4}
.err{color:var(--red);font-size:12.5px;padding:0 14px 10px 14px;display:none}
.err.show{display:block}
.in-bad{color:var(--red)!important}
.tg{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--idle-soft);position:relative;cursor:pointer;transition:background .2s;flex:none;border:1px solid var(--line)}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .2s}
.tg:checked{background:var(--grn)}.tg:checked::after{transform:translateX(20px)}
.seg{display:flex;background:var(--idle-soft);border-radius:11px;padding:2px;gap:2px}
.seg button{flex:1;padding:6px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--card-solid);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:14px;font-weight:650;background:var(--blu);color:#fff}
.btn.g{background:var(--grn2)}.btn.s{background:var(--idle-soft);color:var(--txt)}.btn.r{background:var(--red-soft);color:var(--red)}
.btn.w{width:100%}.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:11px}
.btn.r.on{background:var(--red);color:#fff}
.spin{animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,460px);transform:translate(-50%,105%);transition:transform .34s cubic-bezier(.2,.85,.25,1);z-index:41;background:var(--sheet);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.show{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:9px;margin:2px auto 10px;background:var(--mute);opacity:.4}
.sheet h2{font-size:20px;margin:2px 0 4px}
.mcard{width:100%;display:flex;gap:14px;align-items:center;padding:15px 14px;border-radius:20px;background:var(--card);border:2px solid transparent;margin-top:10px;text-align:left;transition:transform .12s,border-color .2s}
.mcard:active{transform:scale(.985)}
.mcard.cur{border-color:var(--grn)}
.mcard:disabled{opacity:.45}
.mcard .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;flex:none}
.mcard .t{font-weight:700;font-size:16.5px}.mcard .s{font-size:13px;color:var(--sub)}
.durs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.dur{padding:18px 10px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:16px}
.dur small{display:block;font-weight:500;font-size:12px;color:var(--sub)}
.dur:disabled{opacity:.4}
.dur.wide{grid-column:span 2}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,440px);display:flex;justify-content:space-around;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:var(--tab);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);z-index:20}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);padding:4px 12px}
.tabbar button.on{color:var(--grn2)}
.tabbar svg{width:24px;height:24px}
@media(min-width:700px){.tabbar{bottom:14px;border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow)}}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);background:var(--card-solid);color:var(--txt);padding:11px 16px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:60;transition:transform .3s cubic-bezier(.2,.85,.25,1);display:flex;gap:8px;align-items:center;font-size:14px;max-width:92vw}
.toast.show{transform:translate(-50%,0)}
.pills{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 10px;margin:0 -16px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{scroll-snap-align:start;flex:0 0 auto;min-width:150px;max-width:220px;padding:11px 14px;border-radius:20px;text-align:left;background:var(--card);border:2px solid var(--line);position:relative}
.pill.sel{border-color:var(--txt)}
.pill .n{font-weight:700;font-size:16px}
.pill .c{font-size:12.5px;color:var(--sub)}
.pill .now{position:absolute;top:9px;right:10px;font-size:10.5px;font-weight:700;color:var(--grn2);background:var(--grn-soft);padding:2px 7px;border-radius:99px}
.pill.add{min-width:auto;display:flex;align-items:center;gap:6px;color:var(--blu);font-weight:600;border-style:dashed}
.batt{flex:none;width:100%;position:relative;padding-top:12px}
.batt .nub{position:absolute;top:0;left:50%;transform:translateX(-50%);width:70px;height:14px;border-radius:7px 7px 0 0;background:var(--mute);opacity:.5}
.cells{border:3px solid var(--mute);border-radius:26px;padding:6px;display:flex;flex-direction:column;gap:6px;min-height:420px;background:var(--card)}
.band{position:relative;border-radius:18px;padding:12px 14px 12px 70px;text-align:left;min-height:74px;display:flex;flex-direction:column;justify-content:center;transition:transform .12s,box-shadow .2s}
.band:active{transform:scale(.985)}
.band .from{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:800;font-size:17px;width:50px;text-align:center;line-height:1.1}
.band .from small{display:block;font-size:10.5px;font-weight:600;opacity:.7}
.band b{font-size:15px}
.band .ex{font-size:12.5px;opacity:.8}
.band.act{box-shadow:0 0 0 3px var(--grn),0 0 22px rgba(22,194,100,.4)}
.band .tag{position:absolute;right:10px;top:8px;font-size:10.5px;font-weight:700;background:var(--grn);color:#fff;padding:2px 7px;border-radius:99px}
.marker{position:absolute;left:-6px;right:-6px;height:0;border-top:2px dashed var(--txt);pointer-events:none}
.marker span{position:absolute;left:8px;top:-11px;background:var(--txt);color:var(--bg);font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px}
.addband{margin-top:8px;width:100%;padding:12px;border-radius:16px;border:2px dashed var(--line);color:var(--blu);font-weight:600}
.savebar{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);width:min(calc(100% - 32px),408px);display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-radius:20px;background:var(--card-solid);box-shadow:0 12px 30px rgba(0,0,0,.22);z-index:25;animation:fade .25s}
.savebar span{flex:1;font-weight:600;font-size:14px}
.fld{display:block;margin-top:12px}
.fld>span{display:block;font-size:12.5px;color:var(--sub);margin:0 0 5px 4px;font-weight:600}
.fld input,.fld select,.fld textarea,.ip{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card-solid);outline:none}
.fld input:focus,.ip:focus{border-color:var(--blu)}
.priceinp{display:flex;gap:8px}
.priceinp input{flex:1}
.minchip{padding:0 14px;border-radius:14px;border:1px solid var(--line);font-weight:650;background:var(--card-solid)}
.minchip.on{background:var(--blu);color:#fff;border-color:var(--blu)}
.preview{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--grn-soft);font-size:14px}
.cond{display:flex;gap:8px;align-items:center;margin-top:8px}
.cond select,.cond input{padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card-solid)}
.cond input{width:80px}
textarea.json{width:100%;min-height:340px;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card-solid);resize:vertical}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
@media(min-width:900px){.app.wide .hgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi{padding:10px 12px;border-radius:16px;background:var(--idle-soft)}
.kpi b{display:block;font-size:17px}.kpi span{font-size:11.5px;color:var(--sub)}
.week{display:grid;grid-template-columns:34px 1fr;gap:5px 8px;align-items:center;font-size:12px;color:var(--sub)}
.wbar{position:relative;height:14px;border-radius:7px;background:var(--idle-soft);overflow:hidden}
.wbar i{position:absolute;top:0;bottom:0;background:var(--grn);border-radius:7px}
.days{display:flex;gap:5px;flex-wrap:wrap}
.days button{width:36px;height:36px;border-radius:50%;background:var(--idle-soft);font-weight:650;font-size:13px;color:var(--sub)}
.days button.on{background:var(--grn);color:#fff}
.prog{height:10px;border-radius:9px;background:var(--idle-soft);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--grn2),var(--grn));transition:width .3s}
.logi{display:flex;gap:10px;padding:10px 14px;align-items:flex-start}
.logi+.logi{border-top:1px solid var(--line)}
.logi .t{font:12px ui-monospace,Menlo,monospace;color:var(--mute);width:68px;flex:none;padding-top:2px}
.logi .k{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.fchips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.fchips button{padding:6px 12px;border-radius:99px;background:var(--idle-soft);font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap}
.fchips button.on{background:var(--txt);color:var(--bg)}
.mt{margin-top:12px}.mt2{margin-top:20px}
.flex{display:flex;gap:8px;align-items:center}
.sp{flex:1}
code{font:12.5px ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div id="conn"></div>
<div class="app" id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="scrim" id="scrim" data-act="closeSheet"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- icons ---------- */
const P={home:'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',bolt:'M13 2L4 14h7l-1 8 9-12h-7z',
clock:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3 2',cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
power:'M12 3v9M6.3 7.5a8 8 0 1 0 11.4 0',off:'M4 4l16 16M12 3v5M6.3 7.5a8 8 0 0 0 11 11.6M18.5 15.5a8 8 0 0 0-.8-8',
wifi:'M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01',
car:'M5 17h14M3 13l2-6h14l2 6v5h-3v-2H6v2H3zM7 13.5h.01M17 13.5h.01',bell:'M6 9a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21h4',
relay:'M7 7h10a5 5 0 0 1 0 10H7A5 5 0 0 1 7 7zM16 10a2 2 0 1 0 0 4a2 2 0 1 0 0-4z',
chip:'M7 7h10v10H7zM10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4',pulse:'M3 12h4l3-8 4 16 3-8h4',

/* ---------- time (Chicago, from tz_offset_s; never the browser zone) ---------- */
const pad2=n=>String(n).padStart(2,'0');

const fmtD=e=>{const d=cd(e);return DAYN[d.getUTCDay()]+' '+(d.getUTCMonth()+1)+'/'+d.getUTCDate()};
const dayKey=e=>Math.floor((e+TZ())/86400);
const hourNow=()=>cd(now()).getUTCHours();
const hourFloat=e=>{const d=cd(e==null?now():e);return d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600};
const midnight=()=>{const n=now();return n-(((n+TZ())%86400)+86400)%86400};
const fmtUp=s=>{s=s||0;const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d}d ${h}h ${m}m`:h?`${h}h ${m}m`:`${m}m ${Math.floor(s%60)}s`};
const fmtUpTs=s=>'+'+pad2(Math.floor(s/3600))+':'+pad2(Math.floor(s%3600/60))+':'+pad2(Math.floor(s%60));

const fmtC=v=>!nn(v)?'—':(Math.round(v*10)/10).toString().replace('-','−')+'¢';
const fmtCost=c=>!nn(c)?'—':c<0?'−'+fmtCost(-c)+' credit':c<100?Math.round(c)+'¢':'$'+(c/100).toFixed(2);
const kb=b=>nn(b)?(b/1024).toFixed(1)+' KB':'—';
const minOff=()=>S.ui.minOffDraft??(S.cfg?S.cfg.min_offset:S.st.price.min_offset);
function minPrice(){const l=S.st.price.lowest7;const o=minOff();return nn(l)&&nn(o)?r1(l+o):(nn(S.st.price.min_price)?S.st.price.min_price:null)}
function fmtP(v,withRes){if(v==='min'){const m=minPrice();return withRes?`min (${fmtC(m)})`:'min'}return fmtC(v)}
const resolveP=v=>v==='min'?minPrice():v;
const tm=s=>{const [h,m]=String(s).split(':').map(Number);return h*60+m};
const daH=(arr,h)=>arr?arr[(h+1)%24]:null; /* day-ahead/actual arrays are hour-ending: slot starting at h = index h+1 */

/* ---------- API ---------- */
async function api(path,method,body){
 const c=new AbortController(),to=setTimeout(()=>c.abort(),9000);
 try{const r=await fetch(path,{method:method||'GET',signal:c.signal,cache:'no-store',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  let j=null;try{j=await r.json()}catch(_){}
  if(!r.ok){const e=new Error((j&&j.error)||('HTTP '+r.status));e.status=r.status;e.errors=(j&&j.errors)||[];throw e}
  return {s:r.status,j}}
 catch(e){if(!e.status){e.message=e.name==='AbortError'?'The device didn’t respond':'Can’t reach the device';e.errors=[]}throw e}
 finally{clearTimeout(to)}}
const errMsg=e=>e.message+(e.errors&&e.errors.length?': '+e.errors[0]:'');
function errSheet(title,e){openSheet(`<div class="grab"></div><h2>${esc(title)}</h2><div class="small">${esc(e.message)}</div>${e.errors&&e.errors.length?`<div class="banner red small mt">${I('warn','bad')}<div>${e.errors.map(esc).join('<br>')}</div></div>`:''}<div class="flex mt2"><span class="sp"></span><button class="btn s" data-act="closeSheet">OK</button></div>`)}
async function putCfg(body,msg){try{const {j}=await api('/api/config','PUT',body);S.cfg=j;toast(msg);render();poll();return true}catch(e){toast(esc(errMsg(e)),'warn');return false}}
async function loadCfg(){try{S.cfg=(await api('/api/config')).j;S.ui.sched=null;rerender()}catch(e){}}
async function loadLogic(){if(S.ui.dirty)return;try{S.lg=(await api('/api/logic')).j;if(!S.ui.dirty)S.ui.draft=null;rerender()}catch(e){}}
async function loadPrices(){try{S.pr=(await api('/api/prices')).j;S.prAt=Date.now();rerender()}catch(e){}}
async function loadLog(){try{S.log=(await api('/api/log?limit=300')).j;rerender()}catch(e){toast(esc(e.message),'warn')}}
async function loadHist(){loadPrices();
 if(clk())api('/api/stats/detail?from='+midnight()+'&to='+now()).then(r=>{S.det=r.j;rerender()}).catch(()=>{});
 api('/api/stats/daily?days=14').then(r=>{S.daily=r.j;rerender()}).catch(()=>{});
 api('/api/stats/monthly?months=6').then(r=>{S.monthly=r.j;rerender()}).catch(()=>{});
 api('/api/stats/sessions?limit=20').then(r=>{S.sess=r.j;rerender()}).catch(()=>{})}
const rerender=()=>renderLive(true);

/* ---------- status polling + job watching ---------- */
const W={};
function watch(job,fn){W[job]={t0:Date.now(),n0:now(),busy:false,fn};poll()}
function checkJobs(){const J=S.st.jobs||{};for(const k in W){const w=W[k],j=J[k]||{};
 if(j.state==='queued'||j.state==='running'){w.busy=true;continue}
 const fresh=w.busy||(j.at!=null&&w.n0!=null&&j.at>=w.n0);
 if(((j.state==='ok'||j.state==='error')&&fresh)||Date.now()-w.t0>120000){delete W[k];w.fn(j.state==='ok'&&fresh?null:(j.error||'timed out'))}}}
let pollT,polling=false;
async function poll(){clearTimeout(pollT);if(document.hidden||polling)return;polling=true;
 const prevUp=S.st.uptime_s;
 try{const {j}=await api('/api/status');S.st=j;S.rx=Date.now();const first=!S.ok;S.ok=true;
  if(S.reboot&&(S.fail>0||j.uptime_s<S.reboot.up||(prevUp!=null&&j.uptime_s<prevUp))){const R=S.reboot;S.reboot=null;S.ota=null;S.ui.otaWant=null;
   if(R.ver&&j.fw.version===R.ver)toast('Updated to v'+esc(R.ver));else if(R.ver)toast('Back online on v'+esc(j.fw.version)+(j.fw.rollback?' (rolled back)':''),'warn');else toast('Device is back online');
   loadCfg();loadLogic()}
  S.fail=0;checkJobs();if(first){loadCfg();loadLogic()}
  if(Date.now()-S.prAt>300000&&(cur()==='home'||cur()==='history'))loadPrices()}
 catch(e){S.fail++}
 polling=false;renderConn();renderLive();
 pollT=setTimeout(poll,Object.keys(W).length||S.reboot||S.fail?(S.fail>3?3000:1000):5000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
function renderConn(){const c=$('#conn');
 if(S.reboot)c.innerHTML=`<div class="banner blu">${I('refresh','spin')}<div><b>${S.reboot.ver?'Installing update — rebooting':'Rebooting'}…</b> Reconnecting automatically${S.fail?' (attempt '+S.fail+')':''}.</div></div>`;
 else if(S.fail>=2)c.innerHTML=`<div class="banner red">${I('warn','bad')}<div><b>Can’t reach the device.</b> Retrying… ${S.ok?'Showing the last known state.':''}</div></div>`;
 else c.innerHTML=''}

/* ---------- derived helpers ---------- */
const D=()=>S.st.decision||{};
const isPrice=()=>D().src==='price'&&!!D().state;
function priceTone(){const p=S.st.price,d=D();if(!p.known)return 'idle';
 if(nn(d.price_on)&&nn(d.price_off)){if(p.current<=d.price_on)return 'grn';if(p.current<=d.price_off)return 'amb';return 'red'}
 return p.current<2.5?'grn':p.current<4?'amb':'red'}
function savedBlock(){const d=D();if(!isPrice()||!S.lg||d.block<0)return null;const L=S.lg.logic.states;const st=d.fallback?L.default:L[d.state];return st&&st.charging_logic?st.charging_logic[d.block]:null}
function condText(cs){if(!cs||!cs.length)return 'Never auto‑entered — force it to use';
 return 'Enters when '+cs.map(c=>`battery ${c.operator.replace('>=','≥').replace('<=','≤')} ${c.value}%`).join(' and ')}
function winText(w){const d=w.days.slice().sort();
 const set=d.join(',');const ds=set==='1,2,3,4,5'?'Mon–Fri':set==='0,6'?'Sat–Sun':set==='0,1,2,3,4,5,6'?'Every day':d.map(x=>DAYN[x]).join(' ');
 return `${ds} ${w.start}–${w.end}`}
const sched=()=>(S.cfg&&S.cfg.schedule)||[];
function nextWindowStart(){const n=now();if(n==null)return null;const d=cd(n),day=d.getUTCDay(),nm=d.getUTCHours()*60+d.getUTCMinutes();let best=null;
 for(let k=0;k<8;k++)for(const w of sched()){if(!w.days.includes((day+k)%7))continue;const dt=k*1440+tm(w.start)-nm;if(dt>0&&(best==null||dt<best))best=dt}
 return best==null?null:n-d.getUTCSeconds()+best*60}
function next7(){const n=now(),d=cd(n);let dt=7*60-(d.getUTCHours()*60+d.getUTCMinutes());if(dt<=0)dt+=1440;return n-d.getUTCSeconds()+dt*60}
function nextCharge(){
 const s=S.st,d=D(),m=s.mode;
 if(s.relay&&s.car.status==='charging')return {m:'Now',d:m==='manual_on'?'manual override':'until price rises'};
 if(s.relay)return {m:'Relay is on',d:'car isn’t drawing power'};
 if(m==='manual_off')return s.until?{m:fmtT(s.until),d:'then Auto (price) resumes'}:{m:'Not scheduled',d:'Manual OFF until you change it'};
 if(!clk()||!s.price.known&&m!=='schedule')return {m:'After start‑up',d:'needs clock + fresh prices'};
 if(d.src==='overlay')return {m:'Not needed',d:d.reason};
 if(m==='schedule'){const t=nextWindowStart();return t?{m:fmtD(t).split(' ')[0]+' '+fmtT(t),d:'next schedule window'}:{m:'—',d:'no windows'}}
 if(isPrice()&&nn(d.price_on)&&S.pr){const on=d.price_on,h=hourNow(),T=S.pr.day_ahead_today,M=S.pr.day_ahead_tomorrow;
  const seq=[];for(let k=h+1;k<24;k++)seq.push([k,daH(T,k),0]);if(M)for(let k=0;k<7;k++)seq.push([k,daH(M,k),1]);
  const hit=seq.find(x=>nn(x[1])&&x[1]<=on);
  let res=hit?{m:'~'+pad2(hit[0])+':00',d:`forecast ${fmtC(hit[1])} ≤ start ${fmtC(on)}`}:{m:'Not before 7 am',d:`forecast low ${fmtC(s.price.lowest7)} > start ${fmtC(on)}`};
  if(m==='schedule_price'){const t=nextWindowStart();if(t&&(!hit||t<now()+3600*(hit[0]+(hit[2]?24:0)-h)))res={m:fmtT(t),d:'schedule window'}}
  return res}
 return {m:'—',d:''}}
function overlaps(logic){const out=[];const iv=cs=>{let lo=0,li=true,hi=100,hi_=true;
  for(const c of cs){const v=+c.value;if(c.operator==='>'||c.operator==='>='){const inc=c.operator==='>=';if(v>lo||(v===lo&&!inc)){lo=v;li=inc}}else{const inc=c.operator==='<=';if(v<hi||(v===hi&&!inc)){hi=v;hi_=inc}}}
  return {lo,li,hi,hi_}};
 const ne=a=>a.lo<a.hi||(a.lo===a.hi&&a.li&&a.hi_);
 const st=Object.entries(logic.states).filter(([n,s])=>(s.entry_conditions||[]).length);
 for(let i=0;i<st.length;i++)for(let j=i+1;j<st.length;j++){const a=iv(st[i][1].entry_conditions),b=iv(st[j][1].entry_conditions);
  let lo=a.lo,li=a.li;if(b.lo>lo||(b.lo===lo&&!b.li)){lo=b.lo;li=b.li}let hi=a.hi,hi_=a.hi_;if(b.hi<hi||(b.hi===hi&&!b.hi_)){hi=b.hi;hi_=b.hi_}
  if(ne(a)&&ne(b)&&ne({lo,li,hi,hi_}))out.push(`“${st[i][0]}” and “${st[j][0]}” both match at battery ${lo===hi?lo+'%':(li?'[':'(')+lo+'–'+hi+(hi_?']':')')+'%'} — the first in order wins, the state may flip`)}
 return out}
function validateLogic(o){const e=[];if(!o||typeof o!=='object'||!o.states||typeof o.states!=='object'||Array.isArray(o.states))return ['Missing "states" object'];
 const ns=Object.keys(o.states);if(!ns.length)e.push('At least one state is required');
 for(const n of ns){const st=o.states[n];if(!st||typeof st!=='object'){e.push(`${n}: must be an object`);continue}
  const cs=st.entry_conditions===undefined?[]:st.entry_conditions;if(!Array.isArray(cs))e.push(`${n}: entry_conditions must be a list`);
  else cs.forEach((c,i)=>{if(c.type!=='soc')e.push(`${n}: condition ${i+1} type must be "soc"`);if(!OPS.includes(c.operator))e.push(`${n}: condition ${i+1} operator must be one of > >= < <=`);if(typeof c.value!=='number'||c.value<0||c.value>100)e.push(`${n}: condition ${i+1} value must be 0–100`)});
  if(st.charging_logic!==undefined&&!Array.isArray(st.charging_logic))e.push(`${n}: charging_logic must be a list`);
  else (st.charging_logic||[]).forEach((b,i)=>{if(typeof b.soc!=='number'||b.soc<0||b.soc>100)e.push(`${n}: block ${i+1} soc must be 0–100`);
   ['price_on','price_off'].forEach(k=>{if(!(typeof b[k]==='number'||b[k]==='min'))e.push(`${n}: block ${i+1} ${k} must be a number or "min"`)});
   if(b.known_minutes!=null&&!(Number.isInteger(b.known_minutes)&&b.known_minutes>=0&&b.known_minutes<60))e.push(`${n}: block ${i+1} known_minutes must be 0–59`)})}
 if(o.state_select&&!o.states[o.state_select])e.push(`state_select “${o.state_select}” is not a state`);return e}

/* ---------- screens ---------- */
const SCR={};
SCR.home=()=>{
 const s=S.st,d=D(),car=s.car||{},ch=s.relay&&car.status==='charging',soc=nn(car.soc)?Math.round(car.soc):null,man=s.mode==='manual_on'||s.mode==='manual_off';
 let title;
 if(!S.ok)title='Connecting…';
 else if(!clk()||!s.price.known&&!man)title='Starting up';
 else if(ch)title=s.mode==='manual_on'?'Charging (manual)':'Charging';
 else if(s.relay)title='Relay on — not charging';
 else if(s.mode==='manual_off')title='Charger off';
 else title=d.src==='overlay'?'Done for now':'Waiting for cheaper power';
 const C=2*Math.PI*104,len=soc==null?0:C*soc/100,col=ch?'url(#rg)':s.relay?'var(--grn)':'var(--idle)';
 const tgt=s.soc_target&&s.soc_target.enabled?s.soc_target.value:null;
 const ta=tgt!=null?(tgt/100)*2*Math.PI:0;
 const ring=`<div class="ringwrap ${ch?'charging':''}"><svg viewBox="0 0 240 240"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0fb85b"/><stop offset="1" stop-color="#7cf0b0"/></linearGradient>
  <mask id="mk"><circle cx="120" cy="120" r="104" fill="none" stroke="#fff" stroke-width="20" stroke-dasharray="${len} ${C}" stroke-linecap="round"/></mask></defs>
  <circle cx="120" cy="120" r="104" fill="none" stroke="var(--idle-soft)" stroke-width="20"/>
  <circle class="arc" cx="120" cy="120" r="104" fill="none" stroke="${col}" stroke-width="20" stroke-linecap="round" stroke-dasharray="${len} ${C}"/>
  ${ch?`<circle class="flow" mask="url(#mk)" cx="120" cy="120" r="104" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="20" stroke-dasharray="3 15"/>`:''}
  ${tgt!=null?`<line x1="${120+92*Math.cos(ta)}" y1="${120+92*Math.sin(ta)}" x2="${120+116*Math.cos(ta)}" y2="${120+116*Math.sin(ta)}" stroke="var(--txt)" stroke-width="3" stroke-linecap="round"/>`:''}
 </svg><div class="ring-c">${ch&&nn(car.kw)?`<div class="v">${car.kw.toFixed(1)}<small>kW</small></div><div class="l">${soc==null?'':soc+'% · '}charging</div>`:`<div class="v">${soc==null?'—':soc}<small>%</small></div><div class="l">${car.soc_live?'battery':'last known battery'}${tgt!=null?' · target '+tgt+'%':''}</div>`}</div></div>`;
 const tone=priceTone();const pr=s.price;
 const needle=pr.known?Math.max(0,Math.min(1,(pr.current+1)/7)):.5;const na=Math.PI*(1-needle);
 const gauge=`<svg width="34" height="20" viewBox="0 0 34 20"><path d="M3 18a14 14 0 0 1 9-13" stroke="#16c264" stroke-width="4" fill="none"/><path d="M13 4.6a14 14 0 0 1 8 0" stroke="#f0a020" stroke-width="4" fill="none"/><path d="M22 5a14 14 0 0 1 9 13" stroke="#ec4b4b" stroke-width="4" fill="none"/>${pr.known?`<line x1="17" y1="18" x2="${17+12*Math.cos(na)}" y2="${18-12*Math.sin(na)}" stroke="var(--txt)" stroke-width="2.4" stroke-linecap="round"/>`:''}<circle cx="17" cy="18" r="2.4" fill="var(--txt)"/></svg>`;
 const pchip=`<button class="pchip" data-act="priceSheet">${gauge}<span><b class="${tone==='grn'?'ok':tone==='red'?'bad':tone==='amb'?'warn':''}">${pr.known?fmtC(pr.current):'—'}</b> ${pr.known?(pr.estimated?'est. day‑ahead':'now'):'no price yet'}</span>${I('chev','chev')}</button>`;
 const B=s.banners||{};let banners='';
 if(B.relay_on_not_charging)banners+=`<div class="banner amb">${I('warn','warn')}<div><b>Relay is ON but the car isn’t charging.</b><br>${car.status==='not_detected'?'Car not detected over Bluetooth — is it home and plugged in?':'Car is drawing &lt; '+(car.threshold_w??500)+' W. Check the plug.'} <span class="muted tiny">(Shown here only — no notification.)</span></div></div>`;
 if(B.no_clock||(S.ok&&!clk()))banners+=`<div class="banner blu">${I('info')}<div><b>Starting up (up ${fmtUp(s.uptime_s)}).</b> No clock yet (NTP pending), so prices can’t be fetched and schedules can’t run. The relay stays at the configured default: <b>${s.relay_default?'ON':'OFF'}</b>. Manual “indefinitely” still works.</div></div>`;
 else if(B.price_stale)banners+=`<div class="banner blu">${I('info')}<div>Price data is stale (&gt; ${pr.stale_min??20} min, no day‑ahead) → relay = default.</div></div>`;
 if(B.ap_mode)banners+=`<button class="banner blu" style="width:100%" data-act="push" data-s="wifi">${I('wifi')}<div><b>Setup hotspot ${esc(s.wifi.ap_ssid)} is on.</b> ${s.wifi.ssid?'Wi‑Fi “'+esc(s.wifi.ssid)+'” is not connected.':'No Wi‑Fi network saved yet.'} Tap to connect.</div></button>`;
 if(B.rollback)banners+=`<button class="banner amb" style="width:100%" data-act="push" data-s="firmware">${I('warn','warn')}<div><b>Running from rollback.</b> The last update failed its health check.</div></button>`;
 const md=MODES[s.mode]||MODES.auto;const nc=nextCharge();const sb=savedBlock();
 const ses=s.session,ls=s.last_session;
 const sesTile=ses&&s.relay?`<div class="m">${nn(ses.kwh)?ses.kwh.toFixed(1):'—'} kWh</div><div class="d">${fmtCost(ses.cost_c)} · since ${fmtT(ses.start)}</div>`:ls?`<div class="m">${nn(ls.kwh)?ls.kwh.toFixed(1):'—'} kWh</div><div class="d">${fmtCost(ls.cost_c)} · ended ${fmtT(ls.end)} ${ls.end&&now()&&dayKey(ls.end)===dayKey(now())?'today':ls.end?fmtD(ls.end):''}</div>`:`<div class="m">—</div><div class="d">no sessions yet</div>`;
 return `<div class="hero ${ch?'charging':''}">
  <h1>${title}</h1><p class="why">${esc(d.reason)}</p>${ring}
  <span class="relaypill ${s.relay?'on':''}"><span class="dot"></span>Relay ${s.relay?'ON':'OFF'}${d.src==='default'?' · default':''}</span>
  <div class="chips">${pchip}</div></div>${banners}
  <button class="modebtn ${s.relay?'go':''}" data-act="modeSheet"><span class="ic">${I(md.ic)}</span><span><div class="s">Mode</div><div class="t">${md.t}${s.until?' · until '+fmtT(s.until):''}</div><div class="s">${tgt!=null?'Stops at '+tgt+'% · ':''}Tap to change</div></span>${I('chev','chev')}</button>
  <div class="grid2">
   <div class="tile card"><div class="h">${I('clock')}Next charge</div><div class="m">${nc.m}</div><div class="d">${esc(nc.d)}</div></div>
   <div class="tile card"><div class="h">${I('car')}Car</div><div class="m ${car.status==='not_detected'?'bad':car.status==='charging'?'ok':''}">${CARTXT[car.status]||esc(car.status)}</div><div class="d">${soc!=null?soc+'% · ':''}${car.last_seen?'seen '+ago(car.last_seen):'from memory'}${car.status==='charging'&&nn(car.kw)?' · '+car.kw.toFixed(1)+' kW':''}</div><button class="mini" data-act="poll">${W.car_poll?I('refresh','spin'):'Poll car now'}</button></div>
   <button class="tile card" data-act="tab" data-t="logic"><div class="h">${I('batt')}Active rule</div>${isPrice()?`<div class="m">${esc(d.state)}${d.how==='forced'?' <span class="tiny warn">forced</span>':''}</div><div class="d">${d.block>=0?`${sb?'≥'+sb.soc+'% band: ':''}start ≤ ${fmtC(d.price_on)}, stop &gt; ${fmtC(d.price_off)}`:'no bands'}</div>`:`<div class="m">${man?'Overridden':'—'}</div><div class="d">${man?'price rules paused':'price rules not running'}</div>`}</button>
   <div class="tile card"><div class="h">${I('bolt')}${ses&&s.relay?'This session':'Last session'}</div>${sesTile}</div>
  </div>
  <button class="sysrow card" data-act="push" data-s="diag"><span class="${clk()?'ok':'warn'}">${I(clk()?'check':'clock')}${clk()?'Clock ok':'No clock'}</span><span>${I('wifi')}${s.wifi.sta?s.wifi.rssi+' dBm':s.wifi.ap?'Hotspot':'—'}</span><span>${I('chip')}${kb(s.heap.free)}</span><span>up ${fmtUp(s.uptime_s)}</span>${I('chev','chev')}</button>`};

SCR.logic=()=>{
 if(!S.lg)return `<div class="big">Price rules</div>`+loading();
 if(!S.ui.draft){S.ui.draft=clone(S.lg.logic);if(!S.ui.draft.states)S.ui.draft.states={}}
 const Dr=S.ui.draft;const names=Object.keys(Dr.states);const d=D(),car=S.st.car||{};
 if(!S.ui.selState||!Dr.states[S.ui.selState])S.ui.selState=(isPrice()&&Dr.states[d.state])?d.state:names[0];
 const sel=S.ui.selState,st=Dr.states[sel]||{entry_conditions:[],charging_logic:[]};
 const sb=savedBlock();
 const blocks=st.charging_logic||[];const order=blocks.map((b,i)=>i).sort((a,b)=>blocks[b].soc-blocks[a].soc);
 const isCur=isPrice()&&d.state===sel,soc=nn(car.soc)?Math.round(car.soc):null;
 const bands=order.map((i,k)=>{const b=blocks[i];const lo=b.soc,hi=k===0?100:blocks[order[k-1]].soc;const last=k===order.length-1;
  const eager=Math.max(0,Math.min(1,((resolveP(b.price_on)??0)+2)/6));const bg=`rgba(22,194,100,${(.12+eager*.5).toFixed(2)})`;
  const active=isCur&&!d.fallback&&sb&&sb.soc===b.soc;let mk='';
  const rlo=last?0:lo;if(isCur&&soc!=null&&soc>=rlo&&soc<=hi&&hi>rlo){const top=(hi-soc)/(hi-rlo)*100;mk=`<div class="marker" style="top:${top.toFixed(1)}%"><span>${soc}% now</span></div>`}
  return `<button class="band ${active?'act':''}" style="flex:${Math.max(hi-rlo,1)} 1 0;background:${bg}" data-act="editBand" data-i="${i}">${mk}${active?'<span class="tag">ACTIVE</span>':''}<div class="from">${last&&lo>0?'&lt;'+hi:lo}%<small>${last&&lo>0?'and below':'to '+hi+'%'}</small></div><b>start ≤ ${fmtP(b.price_on,1)} · stop &gt; ${fmtP(b.price_off,1)}</b><div class="ex">${b.known_minutes?'Waits until :'+pad2(b.known_minutes)+' each hour for a reliable price':'Acts on the price right away'}</div></button>`}).join('');
 const ov=S.ui.dirty?overlaps(Dr):(S.lg.warnings||[]);const ss=Dr.state_select||'';
 const mo=minOff();
 const howT={forced:'forced',entered:'entry condition met',sticky:'kept from before — sticky'};
 return `<div class="big">Price rules</div>
 <div class="card pad small"><b>Now:</b> ${isPrice()?`state <b>${esc(d.state)}</b> (${howT[d.how]||esc(d.how)}${d.fallback?', bands from “default”':''}), ${sb?'band ≥'+sb.soc+'%: ':''}start ≤ ${fmtC(d.price_on)}, stop &gt; ${fmtC(d.price_off)}.`:'price rules aren’t deciding right now — '+esc(d.reason)+'.'} <span class="muted">Battery ${soc==null?'unknown':soc+'%'}${car.soc_live?'':' (last known)'}.</span></div>
 <div class="group" style="margin-top:14px"><div class="list card noic"><div class="row"><div class="lab">Which state<small>${ss?'Forced — entry conditions ignored':'Auto — picked by battery level'}</small></div><select data-ch="stateSel" style="width:150px">${['',...names].map(n=>`<option value="${esc(n)}" ${n===ss?'selected':''}>${n?'Force: '+esc(n):'Auto'}</option>`).join('')}</select></div></div></div>
 <div class="tiny muted" style="margin:16px 4px 6px">STATES — swipe · tap to view</div>
 <div class="pills">${names.map(n=>`<button class="pill ${n===sel?'sel':''}" data-act="selState" data-n="${esc(n)}">${isPrice()&&d.state===n?'<span class="now">NOW</span>':''}<div class="n">${esc(n)}</div><div class="c">${esc(condText(Dr.states[n].entry_conditions))}</div></button>`).join('')}<button class="pill add" data-act="addState">${I('plus')}State</button></div>
 ${ov.length?`<div class="banner amb">${I('warn','warn')}<div><b>Overlapping entry ranges</b><br>${ov.map(esc).join('<br>')}<br><span class="tiny">Make exactly one side of each boundary include “=”.</span></div></div>`:''}
 ${names.length?`<div class="flex" style="margin:10px 2px 4px"><div class="sp"><b style="font-size:18px">${esc(sel)}</b><div class="small muted">${esc(condText(st.entry_conditions))}</div></div><button class="btn s sm" data-act="editState">Edit state</button></div>
 <div class="batt"><div class="nub"></div><div class="cells">${bands||`<div class="muted small" style="padding:30px;text-align:center">No bands. ${Dr.states.default&&sel!=='default'?'Uses the “default” state’s bands.':'Relay will fall to the default state.'}</div>`}</div></div>
 <button class="addband" data-act="addBand">+ Add battery band</button>
 <div class="legend" style="margin:8px 4px"><span>Greener band = starts at a higher price (charges more readily). Tap a band to edit.</span></div>`:'<div class="card pad muted small mt">No states yet — add one.</div>'}
 <div class="group"><div class="gh">Advanced</div><div class="list card noic">
  <div class="row"><div class="lab">“min” offset<small>min = lowest by 7 am ${fmtC(S.st.price.lowest7)} + offset</small></div><input type="number" step="0.1" value="${nn(mo)?mo:''}" data-ch="minoff" style="width:70px">¢</div>
  <button class="row" data-act="push" data-s="json"><div class="lab">Raw JSON<small>View, paste, import or export logic.json</small></div>${I('chev','chev')}</button></div>
  <div class="gf">Bands are sorted high→low battery on save. Operators are literal: “&gt;” is strict, “≥” inclusive.</div></div>
 ${S.ui.dirty?`<div class="savebar"><span>Unsaved rule changes</span><button class="btn s sm" data-act="discard">Discard</button><button class="btn g sm" data-act="saveLogic">Save</button></div>`:''}`};

SCR.json=()=>`<p class="small muted">Same shape as bolt-monitor’s <code>logic.json</code>. Paste to import; “Apply” loads it into the editor (then Save on the Rules tab).</p>
 <textarea class="json" id="jsontxt" spellcheck="false">${esc(JSON.stringify(S.ui.draft||(S.lg&&S.lg.logic)||{states:{}},null,2))}</textarea>

  ${rowNav('wifi','wifi','#2f7cf6','Wi‑Fi',w.sta?w.ssid:w.ap?'Hotspot on':(w.ssid||'Not set'))}${rowNav('car','car','#7a5af5','Car link',c?(c.dongle_mac||'not set').slice(-5):'…')}${rowNav('notify','bell','#ec4b4b','Notifications',c?(c.pushover.enabled?'Pushover on':'Off'):'…')}</div></div>
 <div class="group"><div class="gh">Device</div><div class="list card">
  ${rowNav('relay','relay','#6b7380','Relay & safety',c?(c.relay_active_high?'Active high':'Active low'):'…')}${rowNav('firmware','chip','#0fa957','Firmware',s.fw.version?'v'+s.fw.version+(s.fw.rollback?' · rollback':''):'')}${rowNav('diag','pulse','#e8590c','Diagnostics',clk()?'OK':'No clock')}${rowNav('log','list','#495057','Event log',S.log?S.log.length+' events':'')}</div></div>

function winErr(w){if(!w.days.length)return 'Pick at least one day.';if(w.start===w.end)return 'Start and end can’t be the same.';return ''}
SCR.schedule=()=>{if(!S.cfg)return loading();if(!S.ui.sched)S.ui.sched=clone(sched());const ws=S.ui.sched,mode=S.st.mode;
 const week=[1,2,3,4,5,6,0].map(d=>{let bars='';for(const w of ws){if(winErr(w))continue;const s=tm(w.start)/1440*100,e=tm(w.end)/1440*100;
  if(s<e){if(w.days.includes(d))bars+=`<i style="left:${s}%;width:${e-s}%"></i>`}else{if(w.days.includes(d))bars+=`<i style="left:${s}%;right:0"></i>`;if(w.days.includes((d+6)%7))bars+=`<i style="left:0;width:${e}%"></i>`}}
  return `<span>${DAYN[d]}</span><div class="wbar">${bars}</div>`}).join('');
 const inSched=mode==='schedule'||mode==='schedule_price';
 return `<div class="card pad"><div class="week">${week}<span></span><div class="flex tiny" style="justify-content:space-between"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div></div></div>
 ${ws.map((w,i)=>`<div class="group"><div class="gh">Window ${i+1}${S.st.schedule_active===i&&inSched?' · <span class="ok">active now</span>':''}</div><div class="card pad">
  <div class="days">${[1,2,3,4,5,6,0].map(d=>`<button class="${w.days.includes(d)?'on':''}" data-act="day" data-w="${i}" data-d="${d}">${DAYN[d][0]}${d===2||d===4?DAYN[d][1]:''}</button>`).join('')}</div>
  <div class="flex mt"><label class="fld sp" style="margin:0"><span>Relay ON from</span><input type="time" value="${w.start}" data-ch="win" data-w="${i}" data-k="start"></label><label class="fld sp" style="margin:0"><span>until</span><input type="time" value="${w.end}" data-ch="win" data-w="${i}" data-k="end"></label></div>
  <div class="err ${winErr(w)?'show':''}" style="padding:8px 0 0">${winErr(w)}</div>
  <div class="flex mt"><span class="small muted sp">${tm(w.start)>tm(w.end)?'Overnight window — ends next morning.':''}</span><button class="btn r sm" data-act="delWin" data-w="${i}">${I('trash')}Remove</button></div></div></div>`).join('')}
 ${ws.length<8?'<button class="addband mt" data-act="addWin">+ Add window</button>':''}
 <div class="group"><div class="gh">Outside the windows</div><div class="list card noic">
  <button class="row" data-act="setMode" data-m="schedule"><div class="lab">Stay off<small>Mode “Schedule” — windows only</small></div>${mode==='schedule'?I('check','ok'):''}</button>
  <button class="row" data-act="setMode" data-m="schedule_price"><div class="lab">Use price rules<small>Mode “Schedule + price”</small></div>${mode==='schedule_price'?I('check','ok'):''}</button></div>
  <div class="gf">${inSched?'Schedule is active now.':'Current mode is '+(MODES[mode]||MODES.auto).t+' — picking one of these switches the mode.'} Schedules need a valid clock${clk()?'':' <b class="warn">(not set yet — relay uses default)</b>'}. Changes save automatically.</div></div>`};

SCR.car=()=>{if(!S.cfg)return loading();const c=S.cfg;return `${carCard()}
 <div class="group"><div class="gh">OBD dongle (BLE)</div><div class="list card noic">

const OTA_ACTIVE={checking:1,downloading:1,verifying:1};
function otaBox(){const o=S.ota||{},m=o.manifest,ph=o.phase||'idle',inst=ph==='downloading'||ph==='verifying'||ph==='done'||(S.reboot&&S.reboot.ver);
 let h='';
 if(ph==='checking')h=`<div class="card pad mt small muted">${I('refresh','spin')} Checking for an update…</div>`;
 else if(ph==='up_to_date')h=`<div class="card pad mt small ok">${I('check')} Up to date${m?' — latest is v'+esc(m.version):''}.</div>`;
 else if(ph==='error'&&o.error)h=`<div class="banner red mt">${I('warn','bad')}<div><b>Update failed.</b> ${esc(o.error)}</div></div>`;
 if(m&&(ph==='available'||inst))h+=`<div class="group"><div class="gh">Available</div><div class="card pad"><div class="flex"><b style="font-size:20px">v${esc(m.version)}</b><span class="sp"></span><span class="small muted">${nn(m.size)?(m.size/1048576).toFixed(2)+' MB':''}</span></div>
  ${m.notes?`<div class="small muted mt">${esc(m.notes)}</div>`:''}${m.direct_bin?`<div class="small warn mt">${I('warn')} Direct .bin — no sha256 check.</div>`:''}
  ${inst?`<div class="prog"><i style="width:${S.reboot?100:o.pct||0}%"></i></div><div class="small muted mt">${S.reboot||ph==='done'?'Verified. Rebooting — reconnecting automatically…':ph==='verifying'?'Verifying…':'Downloading & writing… '+(o.pct||0)+'%'} Relay stays as is.</div>`:`<button class="btn g w mt" data-act="otaInstall">Install v${esc(m.version)}</button>`}</div></div>`;
 return `<div id="otabox">${h}</div>`}
SCR.firmware=()=>{const f=S.st.fw||{},o=S.ota||{};const url=S.ui.fwUrl??(S.cfg?S.cfg.ota_url:OTA_DEFAULT);const busy=OTA_ACTIVE[o.phase]||S.reboot;
 return `<div class="card pad" style="text-align:center"><div class="muted small">Installed</div><div style="font-size:30px;font-weight:750">v${esc(f.version||'?')}</div>
 ${f.rollback?`<div class="banner amb" style="text-align:left">${I('warn','warn')}<div><b>Running from rollback.</b> The last update didn’t pass its health check and the previous version was restored.</div></div>`:f.pending_verify?`<div class="small warn">${I('clock')} New image — health check pending</div>`:`<div class="small ok">${I('check')} Validated image</div>`}</div>
 <div class="group"><div class="gh">Update source</div><div class="list card noic"><div class="row" style="flex-direction:column;align-items:stretch;gap:6px"><span class="small muted">Manifest or .bin URL (https only)</span><input class="ip" type="url" id="f_url" value="${esc(url)}" data-in="fwurl" style="text-align:left;width:100%;font-size:13px"></div><div class="err" data-err="url"></div></div>
 <div class="flex mt"><button class="btn s sm" data-act="otaReset">Reset to default</button><span class="sp"></span><button class="btn sm" data-act="otaCheck" ${busy?'disabled':''}>${o.phase==='checking'?I('refresh','spin'):''}Check for update</button></div></div>
 ${otaBox()}
 <button class="btn r w mt2" data-act="reboot">Reboot device</button>`};

 return `<div class="group"><div class="gh">Time & prices</div><div class="list card noic">${r('Clock',clk()?'Valid (NTP) · '+fmtT(now())+' CT':'Not set — waiting for NTP',clk()?'ok':'warn')}
 ${r('Current supply price',p.known?fmtC(p.current)+(p.estimated?' (est. day‑ahead)':''):'unknown')}${r('Price data age',nn(p.age_s)?Math.round(p.age_s/60)+' min':'—',p.age_s>(p.stale_min||20)*60?'warn':'')}${r('Minutes known this hour',nn(p.known_minutes)?p.known_minutes:'—')}${r('Lowest by 7 am',fmtC(p.lowest7))}${r('“min” used in rules',fmtC(p.min_price)+' (+'+(p.min_offset??'—')+'¢)')}${p.last_error?r('Last price error',esc(p.last_error),'bad'):''}</div></div>
 <div class="group"><div class="gh">Network</div><div class="list card noic">${r('Wi‑Fi',w.sta?esc(w.ssid)+' · '+w.rssi+' dBm':'not connected',w.sta?'':'warn')}${r('IP',esc(w.ip||'—'))}${r('Hotspot',w.ap?esc(w.ap_ssid)+' · '+(w.ap_clients||0)+' client(s)':'off')}</div></div>
 <div class="group"><div class="gh">Car link</div><div class="list card noic">${r('Status',CARTXT[car.status]||esc(car.status))}${r('Last poll',car.last_poll_at?ago(car.last_poll_at):nn(car.last_poll_up_s)?'at uptime '+fmtUp(car.last_poll_up_s):'never')}${car.error?r('Last error',esc(car.error),'bad'):''}</div></div>
 <div class="group"><div class="gh">Memory</div><div class="list card noic">${r('Heap free',kb(h.free))}${r('Heap minimum ever',kb(h.min),h.min<40000?'warn':'')}${r('Largest free block',kb(h.largest),h.largest<40000?'warn':'')}${r('Storage',nn(fs.total)?kb(fs.used)+' of '+kb(fs.total):'—')}</div><div class="gf">TLS needs ~40 KB contiguous; BLE and TLS never run at the same time.</div></div>
 <div class="group"><div class="gh">System</div><div class="list card noic">${r('Firmware','v'+esc(s.fw.version||'?')+(s.fw.rollback?' (rollback)':''))}${r('Uptime',fmtUp(s.uptime_s))}${r('Reset reason',esc(s.reset_reason||'—'))}${r('Sticky state',esc(s.sticky_state||'—'))}</div></div>`};

SCR.log=()=>{if(!S.log)return loading();const f=S.ui.logFilter;const K={relay:'var(--grn)',push:'var(--blu)',err:'var(--red)',sys:'var(--idle)',car:'#7a5af5',price:'var(--amb)',state:'#0ca5b0'};
 const items=S.log.filter(e=>f==='all'||(f==='relay'?e.k==='relay'||e.k==='state':e.k===f));
 return `<div class="fchips">${[['all','All'],['relay','Relay'],['push','Pushover'],['err','Errors'],['car','Car'],['price','Price'],['sys','System']].map(([k,l])=>`<button class="${f===k?'on':''}" data-act="logF" data-f="${k}">${l}</button>`).join('')}</div>

 <div class="gf small muted" style="margin:8px 4px">Times like +00:00:12 are uptime — logged before the clock was set. Last 500 events kept.</div>`};

/* charts */
function priceChart(){const W=600,H=250,pl=30,pr=34,pt=12,pb=24;const P=S.pr||{},n=clk()?hourFloat():null,mid=clk()?midnight():0;
 const T=P.day_ahead_today||[],A=P.actual_today||[],five=(P.five_min||[]).map(p=>[(p[0]-mid)/3600,p[1]]).filter(p=>p[0]>=0&&p[0]<=24&&nn(p[1]));
 const all=T.concat(A,five.map(p=>p[1])).filter(nn);
 const lo=Math.floor(Math.min(-1,...all)),hi=Math.ceil(Math.max(6,...all));const x=h=>pl+h/24*(W-pl-pr),y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
 const step=hi-lo>40?10:hi-lo>16?5:2;let g='';
 const det=(S.det||[]).filter(r=>r[0]>=mid).sort((a,b)=>a[0]-b[0]);
 let st=null;det.forEach((r,i)=>{const on=r[4]===1,t=(r[0]-mid)/3600;if(on&&st==null)st=t;if(st!=null&&(!on||i===det.length-1)){const e=on?(n??t):t;g+=`<rect x="${x(st)}" y="${pt}" width="${Math.max(2,x(e)-x(st))}" height="${H-pt-pb}" fill="var(--grn)" opacity=".13"/>`;st=null}});
 for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--mute)">${v}</text>`;
 for(let h=0;h<=24;h+=6)g+=`<text x="${x(h)}" y="${H-6}" font-size="11" text-anchor="middle" fill="var(--mute)">${pad2(h%24)}:00</text>`;
 const d=D();if(nn(d.price_on)&&nn(d.price_off)){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(d.price_on)}" y2="${y(d.price_on)}" stroke="var(--grn2)" stroke-dasharray="2 4"/><line x1="${pl}" x2="${W-pr}" y1="${y(d.price_off)}" y2="${y(d.price_off)}" stroke="var(--red)" stroke-dasharray="2 4"/>`}
 if(S.ui.overlay&&det.length){const kws=det.map(r=>nn(r[2])?Math.abs(r[2])/1000:0),mx=Math.max(8,...kws);const kwy=v=>H-pb-v/mx*(H-pt-pb)*.45;
  const pw=`M${x((det[0][0]-mid)/3600)} ${kwy(0)}`+det.map((r,i)=>`L${x((r[0]-mid)/3600).toFixed(1)} ${kwy(kws[i]).toFixed(1)}`).join('')+`L${x((det[det.length-1][0]-mid)/3600)} ${kwy(0)}Z`;
  let sc='',pen='M';for(const r of det){if(!nn(r[3])){pen='M';continue}sc+=`${pen}${x((r[0]-mid)/3600).toFixed(1)} ${(pt+(100-r[3])/100*(H-pt-pb)).toFixed(1)}`;pen='L'}
  g+=`<path d="${pw}" fill="#7a5af5" opacity=".18"/>${sc?`<path d="${sc}" fill="none" stroke="#7a5af5" stroke-width="1.6" stroke-dasharray="5 3"/>`:''}`;
  for(let v=0;v<=100;v+=50)g+=`<text x="${W-pr+4}" y="${pt+(100-v)/100*(H-pt-pb)+4}" font-size="10" fill="#7a5af5">${v}%</text>`}
 const stp=(arr,upto)=>{let s='',pen='M';for(let h=0;h<upto;h++){const v=daH(arr,h);if(!nn(v)){pen='M';continue}s+=`${pen}${x(h)} ${y(v)}H${x(h+1)}`;pen='L'}return s};
 if(T.length)g+=`<path d="${stp(T,24)}" fill="none" stroke="var(--mute)" stroke-width="1.6" stroke-dasharray="5 4"/>`;
 if(n!=null&&A.length)g+=`<path d="${stp(A,Math.floor(n))}" fill="none" stroke="var(--amb)" stroke-width="2.2"/>`;
 if(five.length)g+=`<path d="${five.map((p,i)=>`${i?'L':'M'}${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`).join('')}" fill="none" stroke="var(--blu)" stroke-width="1.1" opacity=".85"/>`;
 g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--sub)" stroke-width=".8"/>`;
 if(n!=null)g+=`<line x1="${x(n)}" x2="${x(n)}" y1="${pt}" y2="${H-pb}" stroke="var(--txt)" stroke-width="1.2"/>${S.st.price.known?`<circle cx="${x(n)}" cy="${y(S.st.price.current)}" r="4" fill="var(--blu)"/>`:''}`;
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Today's prices">${g}</svg>`}
function bars(data){if(!data.length)return '<div class="muted small pad">No data yet.</div>';const W=600,H=170,pl=6,pb=22,n=data.length,bw=(W-pl*2)/n;const mx=Math.max(...data.map(d=>d.k),1);
 return `<svg viewBox="0 0 ${W} ${H}">${data.map((d,i)=>{const h=d.k/mx*(H-pb-18);const X=pl+i*bw+bw*.15;return `<g><title>${d.l}: ${d.k.toFixed(1)} kWh · ${fmtCost(d.c)}</title><rect x="${X}" y="${H-pb-h}" width="${bw*.7}" height="${Math.max(h,1)}" rx="5" fill="${i===n-1?'var(--grn)':'var(--grn2)'}" opacity="${i===n-1?1:.65}"/>${n<=8||i%2===1?`<text x="${X+bw*.35}" y="${H-6}" font-size="11" text-anchor="middle" fill="var(--mute)">${d.l}</text>`:''}${d.k&&n<=8?`<text x="${X+bw*.35}" y="${H-pb-h-5}" font-size="11" text-anchor="middle" fill="var(--sub)">${d.k.toFixed(1)}</text>`:''}</g>`}).join('')}</svg>`}
SCR.history=()=>{const v=S.ui.histView,p=S.st.price;
 const src=v==='daily'?S.daily:S.monthly;
 const data=(src||[]).map(r=>({l:v==='daily'?(Math.floor(r.date/100)%100)+'/'+(r.date%100):MON[(r.month%100)-1]||r.month,k:+r.kwh||0,c:+r.cost_c||0}));
 const tk=data.reduce((a,d)=>a+d.k,0),tc=data.reduce((a,d)=>a+d.c,0);
 return `${S.ui.stack.length?'':'<div class="big">History</div>'}<div class="hgrid"><div>
 <div class="card pad chart"><div class="flex"><b class="sp">Today’s prices</b><span class="small muted">¢/kWh supply · CT</span></div>${S.pr&&clk()?priceChart():`<div class="muted small pad">${clk()?'Loading…':'No data yet — waiting for clock.'}</div>`}
 <div class="legend"><span><i style="background:var(--mute)"></i>Day‑ahead</span><span><i style="background:var(--amb)"></i>Actual hourly</span><span><i style="background:var(--blu)"></i>5‑min</span><span><i style="background:var(--grn);opacity:.4;height:9px"></i>Relay on</span>${nn(D().price_on)?'<span><i style="background:var(--grn2)"></i>start</span><span><i style="background:var(--red)"></i>stop</span>':''}${S.ui.overlay?'<span><i style="background:#7a5af5"></i>kW / SOC</span>':''}</div>
 <label class="flex small mt"><input type="checkbox" class="tg" data-ch="overlay" ${S.ui.overlay?'checked':''}> Show power & SOC overlay</label></div>
 <div class="kpis"><div class="kpi"><b>${fmtC(p.lowest7)}</b><span>lowest by 7 am</span></div><div class="kpi"><b>${fmtC(p.current)}</b><span>now${p.estimated?' (est.)':''}</span></div><div class="kpi"><b>${nn(p.age_s)?Math.round(p.age_s/60)+'m':'—'}</b><span>data age</span></div></div></div>
 <div><div class="card pad mt chart"><div class="flex"><b class="sp">Energy into car</b><div class="seg" style="width:150px"><button class="${v==='daily'?'on':''}" data-act="hv" data-v="daily">Daily</button><button class="${v==='monthly'?'on':''}" data-act="hv" data-v="monthly">Monthly</button></div></div>
 <div class="small muted" style="margin:6px 0">${v==='daily'?'Last 14 days':'Last 6 months'}: <b style="color:var(--txt)">${tk.toFixed(1)} kWh · ${fmtCost(tc)}</b>${tk?' · avg '+fmtC(tc/tk)+'/kWh':''}</div>${src?bars(data):loading()}</div>
 <div class="group"><div class="gh">Sessions</div><div class="list card noic">${!S.sess?loading():S.sess.length?S.sess.map(s=>`<div class="row"><div class="lab">${s.start?fmtD(s.start)+' · '+fmtT(s.start):'—'}<small>${nn(s.soc_start)?s.soc_start+'%':'?'} → ${nn(s.soc_end)?s.soc_end+'%':'?'} · avg ${fmtC(s.avg_price)}${s.manual?' · manual':''}${s.car_detected===false?' · car not seen':''}</small></div><div class="val"><b style="color:var(--txt)">${nn(s.kwh)?s.kwh.toFixed(1):'—'} kWh</b><br>${fmtCost(s.cost_c)}</div></div>`).join(''):'<div class="row muted small">No sessions yet.</div>'}</div></div></div></div>`};
function sheetPrice(){const pr=S.st.price,d=D(),P=S.pr;if(Date.now()-S.prAt>120000)loadPrices().then(()=>{if($('#sheet').classList.contains('show')&&$('#psheet'))sheetPrice()});
 const h=clk()?hourNow():null;
 openSheet(`<div class="grab" id="psheet"></div><h2>Price right now</h2><div style="font-size:40px;font-weight:760">${pr.known?fmtC(pr.current):'—'}</div>

 ${nn(d.price_on)&&nn(d.price_off)?`<div class="preview">Current band starts charging at <b>≤ ${fmtC(d.price_on)}</b> and stops above <b>${fmtC(d.price_off)}</b>.</div>`:''}
 <div class="group"><div class="list card noic"><div class="row"><div class="lab">Lowest by 7 am<small>day‑ahead forecast</small></div><div class="val">${fmtC(pr.lowest7)}</div></div>
 <div class="row"><div class="lab">“min” price used by rules<small>lowest + offset ${pr.min_offset??'—'}¢</small></div><div class="val">${fmtC(pr.min_price)}</div></div>

 <button class="btn s w mt" data-act="sheetHist">Open price chart</button>`)}

 ${Object.entries(MODES).map(([k,m])=>{const dis=m.clk&&!clk();return `<button class="mcard ${s.mode===k?'cur':''}" data-act="pickMode" data-m="${k}" ${dis?'disabled':''}><span class="ic" style="background:${m.c}">${I(m.ic)}</span><span class="sp"><div class="t">${m.t}</div><div class="s">${dis?'Needs a valid clock — not set yet':m.d}${k.startsWith('schedule')&&!dis?' · '+esc(sched().map(winText).join(', ')||'no windows'):''}</div></span>${s.mode===k?I('check','ok'):''}</button>`}).join('')}
 <div class="group"><div class="gh">Battery target</div><div class="card pad"><div class="flex"><div class="sp"><b>Stop at a battery level</b><div class="small muted">Applies in Auto & Schedule, not Manual ON</div></div><input type="checkbox" class="tg" data-ch="tgtOn" ${t.enabled?'checked':''}></div>

 openSheet(`<div class="grab"></div><h2>${isNew?'New band':'Battery band'} · ${esc(S.ui.selState)}</h2>

function readBand(){const g=id=>$('#b_'+id);const o={soc:g('soc').value===''?NaN:+g('soc').value};
 ['price_on','price_off'].forEach(k=>o[k]=S.ui.bandMin[k]?'min':(g(k).value===''?NaN:+g(k).value));
 if(g('kmon').checked)o.known_minutes=+g('km').value;return o}
function bandErr(o,i){const blocks=S.ui.draft.states[S.ui.selState].charging_logic;
 if(isNaN(o.soc)||o.soc<0||o.soc>100||!Number.isInteger(o.soc))return 'Battery % must be a whole number 0–100.';
 if(blocks.some((b,j)=>j!==i&&b.soc===o.soc))return 'Another band already starts at '+o.soc+'%.';
 for(const k of ['price_on','price_off'])if(o[k]!=='min'&&(isNaN(o[k])||o[k]<-50||o[k]>100))return 'Prices must be numbers between −50 and 100¢.';
 if(o.known_minutes!=null&&!(Number.isInteger(o.known_minutes)&&o.known_minutes>=1&&o.known_minutes<=59))return 'Minutes must be 1–59.';
 const on=resolveP(o.price_on),off=resolveP(o.price_off);if(nn(on)&&nn(off)&&off<on)return `Stop (${fmtC(off)}) is below start (${fmtC(on)}) — the relay would switch on and immediately off.`;return ''}

 $('#bprev').innerHTML=e?'':`At <b>${o.soc}%+</b> battery: start when price ≤ <b>${fmtP(o.price_on,1)}</b>, stop above <b>${fmtP(o.price_off,1)}</b>${o.known_minutes?`, only after :${pad2(o.known_minutes)} of each hour (price needs ${o.known_minutes} min of data)`:''}.`}

 relay:()=>{let ok=true;const chk=(k,id,a,b)=>{const v=$('#r_'+id).value,bad=v===''||isNaN(+v)||+v<a||+v>b;$(`[data-err=${k}]`).classList.toggle('show',bad);if(bad)ok=false};
  chk('st','st',5,120);chk('fh','fh',0,1440);if(!ok)return;
  putCfg({relay_active_high:$('[data-name=pol] .on').dataset.v==='true',default_relay:$('[data-name=def] .on').dataset.v==='true',stale_min:+$('#r_st').value,full_hold_min:+$('#r_fh').value},'Relay settings saved')}
};
const CH={
 stateSel:t=>{S.ui.draft.state_select=t.value;if(t.value)S.ui.selState=t.value;markDirty();render()},
 minoff:t=>{const v=+t.value;if(t.value===''||isNaN(v)||v<-10||v>10){t.classList.add('in-bad');toast('Offset must be between −10 and 10¢','warn');return}S.ui.minOffDraft=v;markDirty();render()},
 tgtOn:t=>{putCfg({soc_target_enabled:t.checked},t.checked?'Battery target on':'Battery target off').then(()=>{S.st.soc_target={enabled:S.cfg.soc_target_enabled,value:S.cfg.soc_target};modeSheet()})},
 tgtV:t=>{putCfg({soc_target:+t.value},'Stops at '+t.value+'%').then(()=>{S.st.soc_target={enabled:S.cfg.soc_target_enabled,value:S.cfg.soc_target}})},
 kmTog:t=>{$('#b_km').disabled=!t.checked;bandPrev()},
 condOp:t=>{S.ui.condDraft[+t.dataset.i].operator=t.value},
 condV:t=>{S.ui.condDraft[+t.dataset.i].value=t.value===''?NaN:+t.value;t.classList.toggle('in-bad',isNaN(+t.value)||+t.value<0||+t.value>100)},
 win:t=>{const w=S.ui.sched[+t.dataset.w];if(!t.value)return;w[t.dataset.k]=t.value;saveSched()},
 overlay:t=>{S.ui.overlay=t.checked;render()},
 jsonFile:t=>{const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#jsontxt').value=r.result;toast('File loaded — tap Apply','info')};r.readAsText(f)}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t,e)}});
document.addEventListener('change',e=>{const t=e.target.closest('[data-ch]');if(t&&CH[t.dataset.ch])CH[t.dataset.ch](t,e)});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.in;if(k==='tgtL')$('#tgtL').textContent=t.value+'%';if(k==='bprev')bandPrev();if(k==='fwurl')S.ui.fwUrl=t.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
render();poll();loadPrices();
</script>
</body>
</html>
