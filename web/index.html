<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Зарядка</title>
<style>
:root{
  --bg:#eef1f4;--bg2:#e3e8ee;--card:rgba(255,255,255,.72);--card-solid:#fff;--line:rgba(60,70,90,.12);
  --txt:#16191f;--sub:#5d6673;--mute:#8d96a3;--grn:#16c264;--grn2:#0fa957;--grn-soft:rgba(22,194,100,.14);
  --idle:#9aa3ae;--idle-soft:rgba(130,140,155,.16);--amb:#f0a020;--amb-soft:rgba(240,160,32,.16);
  --red:#ec4b4b;--red-soft:rgba(236,75,75,.14);--blu:#2f7cf6;--blu-soft:rgba(47,124,246,.13);
  --sheet:rgba(250,251,253,.94);--shadow:0 6px 24px rgba(30,40,60,.08);--tab:rgba(248,249,251,.82);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c0e12;--bg2:#141821;--card:rgba(32,36,45,.66);--card-solid:#1c2029;--line:rgba(200,210,230,.1);
  --txt:#eef1f6;--sub:#a2abb8;--mute:#6f7886;--grn:#2ee07d;--grn2:#22c86c;--grn-soft:rgba(46,224,125,.15);
  --idle:#7d8693;--idle-soft:rgba(150,160,175,.14);--amb-soft:rgba(240,160,32,.18);--red-soft:rgba(236,75,75,.18);
  --blu-soft:rgba(47,124,246,.2);--sheet:rgba(26,29,37,.95);--shadow:0 6px 24px rgba(0,0,0,.35);--tab:rgba(20,23,30,.85);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;overflow-x:hidden}
body{background:radial-gradient(120% 60% at 50% -10%,var(--bg2),var(--bg) 60%) fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:440px;margin:0 auto;padding:0 16px 110px;transition:max-width .35s ease}
.app.wide{max-width:1000px}
#conn{max-width:440px;margin:0 auto;padding:6px 16px 0}
#conn:empty{display:none}
.nav{display:flex;align-items:center;min-height:44px;gap:8px;position:sticky;top:0;z-index:5;margin:0 -16px;padding:4px 16px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.nav .back{display:flex;align-items:center;color:var(--blu);font-weight:500;margin-left:-6px}
.nav .ttl{flex:1;text-align:center;font-weight:600}
.nav .act{color:var(--blu);font-weight:600;min-width:52px;text-align:right}
.nav .act button{color:var(--blu);font-weight:600}
.big{font-size:32px;font-weight:750;letter-spacing:-.02em;margin:4px 0 12px}
.screen.fade{animation:fade .25s ease}
.screen.push{animation:pushin .32s cubic-bezier(.2,.8,.2,1)}
.screen.pop{animation:popin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes pushin{from{transform:translateX(40px);opacity:0}}
@keyframes popin{from{transform:translateX(-40px);opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--card);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:14px 16px}
.muted{color:var(--sub)}.small{font-size:13px}.tiny{font-size:11.5px}
.hero{text-align:center;padding-top:4px}
.hero h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.02em}
.hero .why{color:var(--sub);font-size:14px;margin:0 auto;max-width:330px}
.ringwrap{position:relative;width:250px;height:250px;margin:14px auto 6px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c .v{font-size:46px;font-weight:760;letter-spacing:-.03em;line-height:1}
.ring-c .v small{font-size:20px;font-weight:600;margin-left:2px}
.ring-c .l{font-size:13px;color:var(--sub);margin-top:6px}
.arc{transition:stroke-dasharray .8s ease,stroke .4s}
.charging .arc{filter:drop-shadow(0 0 8px rgba(22,194,100,.55));animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 16px rgba(22,194,100,.85))}}
.flow{animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}
.relaypill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;font-weight:600;font-size:14px;background:var(--idle-soft);color:var(--sub)}
.relaypill.on{background:var(--grn-soft);color:var(--grn2)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.on .dot{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 14px}
.pchip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13.5px;backdrop-filter:blur(12px)}
.pchip b{font-size:15px}
.modebtn{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:24px;text-align:left;color:#fff;background:linear-gradient(135deg,#2a313d,#434c5c);box-shadow:0 10px 26px rgba(30,40,60,.22);transition:transform .15s}
.modebtn.go{background:linear-gradient(135deg,#0fb85b,#3ad98a)}
.modebtn:active{transform:scale(.98)}
.modebtn .ic{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.modebtn .t{font-weight:700;font-size:17px}.modebtn .s{font-size:12.5px;opacity:.85}
.modebtn .chev{margin-left:auto;opacity:.8}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{padding:13px 14px;border-radius:20px;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:3px}
.tile .h{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tile .h svg{width:15px;height:15px}
.tile .m{font-size:19px;font-weight:700;letter-spacing:-.01em}
.tile .d{font-size:12.5px;color:var(--sub)}
.tile .mini{margin-top:auto;align-self:flex-start;font-size:12.5px;font-weight:600;color:var(--blu);padding:4px 10px;border-radius:99px;background:var(--blu-soft)}
.sysrow{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:10px;padding:11px 14px;font-size:12.5px;color:var(--sub);width:100%;flex-wrap:wrap}
.sysrow span{display:inline-flex;align-items:center;gap:4px}
.ok{color:var(--grn2)}.bad{color:var(--red)}.warn{color:var(--amb)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;margin:8px 0;font-size:13.5px;text-align:left}
.banner.amb{background:var(--amb-soft)}.banner.blu{background:var(--blu-soft)}.banner.red{background:var(--red-soft)}
.banner svg{margin-top:1px}
.group{margin:18px 0 0}
.group>.gh{font-size:12.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin:0 16px 6px}
.group>.gf{font-size:12.5px;color:var(--sub);margin:6px 16px 0}
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:48px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:56px;right:0;border-top:1px solid var(--line)}
.list.noic .row+.row::before{left:14px}
.row .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.row .ico svg{width:17px;height:17px}
.row .lab{flex:1;min-width:0}
.row .lab small{display:block;color:var(--sub);font-size:12.5px}
.row .val{color:var(--sub);font-size:14px;text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--mute);width:16px;height:16px}
button.row:active{background:var(--line)}
.row input[type=text],.row input[type=number],.row input[type=url],.row input[type=password],.row input[type=time],.row select{border:0;background:transparent;text-align:right;outline:none;min-width:0;width:140px;color:var(--sub)}
.row input:focus{color:var(--txt)}
.row input:disabled{opacity:.4}
.err{color:var(--red);font-size:12.5px;padding:0 14px 10px 14px;display:none}
.err.show{display:block}
.in-bad{color:var(--red)!important}
.tg{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--idle-soft);position:relative;cursor:pointer;transition:background .2s;flex:none;border:1px solid var(--line)}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .2s}
.tg:checked{background:var(--grn)}.tg:checked::after{transform:translateX(20px)}
.seg{display:flex;background:var(--idle-soft);border-radius:11px;padding:2px;gap:2px}
.seg button{flex:1;padding:6px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--card-solid);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:14px;font-weight:650;background:var(--blu);color:#fff}
.btn.g{background:var(--grn2)}.btn.s{background:var(--idle-soft);color:var(--txt)}.btn.r{background:var(--red-soft);color:var(--red)}
.btn.w{width:100%}.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:11px}
.btn.r.on{background:var(--red);color:#fff}
.spin{animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,460px);transform:translate(-50%,105%);transition:transform .34s cubic-bezier(.2,.85,.25,1);z-index:41;background:var(--sheet);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.show{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:9px;margin:2px auto 10px;background:var(--mute);opacity:.4}
.sheet h2{font-size:20px;margin:2px 0 4px}
.mcard{width:100%;display:flex;gap:14px;align-items:center;padding:15px 14px;border-radius:20px;background:var(--card);border:2px solid transparent;margin-top:10px;text-align:left;transition:transform .12s,border-color .2s}
.mcard:active{transform:scale(.985)}
.mcard.cur{border-color:var(--grn)}
.mcard:disabled{opacity:.45}
.mcard .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;flex:none}
.mcard .t{font-weight:700;font-size:16.5px}.mcard .s{font-size:13px;color:var(--sub)}
.durs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.dur{padding:18px 10px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:16px}
.dur small{display:block;font-weight:500;font-size:12px;color:var(--sub)}
.dur:disabled{opacity:.4}
.dur.wide{grid-column:span 2}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,440px);display:flex;justify-content:space-around;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:var(--tab);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);z-index:20}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);padding:4px 12px}
.tabbar button.on{color:var(--grn2)}
.tabbar svg{width:24px;height:24px}
@media(min-width:700px){.tabbar{bottom:14px;border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow)}}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);background:var(--card-solid);color:var(--txt);padding:11px 16px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:60;transition:transform .3s cubic-bezier(.2,.85,.25,1);display:flex;gap:8px;align-items:center;font-size:14px;max-width:92vw}
.toast.show{transform:translate(-50%,0)}
.pills{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 10px;margin:0 -16px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{scroll-snap-align:start;flex:0 0 auto;min-width:150px;max-width:220px;padding:11px 14px;border-radius:20px;text-align:left;background:var(--card);border:2px solid var(--line);position:relative}
.pill.sel{border-color:var(--txt)}
.pill .n{font-weight:700;font-size:16px}
.pill .c{font-size:12.5px;color:var(--sub)}
.pill .now{position:absolute;top:9px;right:10px;font-size:10.5px;font-weight:700;color:var(--grn2);background:var(--grn-soft);padding:2px 7px;border-radius:99px}
.pill.add{min-width:auto;display:flex;align-items:center;gap:6px;color:var(--blu);font-weight:600;border-style:dashed}
.batt{flex:none;width:100%;position:relative;padding-top:12px}
.batt .nub{position:absolute;top:0;left:50%;transform:translateX(-50%);width:70px;height:14px;border-radius:7px 7px 0 0;background:var(--mute);opacity:.5}
.cells{border:3px solid var(--mute);border-radius:26px;padding:6px;display:flex;flex-direction:column;gap:6px;min-height:420px;background:var(--card)}
.band{position:relative;border-radius:18px;padding:12px 14px 12px 70px;text-align:left;min-height:74px;display:flex;flex-direction:column;justify-content:center;transition:transform .12s,box-shadow .2s}
.band:active{transform:scale(.985)}
.band .from{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:800;font-size:17px;width:50px;text-align:center;line-height:1.1}
.band .from small{display:block;font-size:10.5px;font-weight:600;opacity:.7}
.band b{font-size:15px}
.band .ex{font-size:12.5px;opacity:.8}
.band.act{box-shadow:0 0 0 3px var(--grn),0 0 22px rgba(22,194,100,.4)}
.band .tag{position:absolute;right:10px;top:8px;font-size:10.5px;font-weight:700;background:var(--grn);color:#fff;padding:2px 7px;border-radius:99px}
.marker{position:absolute;left:-6px;right:-6px;height:0;border-top:2px dashed var(--txt);pointer-events:none}
.marker span{position:absolute;left:8px;top:-11px;background:var(--txt);color:var(--bg);font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px}
.addband{margin-top:8px;width:100%;padding:12px;border-radius:16px;border:2px dashed var(--line);color:var(--blu);font-weight:600}
.savebar{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);width:min(calc(100% - 32px),408px);display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-radius:20px;background:var(--card-solid);box-shadow:0 12px 30px rgba(0,0,0,.22);z-index:25;animation:fade .25s}
.savebar span{flex:1;font-weight:600;font-size:14px}
.fld{display:block;margin-top:12px}
.fld>span{display:block;font-size:12.5px;color:var(--sub);margin:0 0 5px 4px;font-weight:600}
.fld input:not(.tg),.fld select,.fld textarea,.ip{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card-solid);outline:none}
.fld input:focus,.ip:focus{border-color:var(--blu)}
.priceinp{display:flex;gap:8px}
.priceinp input{flex:1}
.minchip{padding:0 14px;border-radius:14px;border:1px solid var(--line);font-weight:650;background:var(--card-solid)}
.minchip.on{background:var(--blu);color:#fff;border-color:var(--blu)}
.preview{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--grn-soft);font-size:14px}
.cond{display:flex;gap:8px;align-items:center;margin-top:8px}
.cond select,.cond input{padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card-solid)}
.cond input{width:80px}
textarea.json{width:100%;min-height:340px;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card-solid);resize:vertical}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
@media(min-width:900px){.app.wide .hgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi{padding:10px 12px;border-radius:16px;background:var(--idle-soft)}
.kpi b{display:block;font-size:17px}.kpi span{font-size:11.5px;color:var(--sub)}
.week{display:grid;grid-template-columns:34px 1fr;gap:5px 8px;align-items:center;font-size:12px;color:var(--sub)}
.wbar{position:relative;height:14px;border-radius:7px;background:var(--idle-soft);overflow:hidden}
.wbar i{position:absolute;top:0;bottom:0;background:var(--grn);border-radius:7px}
.days{display:flex;gap:5px;flex-wrap:wrap}
.days button{width:36px;height:36px;border-radius:50%;background:var(--idle-soft);font-weight:650;font-size:13px;color:var(--sub)}
.days button.on{background:var(--grn);color:#fff}
.prog{height:10px;border-radius:9px;background:var(--idle-soft);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--grn2),var(--grn));transition:width .3s}
.logi{display:flex;gap:10px;padding:10px 14px;align-items:flex-start}
.logi+.logi{border-top:1px solid var(--line)}
.logi .t{font:12px ui-monospace,Menlo,monospace;color:var(--mute);width:68px;flex:none;padding-top:2px}
.logi .k{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.fchips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.fchips button{padding:6px 12px;border-radius:99px;background:var(--idle-soft);font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap}
.fchips button.on{background:var(--txt);color:var(--bg)}
.mt{margin-top:12px}.mt2{margin-top:20px}
.flex{display:flex;gap:8px;align-items:center}
.sp{flex:1}
code{font:12.5px ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div id="conn"></div>
<div class="app" id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="scrim" id="scrim" data-act="closeSheet"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- icons ---------- */
const P={home:'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',bolt:'M13 2L4 14h7l-1 8 9-12h-7z',
clock:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3 2',cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
power:'M12 3v9M6.3 7.5a8 8 0 1 0 11.4 0',off:'M4 4l16 16M12 3v5M6.3 7.5a8 8 0 0 0 11 11.6M18.5 15.5a8 8 0 0 0-.8-8',
wifi:'M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01',
car:'M5 17h14M3 13l2-6h14l2 6v5h-3v-2H6v2H3zM7 13.5h.01M17 13.5h.01',bell:'M6 9a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21h4',
relay:'M7 7h10a5 5 0 0 1 0 10H7A5 5 0 0 1 7 7zM16 10a2 2 0 1 0 0 4a2 2 0 1 0 0-4z',
chip:'M7 7h10v10H7zM10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4',pulse:'M3 12h4l3-8 4 16 3-8h4',

/* ---------- API ---------- */
async function api1(path,method,body){
 const c=new AbortController(),to=setTimeout(()=>c.abort(),9000);
 try{const r=await fetch(path,{method:method||'GET',signal:c.signal,cache:'no-store',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  let j=null;try{j=await r.json()}catch(_){}
  if(!r.ok){const e=new Error((j&&j.error)||('HTTP '+r.status));e.status=r.status;e.errors=(j&&j.errors)||[];
   const ra=r.status===503&&r.headers.get('Retry-After');if(ra)e.retry=Math.min(5,+ra||1)*1000;throw e}
  return {s:r.status,j}}
 catch(e){if(!e.status){e.message=e.name==='AbortError'?'Устройство не ответило':'Нет связи с устройством';e.errors=[]}throw e}
 finally{clearTimeout(to)}}
/* The device serves at most 2 large responses (prices, stats, log) at once and answers 503 + Retry-After
   beyond that: queue large GETs here (2 in flight, FIFO) and retry any GET that gets a Retry-After. */
const BIG=/^\/api\/(prices|stats\/|log)/;let bigN=0;const bigQ=[];
const bigSlot=()=>bigN<2?(bigN++,Promise.resolve()):new Promise(r=>bigQ.push(r));
const bigFree=()=>{const n=bigQ.shift();n?n():bigN--};
async function api(path,method,body){const get=!method||method==='GET',big=get&&BIG.test(path);
 if(big)await bigSlot();
 try{for(let i=0;;i++){try{return await api1(path,method,body)}catch(e){if(!(get&&e.retry&&i<4))throw e;await new Promise(r=>setTimeout(r,e.retry))}}}
 finally{if(big)bigFree()}}
const errMsg=e=>e.message+(e.errors&&e.errors.length?': '+e.errors[0]:'');
function errSheet(title,e){openSheet(`<div class="grab"></div><h2>${esc(title)}</h2><div class="small">${esc(e.message)}</div>${e.errors&&e.errors.length?`<div class="banner red small mt">${I('warn','bad')}<div>${e.errors.map(esc).join('<br>')}</div></div>`:''}<div class="flex mt2"><span class="sp"></span><button class="btn s" data-act="closeSheet">ОК</button></div>`)}

const W={};
function watch(job,fn,q){W[job]={t0:Date.now(),seq:q&&q.seq,busy:false,fn};poll()}
function checkJobs(){const J=S.st.jobs||{};for(const k in W){const w=W[k],j=J[k]||{};
 if(j.state==='queued'||j.state==='running'){w.busy=true;continue}
 const fresh=w.busy||(w.seq!=null&&j.seq!=null&&j.seq>=w.seq);
 if(((j.state==='ok'||j.state==='error')&&fresh)||Date.now()-w.t0>120000){delete W[k];w.fn(j.state==='ok'&&fresh?null:(j.error||'время ожидания истекло'))}}}
let pollT,polling=false;
async function poll(){clearTimeout(pollT);if(document.hidden||polling)return;polling=true;
 const prevUp=S.st.uptime_s;
 try{const {j}=await api('/api/status');S.st=j;S.rx=Date.now();const first=!S.ok;S.ok=true;
  if(S.reboot&&(S.fail>0||j.uptime_s<S.reboot.up||(prevUp!=null&&j.uptime_s<prevUp))){const R=S.reboot;S.reboot=null;S.ota=null;S.ui.otaWant=null;
   if(R.ver&&j.fw.version===R.ver)toast('Обновлено до v'+esc(R.ver));else if(R.ver)toast('Снова на связи, v'+esc(j.fw.version)+(j.fw.rollback?' (откат)':''),'warn');else toast('Устройство снова на связи');
   loadCfg();loadLogic()}
  S.fail=0;checkJobs();if(first){loadCfg();loadLogic()}
  if(Date.now()-S.prAt>300000&&(cur()==='home'||cur()==='history'))loadPrices()}
 catch(e){S.fail++}
 polling=false;renderConn();renderLive();if(S.ui.durM&&$('#durs'))$('#durs').outerHTML=durBtns(S.ui.durM); /* keep "до 21:00 · ещё N минут" live */
 pollT=setTimeout(poll,Object.keys(W).length||S.reboot||S.fail?(S.fail>3?3000:1000):5000)}

 else c.innerHTML=''}

function savedBlock(){const d=D();if(!isPrice()||!S.lg||d.block<0)return null;const L=S.lg.logic.states;const st=d.fallback?L.default:L[d.state];return st&&st.charging_logic?st.charging_logic[d.block]:null}
function condText(cs){if(!cs||!cs.length)return 'Само не включается — только принудительно';
 return 'Когда заряд '+cs.map(c=>`${c.operator.replace('>=','≥').replace('<=','≤')} ${c.value}%`).join(' и ')}
function winText(w){const d=w.days.slice().sort();
 const set=d.join(',');const ds=set==='1,2,3,4,5'?'Пн–Пт':set==='0,6'?'Сб–Вс':set==='0,1,2,3,4,5,6'?'Ежедневно':WEEK.filter(x=>d.includes(x)).map(x=>DAYN[x]).join(' ');
 return `${ds} ${w.start}–${w.end}${nn(w.max_price)?' ≤ '+fmtC(w.max_price):''}`}
const sched=()=>(S.cfg&&S.cfg.schedule)||[];
/* editable copy; loadCfg() resets it to null in the background, so always go through this */
const schedDraft=()=>S.ui.sched||(S.ui.sched=clone(sched()));
function nextWindowStart(){const n=now();if(n==null)return null;const d=cd(n),day=d.getUTCDay(),nm=d.getUTCHours()*60+d.getUTCMinutes();let best=null;
 for(let k=0;k<8;k++)for(const w of sched()){if(!w.days.includes((day+k)%7))continue;const dt=k*1440+tm(w.start)-nm;if(dt>0&&(best==null||dt<best))best=dt}
 return best==null?null:n-d.getUTCSeconds()+best*60}
function next7(){const n=now(),d=cd(n);let dt=7*60-(d.getUTCHours()*60+d.getUTCMinutes());if(dt<=0)dt+=1440;return n-d.getUTCSeconds()+dt*60}
function nextCharge(){
 const s=S.st,d=D(),m=s.mode;
 if(s.relay&&s.car.status==='charging')return {m:'Сейчас',d:m==='manual_on'?'включено вручную':'пока цена не вырастет'};
 if(s.relay)return {m:'Реле включено',d:'машина не берёт ток'};
 if(m==='manual_off')return s.until?{m:fmtT(s.until),d:'потом снова Авто (по цене)'}:{m:'Не запланировано',d:'Ручное ВЫКЛ, пока не смените'};
 if(!clk()||!s.price.known&&m!=='schedule')return {m:'После запуска',d:'нужны часы и свежие цены'};
 if(d.src==='overlay')return {m:'Не нужно',d:d.reason};
 if(m==='schedule'){const t=nextWindowStart();return t?{m:fmtD(t).split(' ')[0]+' '+fmtT(t),d:'следующее окно расписания'}:{m:'—',d:'нет окон'}}
 if(isPrice()&&nn(d.price_on)&&S.pr){const on=d.price_on,h=hourNow(),T=S.pr.day_ahead_today,M=S.pr.day_ahead_tomorrow;
  const seq=[];for(let k=h+1;k<24;k++)seq.push([k,daH(T,k),0]);if(M)for(let k=0;k<7;k++)seq.push([k,daH(M,k),1]);
  const hit=seq.find(x=>nn(x[1])&&x[1]<=on);
  let res=hit?{m:'~'+pad2(hit[0])+':00',d:`прогноз ${fmtC(hit[1])} ≤ старт ${fmtC(on)}`}:{m:'Не раньше 07:00',d:`минимум прогноза ${fmtC(s.price.lowest7)} > старт ${fmtC(on)}`};
  if(m==='schedule_price'){const t=nextWindowStart();if(t&&(!hit||t<now()+3600*(hit[0]+(hit[2]?24:0)-h)))res={m:fmtT(t),d:'окно расписания'}}
  return res}
 return {m:'—',d:''}}
function overlaps(logic){const out=[];const iv=cs=>{let lo=0,li=true,hi=100,hi_=true;
  for(const c of cs){const v=+c.value;if(c.operator==='>'||c.operator==='>='){const inc=c.operator==='>=';if(v>lo||(v===lo&&!inc)){lo=v;li=inc}}else{const inc=c.operator==='<=';if(v<hi||(v===hi&&!inc)){hi=v;hi_=inc}}}
  return {lo,li,hi,hi_}};
 const ne=a=>a.lo<a.hi||(a.lo===a.hi&&a.li&&a.hi_);
 const st=Object.entries(logic.states).filter(([n,s])=>(s.entry_conditions||[]).length);
 for(let i=0;i<st.length;i++)for(let j=i+1;j<st.length;j++){const a=iv(st[i][1].entry_conditions),b=iv(st[j][1].entry_conditions);
  let lo=a.lo,li=a.li;if(b.lo>lo||(b.lo===lo&&!b.li)){lo=b.lo;li=b.li}let hi=a.hi,hi_=a.hi_;if(b.hi<hi||(b.hi===hi&&!b.hi_)){hi=b.hi;hi_=b.hi_}
  if(ne(a)&&ne(b)&&ne({lo,li,hi,hi_}))out.push(`«${st[i][0]}» и «${st[j][0]}» оба подходят при заряде ${lo===hi?lo+'%':(li?'[':'(')+lo+'–'+hi+(hi_?']':')')+'%'} — выигрывает первое по порядку, состояние может переключаться туда-обратно`)}
 return out}
function validateLogic(o){const e=[];if(!o||typeof o!=='object'||!o.states||typeof o.states!=='object'||Array.isArray(o.states))return ['Нет объекта "states"'];
 const ns=Object.keys(o.states);if(!ns.length)e.push('Нужно хотя бы одно состояние');
 for(const n of ns){const st=o.states[n];if(!st||typeof st!=='object'){e.push(`${n}: должно быть объектом`);continue}
  const cs=st.entry_conditions===undefined?[]:st.entry_conditions;if(!Array.isArray(cs))e.push(`${n}: entry_conditions должен быть списком`);
  else cs.forEach((c,i)=>{if(c.type!=='soc')e.push(`${n}: условие ${i+1}: type должен быть "soc"`);if(!OPS.includes(c.operator))e.push(`${n}: условие ${i+1}: operator должен быть одним из > >= < <=`);if(typeof c.value!=='number'||c.value<0||c.value>100)e.push(`${n}: условие ${i+1}: value должно быть 0–100`)});
  if(st.charging_logic!==undefined&&!Array.isArray(st.charging_logic))e.push(`${n}: charging_logic должен быть списком`);
  else (st.charging_logic||[]).forEach((b,i)=>{if(typeof b.soc!=='number'||b.soc<0||b.soc>100)e.push(`${n}: диапазон ${i+1}: soc должен быть 0–100`);
   ['price_on','price_off'].forEach(k=>{if(!(typeof b[k]==='number'||b[k]==='min'))e.push(`${n}: диапазон ${i+1}: ${k} должен быть числом или "min"`)});
   if(b.known_minutes!=null&&!(Number.isInteger(b.known_minutes)&&b.known_minutes>=0&&b.known_minutes<60))e.push(`${n}: диапазон ${i+1}: known_minutes должен быть 0–59`)})}
 if(o.state_select&&!o.states[o.state_select])e.push(`state_select: состояния «${o.state_select}» нет`);return e}

 if(LIVE[id])return render();
 if(PART[id]){const el=$('#'+PART[id][0]);if(el){el.outerHTML=PART[id][1]();return}}
 if(force&&!(id==='logic'&&S.ui.dirty)&&!document.activeElement.matches('input,textarea,select'))render()}
const NAVACT={notify:`<button data-act="save" data-f="notify">Сохранить</button>`,car:`<button data-act="save" data-f="car">Сохранить</button>`,relay:`<button data-act="save" data-f="relay">Сохранить</button>`,log:`<button data-act="logRefresh">Обновить</button>`};
const loading=()=>`<div class="pad muted small" style="text-align:center">${I('refresh','spin')} Загрузка…</div>`;

/* ---------- screens ---------- */
const SCR={};
SCR.home=()=>{
 const s=S.st,d=D(),car=s.car||{},ch=s.relay&&car.status==='charging',soc=nn(car.soc)?Math.round(car.soc):null,man=s.mode==='manual_on'||s.mode==='manual_off';
 let title;
 if(!S.ok)title='Подключение…';
 else if(!clk()||!s.price.known&&!man)title='Запуск';
 else if(ch)title=s.mode==='manual_on'?'Заряжается (вручную)':'Заряжается';
 else if(s.relay)title='Реле ВКЛ — зарядки нет';
 else if(s.mode==='manual_off')title='Зарядка выключена';
 else title=d.src==='overlay'?'Пока хватит':'Ждём низкой цены';
 const C=2*Math.PI*104,len=soc==null?0:C*soc/100,col=ch?'url(#rg)':s.relay?'var(--grn)':'var(--idle)';
 const tgt=s.soc_target&&s.soc_target.enabled?s.soc_target.value:null;
 const ta=tgt!=null?(tgt/100)*2*Math.PI:0;
 const ring=`<div class="ringwrap ${ch?'charging':''}"><svg viewBox="0 0 240 240"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0fb85b"/><stop offset="1" stop-color="#7cf0b0"/></linearGradient>
  <mask id="mk"><circle cx="120" cy="120" r="104" fill="none" stroke="#fff" stroke-width="20" stroke-dasharray="${len} ${C}" stroke-linecap="round"/></mask></defs>
  <circle cx="120" cy="120" r="104" fill="none" stroke="var(--idle-soft)" stroke-width="20"/>
  <circle class="arc" cx="120" cy="120" r="104" fill="none" stroke="${col}" stroke-width="20" stroke-linecap="round" stroke-dasharray="${len} ${C}"/>
  ${ch?`<circle class="flow" mask="url(#mk)" cx="120" cy="120" r="104" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="20" stroke-dasharray="3 15"/>`:''}
  ${tgt!=null?`<line x1="${120+92*Math.cos(ta)}" y1="${120+92*Math.sin(ta)}" x2="${120+116*Math.cos(ta)}" y2="${120+116*Math.sin(ta)}" stroke="var(--txt)" stroke-width="3" stroke-linecap="round"/>`:''}
 </svg><div class="ring-c">${ch&&nn(car.kw)?`<div class="v">${car.kw.toFixed(1)}<small>кВт</small></div><div class="l">${soc==null?'':soc+'% · '}заряжается</div>`:`<div class="v">${soc==null?'—':soc}<small>%</small></div><div class="l">${car.soc_live?'заряд батареи':'последний известный заряд'}${tgt!=null?' · цель '+tgt+'%':''}</div>`}</div></div>`;
 const tone=priceTone();const pr=s.price;
 const needle=pr.known?Math.max(0,Math.min(1,(pr.current+1)/7)):.5;const na=Math.PI*(1-needle);
 const gauge=`<svg width="34" height="20" viewBox="0 0 34 20"><path d="M3 18a14 14 0 0 1 9-13" stroke="#16c264" stroke-width="4" fill="none"/><path d="M13 4.6a14 14 0 0 1 8 0" stroke="#f0a020" stroke-width="4" fill="none"/><path d="M22 5a14 14 0 0 1 9 13" stroke="#ec4b4b" stroke-width="4" fill="none"/>${pr.known?`<line x1="17" y1="18" x2="${17+12*Math.cos(na)}" y2="${18-12*Math.sin(na)}" stroke="var(--txt)" stroke-width="2.4" stroke-linecap="round"/>`:''}<circle cx="17" cy="18" r="2.4" fill="var(--txt)"/></svg>`;
 const pchip=`<button class="pchip" data-act="priceSheet">${gauge}<span><b class="${tone==='grn'?'ok':tone==='red'?'bad':tone==='amb'?'warn':''}">${pr.known?fmtC(pr.current):'—'}</b> ${pr.known?(pr.estimated?'по прогнозу':'сейчас'):'цены пока нет'}</span>${I('chev','chev')}</button>`;
 const B=s.banners||{};let banners='';
 if(B.relay_on_not_charging)banners+=`<div class="banner amb">${I('warn','warn')}<div><b>Реле ВКЛ, но машина не заряжается.</b><br>${car.status==='not_detected'?'Машина не найдена по Bluetooth — она дома и подключена?':'Машина берёт &lt; '+(car.threshold_w??500)+' Вт. Проверьте вилку.'} <span class="muted tiny">(Только здесь — без уведомления.)</span></div></div>`;
 if(B.no_clock||(S.ok&&!clk()))banners+=`<div class="banner blu">${I('info')}<div><b>Запуск (работает ${fmtUp(s.uptime_s)}).</b> Часов ещё нет (ждём NTP), поэтому цены не загружаются и расписание не работает. Реле в положении по умолчанию: <b>${s.relay_default?'ВКЛ':'ВЫКЛ'}</b>. Ручной режим «бессрочно» работает.</div></div>`;
 else if(B.price_stale)banners+=`<div class="banner blu">${I('info')}<div>Данные о цене устарели (&gt; ${pr.stale_min??20} мин, прогноза нет) → реле по умолчанию.</div></div>`;
 if(B.ap_mode)banners+=`<button class="banner blu" style="width:100%" data-act="push" data-s="wifi">${I('wifi')}<div><b>Включена точка доступа ${esc(s.wifi.ap_ssid)}.</b> ${s.wifi.ssid?'Wi‑Fi «'+esc(s.wifi.ssid)+'» не подключён.':'Сеть Wi‑Fi ещё не сохранена.'} Нажмите, чтобы подключиться.</div></button>`;
 if(B.rollback)banners+=`<button class="banner amb" style="width:100%" data-act="push" data-s="firmware">${I('warn','warn')}<div><b>Работа после отката.</b> Последнее обновление не прошло проверку.</div></button>`;
 const md=MODES[s.mode]||MODES.auto;const nc=nextCharge();const sb=savedBlock();
 const ses=s.session,ls=s.last_session;
 const sesTile=ses&&s.relay?`<div class="m">${nn(ses.kwh)?ses.kwh.toFixed(1):'—'} кВт·ч</div><div class="d">${fmtCost(ses.cost_c)} · с ${fmtT(ses.start)}</div>`:ls?`<div class="m">${nn(ls.kwh)?ls.kwh.toFixed(1):'—'} кВт·ч</div><div class="d">${fmtCost(ls.cost_c)} · до ${fmtT(ls.end)} ${ls.end&&now()&&dayKey(ls.end)===dayKey(now())?'сегодня':ls.end?fmtD(ls.end):''}</div>`:`<div class="m">—</div><div class="d">сессий пока нет</div>`;
 return `<div class="hero ${ch?'charging':''}">
  <h1>${title}</h1><p class="why">${esc(d.reason)}</p>${ring}
  <span class="relaypill ${s.relay?'on':''}"><span class="dot"></span>Реле ${s.relay?'ВКЛ':'ВЫКЛ'}${d.src==='default'?' · по умолчанию':''}</span>
  <div class="chips">${pchip}</div></div>${banners}
  <button class="modebtn ${s.relay?'go':''}" data-act="modeSheet"><span class="ic">${I(md.ic)}</span><span><div class="s">Режим</div><div class="t">${md.t}${s.until?' · до '+fmtT(s.until):''}</div><div class="s">${tgt!=null?'Стоп на '+tgt+'% · ':''}Нажмите, чтобы сменить</div></span>${I('chev','chev')}</button>
  <div class="grid2">
   <div class="tile card"><div class="h">${I('clock')}Следующая зарядка</div><div class="m">${nc.m}</div><div class="d">${esc(nc.d)}</div></div>
   <div class="tile card"><div class="h">${I('car')}Машина</div><div class="m ${car.status==='not_detected'?'bad':car.status==='charging'?'ok':''}">${CARTXT[car.status]||esc(car.status)}</div><div class="d">${soc!=null?soc+'% · ':''}${car.last_seen?'на связи '+ago(car.last_seen):'по памяти'}${car.status==='charging'&&nn(car.kw)?' · '+car.kw.toFixed(1)+' кВт':''}</div><button class="mini" data-act="poll">${W.car_poll?I('refresh','spin'):'Опросить'}</button></div>
   <button class="tile card" data-act="tab" data-t="logic"><div class="h">${I('batt')}Правило</div>${isPrice()?`<div class="m">${esc(d.state)}${d.how==='forced'?' <span class="tiny warn">принуд.</span>':''}</div><div class="d">${d.block>=0?`${sb?'от '+sb.soc+'%: ':''}старт ≤ ${fmtC(d.price_on)}, стоп &gt; ${fmtC(d.price_off)}`:'нет диапазонов'}</div>`:`<div class="m">${man?'Вручную':'—'}</div><div class="d">${man?'ценовые правила на паузе':'ценовые правила не работают'}</div>`}</button>
   <div class="tile card"><div class="h">${I('bolt')}${ses&&s.relay?'Эта сессия':'Прошлая сессия'}</div>${sesTile}</div>
  </div>
  <button class="sysrow card" data-act="push" data-s="diag"><span class="${clk()?'ok':'warn'}">${I(clk()?'check':'clock')}${clk()?'Часы ок':'Нет часов'}</span><span>${I('wifi')}${s.wifi.sta?s.wifi.rssi+' дБм':s.wifi.ap?'Точка доступа':'—'}</span><span>${I('chip')}${kb(s.heap.free)}</span><span>работает ${fmtUp(s.uptime_s)}</span>${I('chev','chev')}</button>`};

SCR.logic=()=>{
 if(!S.lg)return `<div class="big">Ценовые правила</div>`+loading();
 if(!S.ui.draft){S.ui.draft=clone(S.lg.logic);if(!S.ui.draft.states)S.ui.draft.states={}}
 const Dr=S.ui.draft;const names=Object.keys(Dr.states);const d=D(),car=S.st.car||{};
 if(!S.ui.selState||!Dr.states[S.ui.selState])S.ui.selState=(isPrice()&&Dr.states[d.state])?d.state:names[0];
 const sel=S.ui.selState,st=Dr.states[sel]||{entry_conditions:[],charging_logic:[]};
 const sb=savedBlock();
 const blocks=st.charging_logic||[];const order=blocks.map((b,i)=>i).sort((a,b)=>blocks[b].soc-blocks[a].soc);
 const isCur=isPrice()&&d.state===sel,soc=nn(car.soc)?Math.round(car.soc):null;
 const bands=order.map((i,k)=>{const b=blocks[i];const lo=b.soc,hi=k===0?100:blocks[order[k-1]].soc;const last=k===order.length-1;
  const eager=Math.max(0,Math.min(1,((resolveP(b.price_on)??0)+2)/6));const bg=`rgba(22,194,100,${(.12+eager*.5).toFixed(2)})`;
  const active=isCur&&!d.fallback&&sb&&sb.soc===b.soc;let mk='';
  const rlo=last?0:lo;if(isCur&&soc!=null&&soc>=rlo&&soc<=hi&&hi>rlo){const top=(hi-soc)/(hi-rlo)*100;mk=`<div class="marker" style="top:${top.toFixed(1)}%"><span>${soc}% сейчас</span></div>`}
  return `<button class="band ${active?'act':''}" style="flex:${Math.max(hi-rlo,1)} 1 0;background:${bg}" data-act="editBand" data-i="${i}">${mk}${active?'<span class="tag">АКТИВЕН</span>':''}<div class="from">${last&&lo>0?'&lt;'+hi:lo}%<small>${last&&lo>0?'и ниже':'до '+hi+'%'}</small></div><b>старт ≤ ${fmtP(b.price_on,1)} · стоп &gt; ${fmtP(b.price_off,1)}</b><div class="ex">${b.known_minutes?'Ждёт :'+pad2(b.known_minutes)+' каждого часа ради надёжной цены':'Реагирует на цену сразу'}</div></button>`}).join('');
 const ov=S.ui.dirty?overlaps(Dr):(S.lg.warnings||[]);const ss=Dr.state_select||'';
 const mo=minOff();
 const howT={forced:'принудительно',entered:'выполнено условие входа',sticky:'сохранено с прошлого раза'};
 return `<div class="big">Ценовые правила</div>
 <div class="card pad small"><b>Сейчас:</b> ${isPrice()?`состояние <b>${esc(d.state)}</b> (${howT[d.how]||esc(d.how)}${d.fallback?', диапазоны из «default»':''}), ${sb?'диапазон от '+sb.soc+'%: ':''}старт ≤ ${fmtC(d.price_on)}, стоп &gt; ${fmtC(d.price_off)}.`:'ценовые правила сейчас не решают — '+esc(d.reason)+'.'} <span class="muted">Заряд ${soc==null?'неизвестен':soc+'%'}${car.soc_live?'':' (последний известный)'}.</span></div>
 <div class="group" style="margin-top:14px"><div class="list card noic"><div class="row"><div class="lab">Состояние<small>${ss?'Принудительно — условия входа не учитываются':'Авто — по уровню заряда'}</small></div><select data-ch="stateSel" style="width:150px">${['',...names].map(n=>`<option value="${esc(n)}" ${n===ss?'selected':''}>${n?'Принуд.: '+esc(n):'Авто'}</option>`).join('')}</select></div></div></div>
 <div class="tiny muted" style="margin:16px 4px 6px">СОСТОЯНИЯ — листайте · нажмите, чтобы открыть</div>
 <div class="pills">${names.map(n=>`<button class="pill ${n===sel?'sel':''}" data-act="selState" data-n="${esc(n)}">${isPrice()&&d.state===n?'<span class="now">СЕЙЧАС</span>':''}<div class="n">${esc(n)}</div><div class="c">${esc(condText(Dr.states[n].entry_conditions))}</div></button>`).join('')}<button class="pill add" data-act="addState">${I('plus')}Состояние</button></div>
 ${ov.length?`<div class="banner amb">${I('warn','warn')}<div><b>Условия входа пересекаются</b><br>${ov.map(esc).join('<br>')}<br><span class="tiny">Сделайте так, чтобы «=» было ровно с одной стороны каждой границы.</span></div></div>`:''}
 ${names.length?`<div class="flex" style="margin:10px 2px 4px"><div class="sp"><b style="font-size:18px">${esc(sel)}</b><div class="small muted">${esc(condText(st.entry_conditions))}</div></div><button class="btn s sm" data-act="editState">Изменить</button></div>
 <div class="batt"><div class="nub"></div><div class="cells">${bands||`<div class="muted small" style="padding:30px;text-align:center">Нет диапазонов. ${Dr.states.default&&sel!=='default'?'Используются диапазоны состояния «default».':'Реле перейдёт в положение по умолчанию.'}</div>`}</div></div>
 <button class="addband" data-act="addBand">+ Добавить диапазон заряда</button>
 <div class="legend" style="margin:8px 4px"><span>Чем зеленее диапазон, тем выше цена старта (заряжает охотнее). Нажмите на диапазон, чтобы изменить.</span></div>`:'<div class="card pad muted small mt">Состояний пока нет — добавьте.</div>'}
 <div class="group"><div class="gh">Дополнительно</div><div class="list card noic">
  <div class="row"><div class="lab">Надбавка к «min»<small>min = минимум до 07:00 ${fmtC(S.st.price.lowest7)} + надбавка</small></div><input type="number" step="0.1" value="${nn(mo)?mo:''}" data-ch="minoff" style="width:70px">¢</div>
  <button class="row" data-act="push" data-s="json"><div class="lab">JSON<small>Просмотр, вставка, импорт и экспорт logic.json</small></div>${I('chev','chev')}</button></div>
  <div class="gf">При сохранении диапазоны сортируются по заряду сверху вниз. Операторы буквальные: «&gt;» — строго, «≥» — включительно.</div></div>
 ${S.ui.dirty?`<div class="savebar"><span>Правила не сохранены</span><button class="btn s sm" data-act="discard">Отменить</button><button class="btn g sm" data-act="saveLogic">Сохранить</button></div>`:''}`};

SCR.json=()=>`<p class="small muted">Тот же формат, что у <code>logic.json</code> из bolt-monitor. Вставьте для импорта; «Применить» загрузит его в редактор (затем «Сохранить» на вкладке «Правила»).</p>
 <textarea class="json" id="jsontxt" spellcheck="false">${esc(JSON.stringify(S.ui.draft||(S.lg&&S.lg.logic)||{states:{}},null,2))}</textarea>
 <div class="err" id="jsonerr"></div>
 <div class="flex mt" style="flex-wrap:wrap"><button class="btn g" data-act="jsonApply">Применить</button><button class="btn s" data-act="jsonExport">Экспорт</button><label class="btn s">Из файла<input type="file" accept=".json,application/json" data-ch="jsonFile" hidden></label></div>`;

function rowNav(id,ic,col,lab,val){return `<button class="row" data-act="push" data-s="${id}"><span class="ico" style="background:${col}">${I(ic)}</span><span class="lab">${lab}</span><span class="val">${esc(val||'')}</span>${I('chev','chev')}</button>`}
SCR.settings=()=>{const c=S.cfg,s=S.st,w=s.wifi||{};return `<div class="big">Настройки</div>
 <div class="group"><div class="list card">${rowNav('schedule','cal','#2f7cf6','Расписание',c?(sched().map(winText).join(', ')||'Нет'):'…')}
  <button class="row" data-act="tab" data-t="logic"><span class="ico" style="background:#16c264">${I('batt')}</span><span class="lab">Ценовые правила</span><span class="val">${S.lg?pl(Object.keys(S.lg.logic.states||{}).length,['состояние','состояния','состояний']):'…'}</span>${I('chev','chev')}</button>
  <button class="row" data-act="modeSheet"><span class="ico" style="background:#f0a020">${I('bolt')}</span><span class="lab">Режим и целевой заряд</span><span class="val">${(MODES[s.mode]||MODES.auto).t}</span>${I('chev','chev')}</button></div></div>
 <div class="group"><div class="gh">Подключения</div><div class="list card">
  ${rowNav('wifi','wifi','#2f7cf6','Wi‑Fi',w.sta?w.ssid:w.ap?'Точка доступа':(w.ssid||'Не задано'))}${rowNav('car','car','#7a5af5','Связь с машиной',c?(c.dongle_mac||'не задан').slice(-5):'…')}${rowNav('notify','bell','#ec4b4b','Уведомления',c?(c.pushover.enabled?'Pushover вкл':'Выкл'):'…')}</div></div>
 <div class="group"><div class="gh">Устройство</div><div class="list card">
  ${rowNav('relay','relay','#6b7380','Реле и защита',c?(c.relay_active_high?'HIGH = ВКЛ':'LOW = ВКЛ'):'…')}${rowNav('firmware','chip','#0fa957','Прошивка',s.fw.version?'v'+s.fw.version+(s.fw.rollback?' · откат':''):'')}${rowNav('diag','pulse','#e8590c','Диагностика',clk()?'ОК':'Нет часов')}${rowNav('log','list','#495057','Журнал событий',S.log?pl(S.log.length,['событие','события','событий']):'')}</div></div>
 <div class="group"><div class="gh">Данные</div><div class="list card">${rowNav('history','chart','#0ca5b0','История и статистика','')}</div><div class="gf">Интерфейс устройства: http://${esc(w.ip||w.ap_ip||'192.168.4.1')} · ${esc(w.hostname||'charger.local')}. Только локальная сеть, без входа.</div></div>`};

function winErr(w){if(!w.days.length)return 'Выберите хотя бы один день.';if(w.start===w.end)return 'Начало и конец не могут совпадать.';return ''}
SCR.schedule=()=>{if(!S.cfg)return loading();const ws=schedDraft(),mode=S.st.mode;
 const week=WEEK.map(d=>{let bars='';for(const w of ws){if(winErr(w))continue;const s=tm(w.start)/1440*100,e=tm(w.end)/1440*100;
  if(s<e){if(w.days.includes(d))bars+=`<i style="left:${s}%;width:${e-s}%"></i>`}else{if(w.days.includes(d))bars+=`<i style="left:${s}%;right:0"></i>`;if(w.days.includes((d+6)%7))bars+=`<i style="left:0;width:${e}%"></i>`}}
  return `<span>${DAYN[d]}</span><div class="wbar">${bars}</div>`}).join('');
 const inSched=mode==='schedule'||mode==='schedule_price';
 return `<div class="card pad"><div class="week">${week}<span></span><div class="flex tiny" style="justify-content:space-between"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div></div></div>
 ${ws.map((w,i)=>`<div class="group"><div class="gh">Окно ${i+1}${S.st.schedule_active===i&&inSched?' · <span class="ok">действует сейчас</span>':''}</div><div class="card pad">
  <div class="days">${WEEK.map(d=>`<button class="${w.days.includes(d)?'on':''}" data-act="day" data-w="${i}" data-d="${d}">${DAYN[d]}</button>`).join('')}</div>
  <div class="flex mt"><label class="fld sp" style="margin:0"><span>Реле ВКЛ с</span><input type="time" value="${w.start}" data-ch="win" data-w="${i}" data-k="start"></label><label class="fld sp" style="margin:0"><span>до</span><input type="time" value="${w.end}" data-ch="win" data-w="${i}" data-k="end"></label></div>
  <label class="fld"><span>Макс. цена, ¢ (необязательно) — ВКЛ, только пока цена не выше</span><input type="number" step="0.1" min="-100" max="100" placeholder="Без лимита" value="${nn(w.max_price)?w.max_price:''}" data-ch="winCap" data-w="${i}"></label>
  <div class="err ${winErr(w)?'show':''}" style="padding:8px 0 0">${winErr(w)}</div>
  <div class="flex mt"><span class="small muted sp">${tm(w.start)>tm(w.end)?'Ночное окно — заканчивается утром следующего дня.':''}</span><button class="btn r sm" data-act="delWin" data-w="${i}">${I('trash')}Удалить</button></div></div></div>`).join('')}
 ${ws.length<8?'<button class="addband mt" data-act="addWin">+ Добавить окно</button>':''}

 let h='';

 else if(ph==='error'&&o.error)h=`<div class="banner red mt">${I('warn','bad')}<div><b>Обновление не удалось.</b> ${esc(o.error)}</div></div>`;

  ${m.notes?`<div class="small muted mt">${esc(m.notes)}</div>`:''}${m.direct_bin?`<div class="small warn mt">${I('warn')} Прямой .bin — без проверки sha256.</div>`:''}
  ${inst?`<div class="prog"><i style="width:${S.reboot?100:o.pct||0}%"></i></div><div class="small muted mt">${S.reboot||ph==='done'?'Проверено. Перезагрузка — переподключимся автоматически…':ph==='verifying'?'Проверка…':'Загрузка и запись… '+(o.pct||0)+'%'} Реле остаётся как есть.</div>`:`<button class="btn g w mt" data-act="otaInstall">Установить v${esc(m.version)}</button>`}</div></div>`;

/* charts */
function priceChart(){const W=600,H=250,pl=30,pr=34,pt=12,pb=24;const P=S.pr||{},n=clk()?hourFloat():null,mid=clk()?midnight():0;
 const T=P.day_ahead_today||[],A=P.actual_today||[],five=(P.five_min||[]).map(p=>[(p[0]-mid)/3600,p[1]]).filter(p=>p[0]>=0&&p[0]<=24&&nn(p[1]));
 const all=T.concat(A,five.map(p=>p[1])).filter(nn);
 const lo=Math.floor(Math.min(-1,...all)),hi=Math.ceil(Math.max(6,...all));const x=h=>pl+h/24*(W-pl-pr),y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
 const step=hi-lo>40?10:hi-lo>16?5:2;let g='';
 const det=(S.det||[]).filter(r=>r[0]>=mid).sort((a,b)=>a[0]-b[0]);
 let st=null;det.forEach((r,i)=>{const on=r[4]===1,t=(r[0]-mid)/3600;if(on&&st==null)st=t;if(st!=null&&(!on||i===det.length-1)){const e=on?(n??t):t;g+=`<rect x="${x(st)}" y="${pt}" width="${Math.max(2,x(e)-x(st))}" height="${H-pt-pb}" fill="var(--grn)" opacity=".13"/>`;st=null}});
 for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--mute)">${v}</text>`;
 for(let h=0;h<=24;h+=6)g+=`<text x="${x(h)}" y="${H-6}" font-size="11" text-anchor="middle" fill="var(--mute)">${pad2(h%24)}:00</text>`;
 const d=D();if(nn(d.price_on)&&nn(d.price_off)){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(d.price_on)}" y2="${y(d.price_on)}" stroke="var(--grn2)" stroke-dasharray="2 4"/><line x1="${pl}" x2="${W-pr}" y1="${y(d.price_off)}" y2="${y(d.price_off)}" stroke="var(--red)" stroke-dasharray="2 4"/>`}
 if(S.ui.overlay&&det.length){const kws=det.map(r=>nn(r[2])?Math.abs(r[2])/1000:0),mx=Math.max(8,...kws);const kwy=v=>H-pb-v/mx*(H-pt-pb)*.45;
  const pw=`M${x((det[0][0]-mid)/3600)} ${kwy(0)}`+det.map((r,i)=>`L${x((r[0]-mid)/3600).toFixed(1)} ${kwy(kws[i]).toFixed(1)}`).join('')+`L${x((det[det.length-1][0]-mid)/3600)} ${kwy(0)}Z`;
  let sc='',pen='M';for(const r of det){if(!nn(r[3])){pen='M';continue}sc+=`${pen}${x((r[0]-mid)/3600).toFixed(1)} ${(pt+(100-r[3])/100*(H-pt-pb)).toFixed(1)}`;pen='L'}
  g+=`<path d="${pw}" fill="#7a5af5" opacity=".18"/>${sc?`<path d="${sc}" fill="none" stroke="#7a5af5" stroke-width="1.6" stroke-dasharray="5 3"/>`:''}`;
  for(let v=0;v<=100;v+=50)g+=`<text x="${W-pr+4}" y="${pt+(100-v)/100*(H-pt-pb)+4}" font-size="10" fill="#7a5af5">${v}%</text>`}
 const stp=(arr,upto)=>{let s='',pen='M';for(let h=0;h<upto;h++){const v=daH(arr,h);if(!nn(v)){pen='M';continue}s+=`${pen}${x(h)} ${y(v)}H${x(h+1)}`;pen='L'}return s};
 if(T.length)g+=`<path d="${stp(T,24)}" fill="none" stroke="var(--mute)" stroke-width="1.6" stroke-dasharray="5 4"/>`;
 if(n!=null&&A.length)g+=`<path d="${stp(A,Math.floor(n))}" fill="none" stroke="var(--amb)" stroke-width="2.2"/>`;

 cancelNewBand:t=>{S.ui.draft.states[S.ui.selState].charging_logic.splice(+t.dataset.i,1);closeSheet()},
 minTog:t=>{const k=t.dataset.k;S.ui.bandMin[k]=!S.ui.bandMin[k];t.classList.toggle('on');const inp=$('#b_'+k);inp.disabled=S.ui.bandMin[k];if(!S.ui.bandMin[k]&&inp.value==='')inp.value=k==='price_on'?2:3;bandPrev()},
 doneBand:t=>{const i=+t.dataset.i,o=readBand(),e=bandErr(o,i);if(e){bandPrev();return}
  const st=S.ui.draft.states[S.ui.selState];st.charging_logic[i]=o;st.charging_logic.sort((a,b)=>b.soc-a.soc);markDirty();closeSheet();render()},
 delBand:t=>{const st=S.ui.draft.states[S.ui.selState];st.charging_logic.splice(+t.dataset.i,1);markDirty();closeSheet();render();toast('Диапазон удалён — сохраните правила')},
 editState:()=>stateSheet(false),
 addState:()=>{if(!S.ui.draft)return;let n='Новое состояние',k=2;while(S.ui.draft.states[n])n='Новое состояние '+k++;S.ui.draft.states[n]={entry_conditions:[],charging_logic:[{soc:0,price_on:2,price_off:3}]};S.ui.selState=n;markDirty();render();stateSheet(true)},
 addCond:()=>{S.ui.condDraft.push({type:'soc',operator:'>=',value:50});S.ui.renderConds()},
 delCond:t=>{S.ui.condDraft.splice(+t.dataset.i,1);S.ui.renderConds()},
 doneState:t=>{const old=t.dataset.old,nn2=$('#s_name').value.trim(),err=$('#s_err');
  let e=!nn2?'Название не может быть пустым.':(nn2!==old&&S.ui.draft.states[nn2])?'Состояние с таким названием уже есть.':new TextEncoder().encode(nn2).length>47?'Слишком длинное название (максимум 47 байт — около 23 русских букв).':'';
  if(!e&&S.ui.condDraft.some(c=>isNaN(c.value)||c.value<0||c.value>100))e='Значения условий — от 0 до 100.';
  if(e){err.textContent=e;err.classList.add('show');return}
  rebuildStates((k,v)=>k===old?[nn2,Object.assign(v,{entry_conditions:S.ui.condDraft})]:[k,v]);
  if(S.ui.draft.state_select===old)S.ui.draft.state_select=nn2;
  S.ui.selState=nn2;markDirty();closeSheet();render()},
 delState:()=>{const n=S.ui.selState;rebuildStates((k,v)=>k===n?null:[k,v]);if(S.ui.draft.state_select===n)S.ui.draft.state_select='';S.ui.selState=null;markDirty();closeSheet();render();toast('Состояние удалено — сохраните правила')},
 discard:()=>{S.ui.draft=null;S.ui.dirty=false;S.ui.minOffDraft=null;render();toast('Изменения отменены','info');loadLogic()},
 saveLogic:async()=>{const ov=overlaps(S.ui.draft);if(ov.length&&!S.ui.ovOk){openSheet(`<div class="grab"></div><h2>Состояния пересекаются</h2><div class="small">${ov.map(esc).join('<br>')}</div><div class="small muted mt">Из-за этого состояние может переключаться туда-обратно на границе.</div><div class="flex mt2"><span class="sp"></span><button class="btn s" data-act="closeSheet">Исправить</button><button class="btn g" data-act="saveAnyway">Всё равно сохранить</button></div>`);return}
  S.ui.ovOk=false;const errs=validateLogic(S.ui.draft);if(errs.length){errSheet('Не удалось сохранить правила',{message:'Исправьте:',errors:errs});return}
  const body=clone(S.ui.draft);for(const st of Object.values(body.states))if(st.charging_logic)st.charging_logic.sort((a,b)=>b.soc-a.soc);
  if(!body.state_select)delete body.state_select;
  try{const {j}=await api('/api/logic','PUT',body);S.lg=j;
   if(S.ui.minOffDraft!=null){try{S.cfg=(await api('/api/config','PUT',{min_offset:S.ui.minOffDraft})).j}catch(e){toast('Правила сохранены, но надбавка: '+esc(errMsg(e)),'warn')}}
   S.ui.draft=null;S.ui.dirty=false;S.ui.minOffDraft=null;render();toast('Правила сохранены'+(j.warnings&&j.warnings.length?' · '+pl(j.warnings.length,['предупреждение','предупреждения','предупреждений']):''));poll()}
  catch(e){errSheet('Устройство отклонило правила',e)}},
 saveAnyway:()=>{S.ui.ovOk=true;closeSheet();ACT.saveLogic()},
 jsonApply:()=>{const el=$('#jsonerr');let o;try{o=JSON.parse($('#jsontxt').value)}catch(e){el.textContent='Некорректный JSON: '+e.message;el.classList.add('show');return}
  const errs=validateLogic(o);if(errs.length){el.innerHTML=errs.slice(0,6).map(esc).join('<br>');el.classList.add('show');return}
  if(!o.state_select)o.state_select='';S.ui.draft=o;S.ui.selState=null;markDirty();pop();toast('Загружено в редактор — проверьте и сохраните')},
 jsonExport:()=>{const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S.ui.draft||S.lg.logic,null,4));a.download='logic.json';a.click();toast('logic.json экспортирован')},
 day:t=>{const w=schedDraft()[+t.dataset.w],d=+t.dataset.d;w.days=w.days.includes(d)?w.days.filter(x=>x!==d):[...w.days,d].sort();saveSched()},
 delWin:t=>{schedDraft().splice(+t.dataset.w,1);saveSched()},
 addWin:()=>{schedDraft().push({days:[0,6],start:'10:00',end:'14:00'});saveSched()},
 logF:t=>{S.ui.logFilter=t.dataset.f;render()},hv:t=>{const v=S.ui.histView=t.dataset.v;render();if(!S[v])loadAgg(v)},logRefresh:()=>loadLog(),
 seg:t=>{t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t))},
 save:t=>SAVE[t.dataset.f](),
 secClr:t=>{const k=t.dataset.k,on=!t.classList.contains('on');t.classList.toggle('on',on);t.textContent=on?'Вернуть':'Очистить';const i=$('#p_'+k);i.disabled=on;if(on)i.value='';
  $('#'+k+'_st').innerHTML=on?'<span class="bad">будет удалён при сохранении</span>':'•••• задан — введите новый для замены'},
 pushTest:async()=>{if(W.push_test)return;if(!clk()){toast('Пока нельзя — для HTTPS нужны часы','warn');return}
  try{const {j:q}=await api('/api/pushover/test','POST',{});toast('Отправка…','refresh');watch('push_test',err=>{toast(err?'Тест не удался: '+esc(err):'Тестовое уведомление отправлено',err?'warn':'check');if(cur()==='notify')$('[data-act=pushTest]').innerHTML=I('bell')+'Отправить тест'},q);$('[data-act=pushTest]').innerHTML=I('refresh','spin')+'Отправить тест'}
  catch(e){toast(esc(errMsg(e))+(e.status===400?' — сначала сохраните ключи':''),'warn')}},
 scan:async t=>{S.ui.scan='busy';renderLive(true);let q=t?'?refresh=1':'';
  for(let k=0;k<20;k++){try{const r=await api('/api/wifi/scan'+q);q='';if(r.s===200&&r.j&&r.j.networks){const seen={};S.ui.scan=r.j.networks.filter(n=>n.ssid&&!seen[n.ssid]&&(seen[n.ssid]=1)).sort((a,b)=>b.rssi-a.rssi);break}}
   catch(e){S.ui.scan={err:e.message};break}await new Promise(r=>setTimeout(r,1500))}
  if(S.ui.scan==='busy')S.ui.scan={err:'Поиск не завершился — попробуйте ещё раз.'};if(cur()==='wifi')render()},
 pickNet:t=>{const n=S.ui.scan[+t.dataset.i];wifiSheet(n.ssid,n.secure,n.ssid===S.st.wifi.ssid)},
 otherNet:()=>wifiSheet(null,true,false),
 netPw:()=>wifiSheet(S.st.wifi.ssid,true,true),
 joinNet:async()=>{const n=S.ui.net,er=$('#w_err'),pwI=$('#w_pw'),pw=pwI?pwI.value:'';const ssid=n.ssid==null?$('#w_ssid').value.trim():n.ssid;
  const bad=m=>{er.textContent=m;er.classList.add('show')};
  if(!ssid)return bad('Введите имя сети.');
  if(pw&&(pw.length<8||pw.length>63))return bad('Пароль Wi‑Fi — от 8 до 63 символов.');
  if(n.secure&&n.ssid!=null&&!pw&&ssid!==S.st.wifi.ssid)return bad('Введите пароль.');
  if(n.known&&!pw)return bad('Введите новый пароль.');
  try{const {j:q}=await api('/api/wifi','POST',{ssid,password:pw});closeSheet();toast('Подключение к '+esc(ssid)+'…','refresh');
   watch('wifi',err=>{toast(err?'Wi‑Fi: '+esc(err):'Подключено к '+esc(ssid),err?'warn':'check');renderLive(true)},q);renderLive(true)}
  catch(e){bad(errMsg(e))}},
 otaReset:()=>{$('#f_url').value=OTA_DEFAULT;S.ui.fwUrl=OTA_DEFAULT},
 otaCheck:async()=>{const u=$('#f_url').value.trim(),e=$('[data-err=url]');let msg='';
  if(!/^https:\/\//i.test(u))msg=/^http:\/\//i.test(u)?'Разрешены только адреса https:// (http не принимается).':'Введите полный адрес https://.';
  else try{new URL(u)}catch(_){msg='Некорректный адрес.'}
  if(!msg&&!clk())msg='Пока нельзя проверить — для HTTPS нужны часы.';
  e.textContent=msg;e.classList.toggle('show',!!msg);if(msg)return;
  try{if(S.cfg&&u!==S.cfg.ota_url){try{S.cfg=(await api('/api/config','PUT',{ota_url:u})).j}catch(_){}}
   await api('/api/ota/check','POST',{url:u});S.ui.otaWant='check';S.ota=Object.assign({},S.ota,{phase:'checking',error:''});render();setTimeout(otaPoll,700)}
  catch(er){e.textContent=errMsg(er);e.classList.add('show')}},
 otaInstall:async()=>{try{await api('/api/ota/install','POST',{});S.ui.otaWant='install';S.ota=Object.assign({},S.ota,{phase:'downloading',pct:0});render();setTimeout(otaPoll,700)}
  catch(e){toast(esc(errMsg(e)),'warn')}},
 reboot:()=>openSheet(`<div class="grab"></div><h2>Перезагрузить?</h2><div class="small muted">Во время запуска реле будет в положении по умолчанию (${S.st.relay_default?'ВКЛ':'ВЫКЛ'}); ручные режимы с ограничением по времени сбросятся. Статистика сохраняется заранее.</div><div class="flex mt2"><span class="sp"></span><button class="btn s" data-act="closeSheet">Отмена</button><button class="btn r" data-act="doReboot">Перезагрузить</button></div>`),
 doReboot:async()=>{closeSheet();try{await api('/api/reboot','POST',{});S.reboot={up:S.st.uptime_s};renderConn();toast('Перезагрузка… вернёмся через ~10 с','refresh');setTimeout(poll,3000)}catch(e){toast(esc(errMsg(e)),'warn')}}
};
const SAVE={
 notify:()=>{const p=S.cfg.pushover,tok=$('#p_tok').value.trim(),usr=$('#p_usr').value.trim(),en=$('#p_en').checked;let ok=true;
  const clr=k=>{const b=$(`[data-act=secClr][data-k=${k}]`);return !!(b&&b.classList.contains('on'))};
  const chk=(k,bad)=>{const e=$(`[data-err=${k}]`);e.classList.toggle('show',!!bad);if(bad)ok=false};
  chk('tok',tok&&!/^[A-Za-z0-9]{30}$/.test(tok));chk('usr',usr&&!/^[A-Za-z0-9]{30}$/.test(usr));
  if(!ok)return;
  if(en&&((!tok&&(!p.token_set||clr('tok')))||(!usr&&(!p.user_set||clr('usr'))))){toast('Чтобы включить, введите токен приложения и ключ пользователя','warn');return}
  const b={enabled:en,device:$('#p_dev').value.trim()};if(tok)b.token=tok;if(usr)b.user=usr;if(clr('tok'))b.token_clear=true;if(clr('usr'))b.user_clear=true;
  putCfg({pushover:b},'Уведомления сохранены')},
 car:()=>{let ok=true;const g=id=>$('#c_'+id).value.trim();const chk=(k,bad)=>{$(`[data-err=${k}]`).classList.toggle('show',bad);if(bad)ok=false};const num=(id,a,b)=>{const v=+g(id);return g(id)===''||isNaN(v)||v<a||v>b};
  chk('mac',!/^([0-9A-F]{2}:){5}[0-9A-F]{2}$/i.test(g('mac')));chk('pon',num('pon',10,3600));chk('poff',num('poff',5,1440));chk('probe',num('probe',0,600));chk('thr',num('thr',0,20000));
  if(!ok)return;putCfg({dongle_mac:g('mac').toUpperCase(),poll_on_s:+g('pon'),poll_off_min:+g('poff'),probe_delay_s:+g('probe'),charge_threshold_w:+g('thr'),power_sign:+$('[data-name=sign] .on').dataset.v},'Связь с машиной сохранена')},
 relay:()=>{let ok=true;const chk=(k,id,a,b)=>{const v=$('#r_'+id).value,bad=v===''||isNaN(+v)||+v<a||+v>b;$(`[data-err=${k}]`).classList.toggle('show',bad);if(bad)ok=false};
  chk('st','st',5,120);chk('fh','fh',0,1440);if(!ok)return;
  putCfg({relay_active_high:$('[data-name=pol] .on').dataset.v==='true',default_relay:$('[data-name=def] .on').dataset.v==='true',stale_min:+$('#r_st').value,full_hold_min:+$('#r_fh').value},'Настройки реле сохранены')}
};
const CH={
 stateSel:t=>{S.ui.draft.state_select=t.value;if(t.value)S.ui.selState=t.value;markDirty();render()},
 minoff:t=>{const v=+t.value;if(t.value===''||isNaN(v)||v<-10||v>10){t.classList.add('in-bad');toast('Надбавка — от −10 до 10¢','warn');return}S.ui.minOffDraft=v;markDirty();render()},
 tgtOn:t=>{putCfg({soc_target_enabled:t.checked},t.checked?'Целевой заряд включён':'Целевой заряд выключен').then(()=>{S.st.soc_target={enabled:S.cfg.soc_target_enabled,value:S.cfg.soc_target};modeSheet()})},
 tgtV:t=>{putCfg({soc_target:+t.value},'Стоп на '+t.value+'%').then(()=>{S.st.soc_target={enabled:S.cfg.soc_target_enabled,value:S.cfg.soc_target}})},
 kmTog:t=>{$('#b_km').disabled=!t.checked;bandPrev()},
 condOp:t=>{S.ui.condDraft[+t.dataset.i].operator=t.value},
 condV:t=>{S.ui.condDraft[+t.dataset.i].value=t.value===''?NaN:+t.value;t.classList.toggle('in-bad',isNaN(+t.value)||+t.value<0||+t.value>100)},
 win:t=>{const w=schedDraft()[+t.dataset.w];if(!t.value)return;w[t.dataset.k]=t.value;saveSched()},
 winCap:t=>{const w=schedDraft()[+t.dataset.w],v=t.value.trim();if(v===''){w.max_price=null;saveSched();return}
  const n=+v;if(isNaN(n)||n<-100||n>100){t.classList.add('in-bad');toast('Макс. цена — от −100 до 100¢ или пусто','warn');return}w.max_price=Math.round(n*10)/10;saveSched()},
 overlay:t=>{S.ui.overlay=t.checked;render()},
 jsonFile:t=>{const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#jsontxt').value=r.result;toast('Файл загружен — нажмите «Применить»','info')};r.readAsText(f)}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t,e)}});
document.addEventListener('change',e=>{const t=e.target.closest('[data-ch]');if(t&&CH[t.dataset.ch])CH[t.dataset.ch](t,e)});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.in;if(k==='tgtL')$('#tgtL').textContent=t.value+'%';if(k==='bprev')bandPrev();if(k==='fwurl')S.ui.fwUrl=t.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
render();poll();loadPrices();
</script>
</body>
</html>
